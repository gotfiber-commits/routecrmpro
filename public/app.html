<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteCRMPro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDlnoisXs3xJAGtyYCBmLRCSuSN0hI2v98&libraries=places,geometry"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1; --primary-dark: #4F46E5; --secondary: #8B5CF6; --accent: #F59E0B;
            --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
            --bg-dark: #0F172A; --bg-card: #1E293B; --bg-hover: #334155;
            --text-primary: #F8FAFC; --text-secondary: #94A3B8; --text-muted: #64748B; --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; }
        
        /* Login */
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%); }
        .login-box { background: var(--bg-card); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { font-size: 2rem; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .company-badge { display: inline-block; background: var(--bg-hover); padding: 0.5rem 1rem; border-radius: 20px; margin-top: 0.75rem; font-size: 0.9rem; color: var(--text-secondary); }
        
        /* Forms */
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; }
        .form-input, .form-select { width: 100%; padding: 0.75rem 1rem; background: var(--bg-dark); border: 2px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 1rem; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
        
        /* Buttons */
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.95rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
        .btn-block { width: 100%; justify-content: center; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* Layout */
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .sidebar-header { padding: 1.25rem; border-bottom: 1px solid var(--border); }
        .sidebar-logo { display: flex; align-items: center; gap: 0.75rem; }
        .sidebar-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .sidebar-logo h2 { font-size: 1rem; }
        .company-name { font-size: 0.8rem; color: var(--text-muted); }
        .sidebar-nav { flex: 1; padding: 1rem 0; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); border-left-color: var(--primary); }
        .sidebar-footer { padding: 1rem; border-top: 1px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .user-avatar { width: 36px; height: 36px; background: var(--bg-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-name { font-weight: 600; font-size: 0.9rem; }
        .user-role { font-size: 0.75rem; color: var(--text-muted); text-transform: capitalize; }
        .main-content { flex: 1; margin-left: 250px; padding: 1.5rem; min-height: 100vh; }
        
        /* Cards & Tables */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; border: 1px solid var(--border); }
        .stat-card-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .stat-card-value { font-size: 1.75rem; font-weight: 700; }
        .stat-card-label { font-size: 0.85rem; color: var(--text-muted); }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 1rem; font-weight: 600; }
        .card-body { padding: 1.25rem; }
        .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        .table-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .table-title { font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-dark); font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); }
        tr:hover { background: var(--bg-hover); }
        tr.table-row-hover { transition: all 0.15s ease; }
        tr.table-row-hover:hover { background: rgba(99, 102, 241, 0.1); transform: translateX(2px); }
        tr:last-child td { border-bottom: none; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
        .status-active, .status-paid, .status-completed, .status-delivered { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-pending, .status-planned, .status-scheduled, .status-available { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-inactive, .status-cancelled, .status-overdue, .status-maintenance { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status-in_progress, .status-on_route { background: rgba(99, 102, 241, 0.2); color: var(--primary); }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
        .modal { background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-card); z-index: 1; }
        .modal-header h3 { font-size: 1.1rem; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .modal-body { padding: 1.25rem; }
        .modal-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; position: sticky; bottom: 0; background: var(--bg-card); }
        
        /* Map */
        .map-container { height: 400px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        #dashboard-map, #route-map { height: 100%; width: 100%; }
        
        /* Misc */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
        .success-message { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        .action-buttons { display: flex; gap: 0.5rem; }
        .text-muted { color: var(--text-muted); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        
        /* Route Builder Layout */
        .route-builder-grid { display: grid; grid-template-columns: 350px 1fr; gap: 1rem; height: calc(100vh - 220px); }
        
        /* Mobile Navigation */
        .mobile-header { display: none; position: fixed; top: 0; left: 0; right: 0; height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border); z-index: 200; padding: 0 1rem; align-items: center; justify-content: space-between; }
        .mobile-header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
        .hamburger-btn { width: 44px; height: 44px; border: none; background: transparent; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .hamburger-btn:active { background: var(--bg-input); }
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 150; }
        .sidebar-close { display: none; }
        
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: -280px; width: 280px; height: 100vh; transition: left 0.3s ease; z-index: 200; }
            .sidebar.open { left: 0; }
            .sidebar-close { display: block; position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px; border: none; background: var(--bg-input); color: var(--text-primary); font-size: 1.25rem; border-radius: 8px; cursor: pointer; }
            .mobile-overlay.open { display: block; }
            .main-content { margin-left: 0; padding-top: 56px; }
            .form-row, .form-row-3, .grid-2 { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .table-container { overflow-x: auto; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .page-header .btn { width: 100%; }
            .route-builder-grid { grid-template-columns: 1fr; height: auto; }
            .route-builder-grid .map-panel { height: 350px; order: -1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =====================================================
        // Weather Radar Overlay (RainViewer - Free, No API Key)
        // Shows live precipitation radar on Google Maps
        // =====================================================
        
        // Cache for RainViewer data
        let rainViewerData = null;
        let rainViewerLastFetch = 0;

        async function fetchRainViewerData() {
            const now = Date.now();
            // Cache for 5 minutes
            if (rainViewerData && (now - rainViewerLastFetch) < 300000) return rainViewerData;
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                rainViewerData = await res.json();
                rainViewerLastFetch = now;
                return rainViewerData;
            } catch (err) {
                console.error('RainViewer fetch error:', err);
                return null;
            }
        }

        function clearWeatherOverlays(map) {
            if (map && map.overlayMapTypes) {
                map.overlayMapTypes.clear();
            }
        }

        function addRadarOverlay(map, tilePath, opacity = 0.5) {
            const overlay = new google.maps.ImageMapType({
                getTileUrl: function(coord, zoom) {
                    return `https://tilecache.rainviewer.com${tilePath}/256/${zoom}/${coord.x}/${coord.y}/6/1_1.png`;
                },
                tileSize: new google.maps.Size(256, 256),
                opacity: opacity,
                name: 'rainviewer'
            });
            map.overlayMapTypes.push(overlay);
            return overlay;
        }

        // Weather Radar Control component (reusable) - accepts mapRef (useRef)
        function WeatherControl({ mapRef: mapRefProp, compact }) {
            const [radarOn, setRadarOn] = useState(false);
            const [radarFrames, setRadarFrames] = useState([]);
            const [frameIdx, setFrameIdx] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [radarTime, setRadarTime] = useState('');
            const [loadingRadar, setLoadingRadar] = useState(false);
            const playRef = useRef(null);

            const getMap = () => mapRefProp?.current || mapRefProp;

            // Load radar data
            const toggleRadar = async () => {
                const map = getMap();
                if (!map) return;

                if (radarOn) {
                    // Turn off
                    clearWeatherOverlays(map);
                    setRadarOn(false);
                    setRadarFrames([]);
                    setPlaying(false);
                    if (playRef.current) clearInterval(playRef.current);
                    return;
                }

                setLoadingRadar(true);
                try {
                    const data = await fetchRainViewerData();
                    if (!data) {
                        alert('Could not load weather radar data. Check your internet connection.');
                        return;
                    }

                    // Combine past frames + nowcast (forecast)
                    const past = (data.radar?.past || []).slice(-6); // Last 6 frames (~30 min)
                    const nowcast = (data.radar?.nowcast || []).slice(0, 3); // Next 3 forecast frames
                    const allFrames = [...past, ...nowcast];
                    
                    if (allFrames.length === 0) {
                        alert('No radar data available for this region.');
                        return;
                    }

                    setRadarFrames(allFrames);
                    const lastIdx = past.length - 1; // Start at "now"
                    setFrameIdx(lastIdx);
                    setRadarOn(true);

                    // Show current frame
                    clearWeatherOverlays(map);
                    addRadarOverlay(map, allFrames[lastIdx].path);
                    setRadarTime(formatRadarTime(allFrames[lastIdx].time, lastIdx >= past.length));
                } catch (err) {
                    console.error('Radar error:', err);
                    alert('Error loading radar: ' + err.message);
                } finally {
                    setLoadingRadar(false);
                }
            };

            // Navigate frames
            const showFrame = (idx) => {
                const map = getMap();
                if (!map || !radarFrames.length) return;
                const clampedIdx = Math.max(0, Math.min(radarFrames.length - 1, idx));
                setFrameIdx(clampedIdx);
                clearWeatherOverlays(map);
                addRadarOverlay(map, radarFrames[clampedIdx].path);
                
                // Determine if this is a forecast frame
                const pastCount = (rainViewerData?.radar?.past || []).slice(-6).length;
                setRadarTime(formatRadarTime(radarFrames[clampedIdx].time, clampedIdx >= pastCount));
            };

            // Play/pause animation
            const togglePlay = () => {
                if (playing) {
                    clearInterval(playRef.current);
                    setPlaying(false);
                } else {
                    setPlaying(true);
                    let idx = frameIdx;
                    playRef.current = setInterval(() => {
                        idx = (idx + 1) % radarFrames.length;
                        showFrame(idx);
                    }, 700);
                }
            };

            // Cleanup interval on unmount
            useEffect(() => {
                return () => { if (playRef.current) clearInterval(playRef.current); };
            }, []);

            function formatRadarTime(timestamp, isForecast) {
                const d = new Date(timestamp * 1000);
                const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                return isForecast ? `${time} (forecast)` : time;
            }

            const btnStyle = {
                fontSize: compact ? '0.7rem' : '0.75rem',
                padding: compact ? '0.2rem 0.5rem' : '0.3rem 0.6rem'
            };

            return (
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap'}}>
                    <button
                        className={`btn btn-sm ${radarOn ? 'btn-primary' : 'btn-secondary'}`}
                        onClick={toggleRadar}
                        disabled={loadingRadar}
                        style={btnStyle}
                        title="Toggle live weather radar"
                    >
                        {loadingRadar ? '⏳' : '🌧️'} {radarOn ? 'Radar On' : 'Weather Radar'}
                    </button>
                    
                    {radarOn && radarFrames.length > 1 && (
                        <>
                            <button className="btn btn-sm btn-secondary" onClick={() => showFrame(frameIdx - 1)} disabled={frameIdx === 0} style={btnStyle}>◀</button>
                            <button className={`btn btn-sm ${playing ? 'btn-primary' : 'btn-secondary'}`} onClick={togglePlay} style={btnStyle}>
                                {playing ? '⏸' : '▶'}
                            </button>
                            <button className="btn btn-sm btn-secondary" onClick={() => showFrame(frameIdx + 1)} disabled={frameIdx >= radarFrames.length - 1} style={btnStyle}>▶</button>
                            <span style={{fontSize: compact ? '0.65rem' : '0.75rem', color: radarTime.includes('forecast') ? '#F59E0B' : 'var(--text-muted)', fontWeight: radarTime.includes('forecast') ? '600' : 'normal'}}>
                                {radarTime}
                            </span>
                        </>
                    )}
                </div>
            );
        }

        // =====================================================
        // Weather Forecast (Open-Meteo API - Free, No Key)
        // =====================================================
        async function fetchWeatherForecast(lat, lng) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max,weathercode&current=temperature_2m,relative_humidity_2m,windspeed_10m,weathercode&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=7`;
                const res = await fetch(url);
                return await res.json();
            } catch (err) {
                console.error('Weather fetch error:', err);
                return null;
            }
        }

        function getWeatherIcon(code) {
            // WMO Weather interpretation codes
            if (code === 0) return '☀️';
            if (code <= 3) return '⛅';
            if (code <= 49) return '🌫️';
            if (code <= 59) return '🌦️';
            if (code <= 69) return '🌧️';
            if (code <= 79) return '🌨️';
            if (code <= 82) return '🌧️';
            if (code <= 86) return '❄️';
            if (code <= 99) return '⛈️';
            return '🌤️';
        }

        function getWeatherDesc(code) {
            if (code === 0) return 'Clear';
            if (code <= 3) return 'Partly Cloudy';
            if (code <= 49) return 'Fog';
            if (code <= 55) return 'Drizzle';
            if (code <= 59) return 'Freezing Drizzle';
            if (code <= 65) return 'Rain';
            if (code <= 69) return 'Freezing Rain';
            if (code <= 75) return 'Snow';
            if (code <= 79) return 'Snow Grains';
            if (code <= 82) return 'Rain Showers';
            if (code <= 86) return 'Snow Showers';
            if (code <= 99) return 'Thunderstorm';
            return 'Unknown';
        }

        // Weather Forecast Panel component
        function WeatherForecastPanel({ dc, onClose }) {
            const [forecast, setForecast] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!dc?.lat || !dc?.lng) return;
                fetchWeatherForecast(parseFloat(dc.lat), parseFloat(dc.lng)).then(data => {
                    setForecast(data);
                    setLoading(false);
                });
            }, [dc]);

            if (!dc) return null;

            const getDayName = (dateStr, idx) => {
                if (idx === 0) return 'Today';
                if (idx === 1) return 'Tomorrow';
                return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
            };

            // Determine delivery risk based on weather
            const getDeliveryRisk = (code, wind, precip) => {
                if (code >= 95) return { level: 'high', label: '⛔ High Risk', color: '#EF4444', tip: 'Thunderstorms — consider delaying routes' };
                if (code >= 71 || (code >= 56 && code <= 59)) return { level: 'high', label: '⛔ High Risk', color: '#EF4444', tip: 'Snow/Freezing conditions — hazardous driving' };
                if (wind > 30) return { level: 'medium', label: '⚠️ Caution', color: '#F59E0B', tip: 'High winds — secure loads, reduce speed' };
                if (precip > 0.5) return { level: 'medium', label: '⚠️ Caution', color: '#F59E0B', tip: 'Significant precipitation — allow extra drive time' };
                if (code >= 51 || code >= 80) return { level: 'low', label: '🟡 Minor', color: '#F59E0B', tip: 'Light precipitation — normal operations with caution' };
                return { level: 'none', label: '✅ Clear', color: '#10B981', tip: 'Good conditions for deliveries' };
            };

            return (
                <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <div className="modal" style={{maxWidth:'700px',width:'95%'}}>
                        <div className="modal-header">
                            <h3>🌤️ Weather Forecast — {dc.name}</h3>
                            <button className="modal-close" onClick={onClose}>&times;</button>
                        </div>
                        <div className="modal-body" style={{padding:'0'}}>
                            {loading ? (
                                <div style={{padding:'3rem',textAlign:'center'}}><div className="spinner"></div><p className="text-muted" style={{marginTop:'1rem'}}>Loading forecast...</p></div>
                            ) : !forecast?.current ? (
                                <div style={{padding:'2rem',textAlign:'center',color:'var(--danger)'}}>Could not load weather data</div>
                            ) : (
                                <>
                                    {/* Current conditions */}
                                    <div style={{padding:'1.5rem',background:'linear-gradient(135deg, #1e293b, #334155)',display:'flex',alignItems:'center',gap:'1.5rem',flexWrap:'wrap'}}>
                                        <div style={{fontSize:'3rem'}}>{getWeatherIcon(forecast.current.weathercode)}</div>
                                        <div>
                                            <div style={{fontSize:'2rem',fontWeight:'700'}}>{Math.round(forecast.current.temperature_2m)}°F</div>
                                            <div style={{color:'var(--text-muted)',fontSize:'0.9rem'}}>{getWeatherDesc(forecast.current.weathercode)}</div>

        // =====================================================
        // API Helper
        // =====================================================
        const api = {
            token: null,
            tenant: null,
            setToken(t) { 
                this.token = t; 
                if (t) {
                    localStorage.setItem('token', t);
                } else {
                    localStorage.removeItem('token');
                }
            },
            setTenant(t) { 
                this.tenant = t; 
                if (t) {
                    localStorage.setItem('tenant', t);
                }
            },
            getTenant() {
                if (this.tenant) return this.tenant;
                // Try URL first, then localStorage
                const urlTenant = new URLSearchParams(window.location.search).get('tenant');
                if (urlTenant) {
                    this.tenant = urlTenant;
                    localStorage.setItem('tenant', urlTenant);
                    return urlTenant;
                }
                return localStorage.getItem('tenant') || '';
            },
            async request(endpoint, options = {}) {
                // Ensure we have a token for protected endpoints
                if (!this.token && !endpoint.includes('/auth/')) {
                    const storedToken = localStorage.getItem('token');
                    if (storedToken) {
                        this.token = storedToken;
                    }
                }
                
                const tenant = this.getTenant();
                const url = `/.netlify/functions${endpoint}${endpoint.includes('?') ? '&' : '?'}tenant=${tenant}`;
                
                try {
                    const res = await fetch(url, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            ...(this.token && { 'Authorization': `Bearer ${this.token}` }),
                            ...options.headers
                        }
                    });
                    
                    const data = await res.json();
                    
                    if (!res.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    
                    return data;
                } catch (err) {
                    // Network errors
                    if (err.name === 'TypeError' && err.message.includes('fetch')) {
                        throw new Error('Network error. Please check your connection.');
                    }
                    throw err;
                }
            }
        };

        const getTenant = () => api.getTenant();

        function DashboardView({ data, onRefresh, onNavigate }) {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markersRef = useRef([]);
            const searchInputRef = useRef(null);
            const autocompleteRef = useRef(null);
            const searchMarkerRef = useRef(null);
            const [searchedPlace, setSearchedPlace] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [addingCustomer, setAddingCustomer] = useState(false);
            const [weatherDC, setWeatherDC] = useState(null);
            const [dcRoutes, setDcRoutes] = useState({});
            const [selectedDCForRoutes, setSelectedDCForRoutes] = useState(null);
            const [dcRoutesLoading, setDcRoutesLoading] = useState(false);
            const [dcRoutesList, setDcRoutesList] = useState([]);

            // Load active routes for a specific DC
            const loadDCRoutes = async (dc) => {
                setSelectedDCForRoutes(dc);
                setDcRoutesLoading(true);
                try {
                    const allRoutes = await api.request('/routes-v2/runs');
                    // Filter routes for this DC that are scheduled or in progress
                    const filteredRoutes = allRoutes.filter(r => 
                        r.dc_id === dc.id && 
                        (r.status === 'scheduled' || r.status === 'in_progress')
                    );
                    setDcRoutesList(filteredRoutes);
                } catch (err) {
                    console.error('Error loading DC routes:', err);
                    setDcRoutesList([]);
                } finally {
                    setDcRoutesLoading(false);
                }
            };

            // Initialize map once (but wait for data to determine center)
            useEffect(() => {
                if (!mapRef.current) return;
                
                // Only initialize map once
                if (!mapInstance.current) {
                    // Find headquarters for initial center
                    const headquarters = (data?.distributionCenters || []).find(dc => dc.is_headquarters || dc.is_primary) 
                        || (data?.distributionCenters || []).find(dc => dc.lat && dc.lng)
                        || null;
                    const hqLat = headquarters?.lat ? parseFloat(headquarters.lat) : 39.8283;
                    const hqLng = headquarters?.lng ? parseFloat(headquarters.lng) : -98.5795;
                    const hasHQ = headquarters?.lat && headquarters?.lng;

                    const map = new google.maps.Map(mapRef.current, {
                        center: { lat: hqLat, lng: hqLng },
                        zoom: hasHQ ? 9 : 4,
                        mapTypeControl: true,
                        streetViewControl: true,
                        fullscreenControl: true
                    });
                    mapInstance.current = map;

                    // Draw service area circle around HQ
                    if (hasHQ) {
                        const radiusInMeters = 500 * 1609.34; // 500 miles
                        new google.maps.Circle({
                            map, center: { lat: hqLat, lng: hqLng }, radius: radiusInMeters,
                            fillColor: '#6366F1', fillOpacity: 0.06, strokeColor: '#6366F1', strokeOpacity: 0.3, strokeWeight: 2
                        });
                    }

                    // Places Autocomplete for address search
                    if (searchInputRef.current) {
                        const autocomplete = new google.maps.places.Autocomplete(searchInputRef.current, {
                            types: ['address'], componentRestrictions: { country: 'us' },
                            fields: ['place_id', 'geometry', 'name', 'formatted_address', 'address_components']
                        });
                        autocomplete.bindTo('bounds', map);
                        autocompleteRef.current = autocomplete;

                        autocomplete.addListener('place_changed', () => {
                            const place = autocomplete.getPlace();
                            if (!place.geometry?.location) return;

                            let street = '', city = '', state = '', zip = '';
                            (place.address_components || []).forEach(comp => {
                                if (comp.types.includes('street_number')) street = comp.long_name + ' ';
                                if (comp.types.includes('route')) street += comp.long_name;
                                if (comp.types.includes('locality')) city = comp.long_name;
                                if (comp.types.includes('administrative_area_level_1')) state = comp.short_name;

                            setSearchedPlace(placeData);

                    if (searchInputRef.current) searchInputRef.current.value = '';

                } catch (err) {
                    alert('Error adding customer: ' + err.message);
                } finally {
                    setAddingCustomer(false);
                }
            };

            const pendingOrders = (data?.orders || []).filter(o => o.status === 'pending').length;
            const [activeRuns, setActiveRuns] = useState(0);
            const [routeTemplates, setRouteTemplates] = useState(0);

            useEffect(() => {
                const loadRouteStats = async () => {
                    try {
                        const [runsResult, templatesResult] = await Promise.all([
                            api.request('/routes-v2/runs?status=in_progress'),
                            api.request('/routes-v2/templates')
                        ]);
                        setActiveRuns(runsResult?.length || 0);
                        setRouteTemplates(templatesResult?.length || 0);
                    } catch (err) {
                        console.log('Could not load route stats:', err.message);
                    }
                };
                loadRouteStats();
            }, []);

                            <h3>🗺️ Operations Map</h3>
                            <div style={{display:'flex',alignItems:'center',gap:'1rem',flex:'1',justifyContent:'flex-end',flexWrap:'wrap'}}>
                                <div style={{position:'relative',flex:'1',maxWidth:'400px',minWidth:'200px'}}>
                                    <input 
                                        ref={searchInputRef}
                                        type="text" 
                                        placeholder="🔍 Search address to add..." 
                                        className="form-input"
                                        style={{paddingRight:'2.5rem',fontSize:'0.9rem'}}
                                    />

                                        <button 
                                            onClick={() => {
                                                setSearchedPlace(null);
                                                if (searchMarkerRef.current) searchMarkerRef.current.setMap(null);
                                                if (searchInputRef.current) searchInputRef.current.value = '';
                                            }}
                                            style={{position:'absolute',right:'8px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:'1.2rem',color:'var(--text-muted)'}}

                                    )}
                                </div>
                            </div>
                        </div>
                        {/* Weather Radar + Legend Bar */}
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.5rem 1rem',background:'var(--bg-dark)',borderBottom:'1px solid var(--border)',flexWrap:'wrap',gap:'0.5rem'}}>

                            <div style={{fontSize:'0.75rem',color:'var(--text-muted)',display:'flex',gap:'0.75rem',flexWrap:'wrap'}}>
                                <span>🏭 DCs</span>
                                <span>🚚 Trucks</span>
                                <span style={{display:'flex',alignItems:'center',gap:'3px'}}><span style={{width:'8px',height:'8px',borderRadius:'50%',background:'#10B981'}}></span>OK</span>
                                <span style={{display:'flex',alignItems:'center',gap:'3px'}}><span style={{width:'8px',height:'8px',borderRadius:'50%',background:'#F59E0B'}}></span>Low</span>
                                <span style={{display:'flex',alignItems:'center',gap:'3px'}}><span style={{width:'8px',height:'8px',borderRadius:'50%',background:'#EF4444'}}></span>Critical</span>
                                <span style={{display:'flex',alignItems:'center',gap:'3px'}}><span style={{width:'8px',height:'8px',borderRadius:'50%',background:'#8B5CF6'}}></span>Search</span>
                            </div>
                        </div>
                        <div className="map-container" style={{height:'600px'}}>
                            <div ref={mapRef} id="dashboard-map"></div>
                        </div>
                        {/* DC Quick-Access Bar */}
                        {(data?.distributionCenters || []).length > 0 && (
                            <div style={{padding:'0.5rem 1rem',background:'var(--bg-dark)',borderTop:'1px solid var(--border)',display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap'}}>
                                <span style={{fontSize:'0.75rem',color:'var(--text-muted)',fontWeight:'600'}}>DCs:</span>
                                {(data?.distributionCenters || []).map(dc => (
                                    <div key={dc.id} style={{display:'flex',gap:'0.25rem'}}>
                                        <button 
                                            className="btn btn-sm btn-secondary"
                                            onClick={() => {
                                                if (mapInstance.current && dc.lat && dc.lng) {
                                                    mapInstance.current.panTo({ lat: parseFloat(dc.lat), lng: parseFloat(dc.lng) });
                                                    mapInstance.current.setZoom(11);
                                                }
                                            }}
                                            style={{fontSize:'0.7rem',padding:'0.2rem 0.5rem'}}
                                            title={`Pan to ${dc.name}`}
                                        >
                                            🏭 {dc.name}
                                        </button>
                                        <button 
                                            className="btn btn-sm btn-secondary"
                                            onClick={() => loadDCRoutes(dc)}
                                            style={{fontSize:'0.7rem',padding:'0.2rem 0.4rem'}}
                                            title={`View active routes for ${dc.name}`}
                                        >
                                            🚀
                                        </button>
                                        <button 
                                            className="btn btn-sm btn-secondary"
                                            onClick={() => setWeatherDC(dc)}
                                            style={{fontSize:'0.7rem',padding:'0.2rem 0.4rem'}}
                                            title={`Weather forecast for ${dc.name}`}
                                        >
                                            🌤️
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                            <div style={{padding:'1rem',background:'var(--bg-dark)',borderTop:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem'}}>
                                <div>
                                    <strong style={{color:'#8B5CF6'}}>📍 {searchedPlace.formatted_address}</strong>
                                    <div style={{fontSize:'0.85rem',color:'var(--text-muted)',marginTop:'0.25rem'}}>

                                    </div>
                                </div>
                                <div style={{display:'flex',gap:'0.5rem'}}>
                                    <button className="btn btn-primary btn-sm" onClick={() => setShowAddModal(true)}>+ Add as Customer</button>
                                    <button className="btn btn-success btn-sm" onClick={() => onNavigate && onNavigate('route-templates', searchedPlace)}>+ Add to Route</button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-card-icon">👥</div>
                            <div className="stat-card-value">{data?.customers?.length || 0}</div>
                            <div className="stat-card-label">Total Customers</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-card-icon">📦</div>
                            <div className="stat-card-value">{pendingOrders}</div>
                            <div className="stat-card-label">Pending Orders</div>
                        </div>
                        <div className="stat-card" style={{cursor:'pointer'}} onClick={() => onNavigate('active-routes')}>
                            <div className="stat-card-icon">🚀</div>
                            <div className="stat-card-value">{activeRuns}</div>
                            <div className="stat-card-label">Active Routes</div>
                        </div>
                        <div className="stat-card" style={{cursor:'pointer'}} onClick={() => onNavigate('route-templates')}>

                                            <div>Lat: {searchedPlace.lat.toFixed(6)}, Lng: {searchedPlace.lng.toFixed(6)}</div>
                                        </div>

                                            </div>

                                    <div style={{background:'rgba(99, 102, 241, 0.1)',padding:'0.75rem',borderRadius:'8px',marginBottom:'1rem',fontSize:'0.85rem'}}>

                                        <ul style={{margin:'0.5rem 0 0 1.25rem',padding:0}}>
                                            <li>Customer Name: <strong>{searchedPlace.name || 'New Customer'}</strong></li>
                                            <li>Type: <strong>Commercial</strong></li>
                                            <li>Tank Size: <strong>500 gallons</strong> (default)</li>
                                            <li>Payment Terms: <strong>Net 30</strong></li>
                                        </ul>
                                    </div>
                                    <p style={{color:'var(--text-muted)',fontSize:'0.85rem',margin:0}}>
                                        You can edit all details after creation from the Customers page.
                                    </p>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-secondary" onClick={() => setShowAddModal(false)}>Cancel</button>
                                    <button className="btn btn-primary" onClick={handleQuickAddCustomer} disabled={addingCustomer}>
                                        {addingCustomer ? 'Adding...' : '+ Add Customer'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Row 1: Orders & Distribution Centers */}
                    <div className="grid-2">
                        <div className="card">
                            <div className="card-header" style={{cursor:'pointer'}} onClick={() => onNavigate('orders')}>
                                <h3>📦 Recent Orders</h3>
                                <span style={{fontSize:'0.75rem',color:'var(--primary)'}}>View All →</span>
                            </div>
                            <div style={{maxHeight:'280px',overflow:'auto'}}>
                                <table>
                                    <thead><tr><th>Order #</th><th>Customer</th><th>Gallons</th><th>Status</th></tr></thead>
                                    <tbody>
                                        {(data?.orders || []).slice(0, 6).map(o => (
                                            <tr key={o.id} style={{cursor:'pointer'}} onClick={() => onNavigate('orders')} className="table-row-hover">
                                                <td><strong style={{color:'var(--primary)'}}>{o.order_number}</strong></td>
                                                <td>{o.customer_name}</td>
                                                <td>{o.gallons_requested}</td>
                                                <td><span className={`status-badge status-${o.status}`}>{o.status}</span></td>
                                            </tr>
                                        ))}
                                        {(!data?.orders || data.orders.length === 0) && <tr><td colSpan="4" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No orders yet</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card">
                            <div className="card-header" style={{cursor:'pointer'}} onClick={() => onNavigate('dcs')}>
                                <h3>🏭 Distribution Centers</h3>
                                <span style={{fontSize:'0.75rem',color:'var(--primary)'}}>View All →</span>
                            </div>
                            <div style={{maxHeight:'280px',overflow:'auto'}}>
                                <table>
                                    <thead><tr><th>Code</th><th>Name</th><th>Location</th><th>Capacity</th><th>Actions</th></tr></thead>
                                    <tbody>
                                        {(data?.distributionCenters || []).slice(0, 6).map(dc => (
                                            <tr key={dc.id} className="table-row-hover">
                                                <td><strong style={{color:'var(--primary)',cursor:'pointer'}} onClick={() => onNavigate('dcs')}>{dc.code}</strong></td>
                                                <td>{dc.name}</td>
                                                <td>{dc.city}, {dc.state}</td>
                                                <td>{(dc.capacity_gallons || 0).toLocaleString()} gal</td>
                                                <td style={{whiteSpace:'nowrap'}}>
                                                    <button className="btn btn-sm btn-secondary" style={{marginRight:'0.25rem',padding:'0.2rem 0.4rem',fontSize:'0.7rem'}} onClick={() => { if (dc.lat && dc.lng && mapInstance.current) { mapInstance.current.panTo({lat:parseFloat(dc.lat),lng:parseFloat(dc.lng)}); mapInstance.current.setZoom(12); } }} title="Show on map">📍</button>
                                                    <button className="btn btn-sm btn-secondary" style={{marginRight:'0.25rem',padding:'0.2rem 0.4rem',fontSize:'0.7rem'}} onClick={() => setWeatherDC(dc)} title="Weather forecast">🌤️</button>
                                                    <button className="btn btn-sm btn-secondary" style={{padding:'0.2rem 0.4rem',fontSize:'0.7rem'}} onClick={() => { window._selectedDcId = dc.id; onNavigate('route-templates'); }} title="View routes">🗺️</button>
                                                </td>
                                            </tr>
                                        ))}
                                        {(!data?.distributionCenters || data.distributionCenters.length === 0) && <tr><td colSpan="5" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No distribution centers yet</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Row 2: Routes & Trucks */}
                    <div className="grid-2">
                        <div className="card">
                            <div className="card-header" style={{cursor:'pointer'}} onClick={() => onNavigate('active-routes')}>
                                <h3>🗺️ Active Routes</h3>
                                <span style={{fontSize:'0.75rem',color:'var(--primary)'}}>View All →</span>
                            </div>
                            <div style={{maxHeight:'280px',overflow:'auto'}}>
                                <table>
                                    <thead><tr><th>Route</th><th>Date</th><th>Driver</th><th>Stops</th><th>Status</th></tr></thead>
                                    <tbody>
                                        {(data?.routes || []).slice(0, 6).map(r => (
                                            <tr key={r.id} style={{cursor:'pointer'}} onClick={() => onNavigate('active-routes')} className="table-row-hover">
                                                <td><strong style={{color:'var(--primary)'}}>{r.route_number || r.name}</strong></td>
                                                <td>{r.scheduled_date}</td>
                                                <td>{r.driver_name || '-'}</td>
                                                <td>{r.total_stops || 0}</td>
                                                <td><span className={`status-badge status-${r.status}`}>{r.status}</span></td>
                                            </tr>
                                        ))}
                                        {(!data?.routes || data.routes.length === 0) && <tr><td colSpan="5" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No active routes · <span style={{color:'var(--primary)',cursor:'pointer'}} onClick={() => onNavigate('route-templates')}>Generate routes →</span></td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="card">
                            <div className="card-header" style={{cursor:'pointer'}} onClick={() => onNavigate('trucks')}>
                                <h3>🚚 Trucks</h3>
                                <span style={{fontSize:'0.75rem',color:'var(--primary)'}}>View All →</span>
                            </div>
                            <div style={{maxHeight:'280px',overflow:'auto'}}>
                                <table>
                                    <thead><tr><th>Code</th><th>Name</th><th>Make/Model</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead>
                                    <tbody>
                                        {(data?.trucks || []).slice(0, 6).map(t => (
                                            <tr key={t.id} className="table-row-hover">
                                                <td><strong style={{color:'var(--primary)',cursor:'pointer'}} onClick={() => onNavigate('trucks')}>{t.code}</strong></td>
                                                <td>{t.name || '-'}</td>
                                                <td style={{fontSize:'0.85rem'}}>{t.make} {t.model}</td>
                                                <td>{(t.capacity_gallons || 0).toLocaleString()}</td>
                                                <td><span className={`status-badge status-${t.status}`}>{t.status}</span></td>
                                                <td>
                                                    <button className="btn btn-sm btn-secondary" style={{padding:'0.2rem 0.4rem',fontSize:'0.7rem'}} onClick={() => {
                                                        const pos = t.current_lat && t.current_lng ? {lat:parseFloat(t.current_lat),lng:parseFloat(t.current_lng)} : 
                                                            (t.dc_id && data?.distributionCenters?.find(dc => dc.id === t.dc_id)?.lat ? 
                                                                {lat:parseFloat(data.distributionCenters.find(dc => dc.id === t.dc_id).lat),lng:parseFloat(data.distributionCenters.find(dc => dc.id === t.dc_id).lng)} : null);
                                                        if (pos && mapInstance.current) { mapInstance.current.panTo(pos); mapInstance.current.setZoom(14); }
                                                    }} title="Show on map">📍</button>
                                                </td>
                                            </tr>
                                        ))}
                                        {(!data?.trucks || data.trucks.length === 0) && <tr><td colSpan="6" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No trucks yet</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Row 3: Drivers */}
                    <div className="card">
                        <div className="card-header" style={{cursor:'pointer'}} onClick={() => onNavigate('drivers')}>

                            <span style={{fontSize:'0.75rem',color:'var(--primary)'}}>View All →</span>
                        </div>
                        <div style={{maxHeight:'280px',overflow:'auto'}}>
                            <table>
                                <thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>CDL</th><th>HAZMAT</th><th>DC</th><th>Status</th></tr></thead>
                                <tbody>
                                    {(data?.drivers || []).slice(0, 6).map(d => (
                                        <tr key={d.id} style={{cursor:'pointer'}} onClick={() => onNavigate('drivers')} className="table-row-hover">
                                            <td><strong style={{color:'var(--primary)'}}>{d.code}</strong></td>
                                            <td>{d.name}</td>
                                            <td>{d.phone || '-'}</td>
                                            <td>{d.cdl_class || '-'}</td>
                                            <td>{d.hazmat_certified ? '✅' : '❌'}</td>
                                            <td>{d.dc_name || '-'}</td>
                                            <td><span className={`status-badge status-${d.status}`}>{d.status}</span></td>
                                        </tr>
                                    ))}
                                    {(!data?.drivers || data.drivers.length === 0) && <tr><td colSpan="7" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No drivers yet</td></tr>}
                                </tbody>
                            </table>

                                <div className="modal-header" style={{background:'linear-gradient(135deg, #1e3a5f, #2d5a87)',borderBottom:'none'}}>
                                    <h3 style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                                        🏭 {selectedDCForRoutes.name} - Active Routes
                                    </h3>
                                    <button className="modal-close" onClick={() => setSelectedDCForRoutes(null)}>×</button>
                                </div>

                                        <div style={{textAlign:'center',padding:'3rem'}}>
                                            <div className="spinner"></div>
                                            <p style={{marginTop:'1rem',color:'var(--text-muted)'}}>Loading routes...</p>
                                        </div>
                                    ) : dcRoutesList.length === 0 ? (
                                        <div style={{textAlign:'center',padding:'3rem'}}>
                                            <div style={{fontSize:'3rem',marginBottom:'1rem'}}>📭</div>
                                            <h3>No Active Routes</h3>
                                            <p style={{color:'var(--text-muted)',marginTop:'0.5rem'}}>
                                                There are no scheduled or in-progress routes for this distribution center.
                                            </p>
                                            <button 
                                                className="btn btn-primary" 
                                                style={{marginTop:'1rem'}}
                                                onClick={() => { setSelectedDCForRoutes(null); onNavigate('route-templates'); }}
                                            >
                                                🚀 Generate Routes
                                            </button>
                                        </div>
                                    ) : (
                                        <div>
                                            <div style={{marginBottom:'1rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                                <span style={{color:'var(--text-muted)'}}>
                                                    {dcRoutesList.length} route{dcRoutesList.length !== 1 ? 's' : ''} found
                                                </span>
                                                <button 
                                                    className="btn btn-sm btn-secondary"
                                                    onClick={() => { setSelectedDCForRoutes(null); onNavigate('active-routes'); }}
                                                >

                                            <div style={{display:'flex',flexDirection:'column',gap:'0.75rem'}}>

                                                    <div 
                                                        key={route.id}
                                                        style={{
                                                            background:'var(--bg-card)',
                                                            border: route.status === 'in_progress' ? '2px solid var(--warning)' : '1px solid var(--border-color)',
                                                            borderRadius:'12px',
                                                            padding:'1rem',
                                                            cursor:'pointer',
                                                            transition:'all 0.2s'
                                                        }}
                                                        onClick={() => { setSelectedDCForRoutes(null); onNavigate('active-routes'); }}
                                                        onMouseOver={(e) => e.currentTarget.style.borderColor = 'var(--primary)'}
                                                        onMouseOut={(e) => e.currentTarget.style.borderColor = route.status === 'in_progress' ? 'var(--warning)' : 'var(--border-color)'}

                                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'0.5rem'}}>
                                                            <div>
                                                                <strong style={{fontSize:'1.1rem'}}>{route.name || `Route ${route.id.slice(0,8)}`}</strong>
                                                                <div style={{fontSize:'0.85rem',color:'var(--text-muted)',marginTop:'0.25rem'}}>
                                                                    {new Date(route.scheduled_date).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}
                                                                    {route.driver_name && <span> • 👤 {route.driver_name}</span>}
                                                                </div>
                                                            </div>
                                                            <span style={{
                                                                padding:'0.25rem 0.75rem',
                                                                borderRadius:'20px',
                                                                fontSize:'0.75rem',
                                                                fontWeight:'600',
                                                                background: route.status === 'in_progress' ? 'rgba(245,158,11,0.2)' : 'rgba(99,102,241,0.2)',
                                                                color: route.status === 'in_progress' ? 'var(--warning)' : 'var(--primary)'
                                                            }}>
                                                                {route.status === 'in_progress' ? '🚚 In Progress' : '📅 Scheduled'}
                                                            </span>
                                                        </div>
                                                        <div style={{display:'flex',gap:'1.5rem',fontSize:'0.9rem',color:'var(--text-secondary)'}}>
                                                            <span>🛑 {route.total_stops || 0} stops</span>
                                                            <span>✓ {route.stops_completed || 0} done</span>
                                                            <span>📏 {route.estimated_miles ? parseFloat(route.estimated_miles).toFixed(0) : '—'} mi</span>
                                                            {route.truck_code && <span>🚚 {route.truck_code}</span>}
                                                        </div>
                                                        {route.status === 'in_progress' && route.stops_completed > 0 && (
                                                            <div style={{marginTop:'0.75rem'}}>
                                                                <div style={{height:'6px',background:'var(--bg-dark)',borderRadius:'3px',overflow:'hidden'}}>
                                                                    <div style={{
                                                                        height:'100%',
                                                                        width:`${(route.stops_completed / route.total_stops) * 100}%`,
                                                                        background:'linear-gradient(90deg, var(--success), #34d399)',
                                                                        borderRadius:'3px',
                                                                        transition:'width 0.3s'
                                                                    }}></div>
                                                                </div>
                                                                <div style={{fontSize:'0.75rem',color:'var(--text-muted)',marginTop:'0.25rem',textAlign:'right'}}>
                                                                    {Math.round((route.stops_completed / route.total_stops) * 100)}% complete
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // =====================================================
        // Stable Form Input Component (prevents focus loss)
        // =====================================================
        function FormInput({ name, label, type, value, onChange, required, placeholder, step, options }) {
            const handleChange = (e) => {
                let val = e.target.value;
                if (type === 'number' && val !== '') {
                    val = parseFloat(val);
                }
                if (type === 'checkbox') {
                    val = e.target.checked;
                }
                onChange(name, val);
            };

            if (type === 'select') {
                return (
                    <div className="form-group">
                        <label className="form-label">{label}{required && ' *'}</label>
                        <select className="form-input" value={value || ''} onChange={handleChange} required={required}>
                            <option value="">Select...</option>
                            {(options || []).map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                        </select>
                    </div>
                );
            }
            if (type === 'textarea') {
                return (
                    <div className="form-group">
                        <label className="form-label">{label}</label>
                        <textarea className="form-input" rows="3" value={value || ''} onChange={handleChange} placeholder={placeholder}></textarea>
                    </div>
                );
            }
            if (type === 'checkbox') {
                return (
                    <div className="form-group">
                        <label style={{display:'flex',alignItems:'center',gap:'0.5rem',cursor:'pointer'}}>
                            <input type="checkbox" checked={!!value} onChange={handleChange} style={{width:'18px',height:'18px'}} />
                            {label}
                        </label>
                    </div>
                );
            }

            return (
                <div className="form-group">
                    <label className="form-label">{label}{required && ' *'}</label>
                    <input 
                        type={type || 'text'} 
                        className="form-input" 
                        value={value ?? ''} 
                        onChange={handleChange} 
                        required={required}
                        step={step}
                        placeholder={placeholder}
                    />
                </div>
            );
        }

        // =====================================================
        // Address Autocomplete Component (Google Places)
        // Auto-populates: address, city, state, zip, lat, lng
        // =====================================================
        function AddressAutocomplete({ value, onChange, onAddressSelect, placeholder, label, required }) {
            const inputRef = useRef(null);
            const autocompleteRef = useRef(null);

            useEffect(() => {
                if (!inputRef.current || autocompleteRef.current) return;
                if (typeof google === 'undefined' || !google.maps?.places) return;

                const autocomplete = new google.maps.places.Autocomplete(inputRef.current, {
                    types: ['address'],
                    componentRestrictions: { country: 'us' },
                    fields: ['place_id', 'geometry', 'formatted_address', 'address_components']
                });
                autocompleteRef.current = autocomplete;

                autocomplete.addListener('place_changed', () => {
                    const place = autocomplete.getPlace();
                    if (!place.geometry?.location) return;

                    // Parse address components
                    let streetNumber = '', streetName = '', city = '', state = '', zip = '', county = '';
                    (place.address_components || []).forEach(comp => {
                        if (comp.types.includes('street_number')) streetNumber = comp.long_name;
                        if (comp.types.includes('route')) streetName = comp.long_name;
                        if (comp.types.includes('locality')) city = comp.long_name;
                        if (comp.types.includes('sublocality_level_1') && !city) city = comp.long_name;
                        if (comp.types.includes('administrative_area_level_1')) state = comp.short_name;
                        if (comp.types.includes('administrative_area_level_2')) county = comp.long_name;
                        if (comp.types.includes('postal_code')) zip = comp.long_name;
                    });

                    const address = streetNumber ? `${streetNumber} ${streetName}`.trim() : streetName;

                    // Call the onAddressSelect callback with all parsed data
                    if (onAddressSelect) {
                        onAddressSelect({
                            address: address,
                            city: city,
                            state: state,
                            zip: zip,
                            county: county,
                            lat: place.geometry.location.lat(),
                            lng: place.geometry.location.lng(),
                            formatted_address: place.formatted_address
                        });
                    }
                });

                return () => {
                    if (autocompleteRef.current) {
                        google.maps.event.clearInstanceListeners(autocompleteRef.current);
                    }
                };
            }, []);

            return (
                <div className="form-group">
                    <label className="form-label">{label || 'Street Address'}{required && ' *'}</label>
                    <div style={{position:'relative'}}>
                        <input
                            ref={inputRef}
                            type="text"
                            className="form-input"
                            value={value || ''}
                            onChange={(e) => onChange && onChange(e.target.value)}
                            placeholder={placeholder || 'Start typing an address...'}
                            required={required}
                            style={{paddingRight:'2.5rem'}}
                        />
                        <span style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'1rem',pointerEvents:'none'}}>📍</span>
                    </div>
                    <div style={{fontSize:'0.7rem',color:'var(--text-muted)',marginTop:'0.25rem'}}>
                        Type to search • Auto-fills city, state, ZIP, and coordinates
                    </div>
                </div>
            );
        }

                                    value={formData[f.name]}

                                    placeholder={f.placeholder}

            return (
