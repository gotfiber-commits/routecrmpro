                                        <FormInput name="lat" label="Latitude" type="number" step="0.000001" value={formData.lat} onChange={handleFieldChange} placeholder="Auto-filled" />
                                        <FormInput name="lng" label="Longitude" type="number" step="0.000001" value={formData.lng} onChange={handleFieldChange} placeholder="Auto-filled" />
                                    </div>
                                    
                                    {geocodeMsg && (
                                        <div style={{fontSize:'0.85rem',marginTop:'0.5rem',color: geocodeMsg.startsWith('✓') ? 'var(--success)' : 'var(--text-muted)'}}>
                                            {geocodeMsg}
                                        </div>
                                    )}
                                </div>
                                
                                <div className="form-row">
                                    <FormInput name="customer_type" label="Customer Type" type="select" value={formData.customer_type} onChange={handleFieldChange} options={[
                                        { value: 'residential', label: 'Residential' },
                                        { value: 'commercial', label: 'Commercial' },
                                        { value: 'industrial', label: 'Industrial' }
                                    ]} />
                                    <FormInput name="preferred_dc_id" label="Preferred DC" type="select" value={formData.preferred_dc_id} onChange={handleFieldChange} options={dcOptions} />
                                </div>
                                
                                {/* Only show gallon-specific fields if no products defined (bulk gallon mode) */}
                                {(!products || products.length === 0) && (
                                    <>
                                        <div className="form-row">
                                            <FormInput name="tank_size" label="Tank Size (gallons)" type="number" value={formData.tank_size} onChange={handleFieldChange} />
                                            <FormInput name="current_level" label="Current Level (%)" type="number" step="0.01" value={formData.current_level} onChange={handleFieldChange} />
                                        </div>
                                        
                                        <div className="form-row">
                                            <FormInput name="price_per_gallon" label="Price per Gallon ($)" type="number" step="0.01" value={formData.price_per_gallon} onChange={handleFieldChange} />
                                            <FormInput name="payment_terms" label="Payment Terms" type="select" value={formData.payment_terms} onChange={handleFieldChange} options={[
                                                { value: 'net30', label: 'Net 30' },
                                                { value: 'net15', label: 'Net 15' },
                                                { value: 'due_on_delivery', label: 'Due on Delivery' },
                                                { value: 'prepaid', label: 'Prepaid' }
                                            ]} />
                                        </div>
                                    </>
                                )}
                                
                                {/* Payment terms when using products */}
                                {products && products.length > 0 && (
                                    <FormInput name="payment_terms" label="Payment Terms" type="select" value={formData.payment_terms} onChange={handleFieldChange} options={[
                                        { value: 'net30', label: 'Net 30' },
                                        { value: 'net15', label: 'Net 15' },
                                        { value: 'due_on_delivery', label: 'Due on Delivery' },
                                        { value: 'prepaid', label: 'Prepaid' }
                                    ]} />
                                )}
                                
                                <FormInput name="delivery_instructions" label="Delivery Instructions" type="textarea" value={formData.delivery_instructions} onChange={handleFieldChange} />
                                
                                <div className="form-row">
                                    <FormInput name="auto_delivery" label="Auto-Delivery Enabled" type="checkbox" value={formData.auto_delivery} onChange={handleFieldChange} />
                                    <FormInput name="minimum_level" label="Auto-Order Below (%)" type="number" value={formData.minimum_level} onChange={handleFieldChange} />
                                </div>
                                
                                <FormInput name="status" label="Status" type="select" value={formData.status} onChange={handleFieldChange} options={[
                                    { value: 'active', label: 'Active' },
                                    { value: 'inactive', label: 'Inactive' }
                                ]} />
                                
                                {/* Products Assignment Section */}
                                {products && products.length > 0 && (
                                    <div style={{background:'var(--bg-dark)',padding:'1rem',borderRadius:'8px',marginTop:'1rem'}}>
                                        <div style={{marginBottom:'0.75rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                            <strong style={{fontSize:'0.9rem'}}>📦 Products & Pricing</strong>
                                            {loadingProducts && <span style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>Loading...</span>}
                                        </div>
                                        <div style={{fontSize:'0.8rem',color:'var(--text-muted)',marginBottom:'0.75rem'}}>
                                            Select products this customer receives. Leave price blank for default pricing.
                                        </div>
                                        
                                        {Object.entries(groupedProducts).map(([category, catProducts]) => (
                                            <div key={category} style={{marginBottom:'0.75rem'}}>
                                                <div style={{fontSize:'0.75rem',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:'0.5rem'}}>{category}</div>
                                                {catProducts.map(product => (
                                                    <div key={product.id} style={{
                                                        display:'flex',
                                                        alignItems:'center',
                                                        gap:'0.75rem',
                                                        padding:'0.5rem',
                                                        background: customerProducts[product.id]?.enabled ? 'rgba(99,102,241,0.15)' : 'transparent',
                                                        borderRadius:'6px',
                                                        marginBottom:'0.25rem'
                                                    }}>
                                                        <input 
                                                            type="checkbox" 
                                                            checked={customerProducts[product.id]?.enabled || false}
                                                            onChange={() => toggleProduct(product.id)}
                                                            style={{width:'18px',height:'18px'}}
                                                        />
                                                        <div style={{flex:1,minWidth:0}}>
                                                            <div style={{fontWeight:'500',fontSize:'0.9rem'}}>{product.name}</div>
                                                            <div style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>
                                                                Default: ${parseFloat(product.default_price).toFixed(2)} / {product.unit || 'each'}
                                                                {product.is_exchangeable && ` (+$${parseFloat(product.deposit_amount || 0).toFixed(2)} deposit)`}
                                                            </div>
                                                        </div>
                                                        {customerProducts[product.id]?.enabled && (
                                                            <div style={{display:'flex',alignItems:'center',gap:'0.25rem'}}>
                                                                <span style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>$</span>
                                                                <input 
                                                                    type="number" 
                                                                    step="0.01"
                                                                    placeholder="Default"
                                                                    value={customerProducts[product.id]?.customPrice || ''}
                                                                    onChange={(e) => setCustomPrice(product.id, e.target.value)}
                                                                    style={{
                                                                        width:'80px',
                                                                        padding:'0.25rem 0.5rem',
                                                                        borderRadius:'4px',
                                                                        border:'1px solid var(--border-color)',
                                                                        background:'var(--bg-input)',
                                                                        color:'var(--text-primary)',
                                                                        fontSize:'0.85rem'

                                                                />
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                        
                                        {Object.keys(groupedProducts).length === 0 && (
                                            <div style={{textAlign:'center',padding:'1rem',color:'var(--text-muted)',fontSize:'0.9rem'}}>

                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary" disabled={loading}>{loading ? 'Saving...' : 'Save'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Customer Account Modal - Shows full customer details, history, transactions
        function CustomerAccountModal({ customer, onClose, onEdit }) {
            const [accountData, setAccountData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('overview');
            const [showPaymentForm, setShowPaymentForm] = useState(false);
            const [paymentAmount, setPaymentAmount] = useState('');
            const [paymentNote, setPaymentNote] = useState('');
            const [processingPayment, setProcessingPayment] = useState(false);

            useEffect(() => {
                loadAccountData();
            }, [customer.id]);

            const loadAccountData = async () => {
                setLoading(true);
                try {
                    const data = await api.request(`/data/customers/${customer.id}/account`);
                    setAccountData(data);
                } catch (err) {
                    console.error('Failed to load account data:', err);
                }
                setLoading(false);
            };

            const handleRecordPayment = async () => {
                if (!paymentAmount || parseFloat(paymentAmount) <= 0) return;
                setProcessingPayment(true);
                try {
                    await api.request(`/data/customers/${customer.id}/payment`, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            amount: parseFloat(paymentAmount),
                            description: paymentNote || 'Payment received'
                        })
                    });
                    setShowPaymentForm(false);
                    setPaymentAmount('');
                    setPaymentNote('');
                    loadAccountData();
                } catch (err) {
                    alert('Failed to record payment: ' + err.message);
                }
                setProcessingPayment(false);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                return new Date(dateStr).toLocaleDateString();
            };

            const formatCurrency = (amount) => {
                return '$' + (parseFloat(amount) || 0).toFixed(2);
            };

            const modalStyles = `
                .customer-account-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
                .customer-account-content { background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 900px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
                .customer-account-header { padding: 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; }
                .customer-account-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-color); padding: 0 1rem; }
                .customer-account-tab { padding: 0.75rem 1.25rem; background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
                .customer-account-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
                .customer-account-body { flex: 1; overflow-y: auto; padding: 1.25rem; }
                .account-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
                .account-stat { background: var(--bg-dark); padding: 1rem; border-radius: 12px; text-align: center; }
                .account-stat-value { font-size: 1.5rem; font-weight: 700; }
                .account-stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
                .info-section { margin-bottom: 1.5rem; }
                .info-section-title { font-weight: 600; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
                .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
                .info-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); }
                .info-label { color: var(--text-muted); }
                .info-value { font-weight: 500; }
                .transaction-row { display: flex; align-items: center; padding: 0.75rem; background: var(--bg-dark); border-radius: 8px; margin-bottom: 0.5rem; }
                .transaction-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 0.75rem; font-size: 1.1rem; }
                .transaction-icon.delivery { background: rgba(99,102,241,0.15); }
                .transaction-icon.payment { background: rgba(16,185,129,0.15); }
                .transaction-icon.credit { background: rgba(245,158,11,0.15); }
                .transaction-info { flex: 1; }
                .transaction-desc { font-weight: 500; }
                .transaction-date { font-size: 0.8rem; color: var(--text-muted); }
                .transaction-amount { font-weight: 600; }
                .transaction-amount.positive { color: var(--danger); }
                .transaction-amount.negative { color: var(--success); }
                .delivery-row { background: var(--bg-dark); border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; }
                .delivery-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
                .delivery-items { font-size: 0.85rem; color: var(--text-muted); }
                .product-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
                .product-tag { background: var(--bg-input); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
                .payment-form { background: var(--bg-dark); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
                .payment-form-row { display: flex; gap: 0.75rem; align-items: flex-end; }
                .payment-input { flex: 1; }
                @media (max-width: 640px) { .account-stats { grid-template-columns: repeat(2, 1fr); } .info-grid { grid-template-columns: 1fr; } }
            `;

            const stats = accountData?.stats || {};
            const balance = parseFloat(accountData?.customer?.account_balance) || 0;

            return (
                <div className="customer-account-modal" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <style>{modalStyles}</style>
                    <div className="customer-account-content">
                        <div className="customer-account-header">
                            <div>
                                <h2 style={{margin:0,fontSize:'1.25rem'}}>{customer.name}</h2>
                                <div style={{color:'var(--text-muted)',marginTop:'0.25rem'}}>{customer.code} · {customer.city}, {customer.state}</div>
                            </div>
                            <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                                <button className="btn btn-secondary btn-sm" onClick={onEdit}>✏️ Edit</button>
                                <button className="icon-btn" onClick={onClose} style={{width:'32px',height:'32px'}}>✕</button>
                            </div>
                        </div>

                        <div className="customer-account-tabs">
                            <button className={`customer-account-tab ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}>Overview</button>
                            <button className={`customer-account-tab ${activeTab === 'deliveries' ? 'active' : ''}`} onClick={() => setActiveTab('deliveries')}>Deliveries</button>
                            <button className={`customer-account-tab ${activeTab === 'transactions' ? 'active' : ''}`} onClick={() => setActiveTab('transactions')}>Transactions</button>
                        </div>

                        <div className="customer-account-body">
                            {loading ? (
                                <div style={{textAlign:'center',padding:'2rem'}}><div className="spinner"></div></div>
                            ) : (
                                <>
                                    {activeTab === 'overview' && (
                                        <>
                                            <div className="account-stats">
                                                <div className="account-stat">
                                                    <div className="account-stat-value" style={{color: balance > 0 ? 'var(--danger)' : 'var(--success)'}}>
                                                        {formatCurrency(Math.abs(balance))}
                                                    </div>
                                                    <div className="account-stat-label">{balance > 0 ? 'Balance Due' : balance < 0 ? 'Credit' : 'Balance'}</div>
                                                </div>
                                                <div className="account-stat">
                                                    <div className="account-stat-value">{stats.total_deliveries || 0}</div>
                                                    <div className="account-stat-label">Total Deliveries</div>
                                                </div>
                                                <div className="account-stat">
                                                    <div className="account-stat-value">{formatCurrency(stats.total_revenue)}</div>
                                                    <div className="account-stat-label">Total Revenue</div>
                                                </div>
                                                <div className="account-stat">
                                                    <div className="account-stat-value">{stats.total_items_delivered || stats.total_gallons || 0}</div>
                                                    <div className="account-stat-label">{stats.total_items_delivered ? 'Items Delivered' : 'Gallons'}</div>
                                                </div>
                                            </div>

                                            {/* Record Payment */}
                                            {balance > 0 && (
                                                <div style={{marginBottom:'1.5rem'}}>
                                                    {!showPaymentForm ? (
                                                        <button className="btn btn-success" onClick={() => setShowPaymentForm(true)}>💵 Record Payment</button>
                                                    ) : (
                                                        <div className="payment-form">
                                                            <div style={{fontWeight:'600',marginBottom:'0.75rem'}}>Record Payment</div>
                                                            <div className="payment-form-row">
                                                                <div className="payment-input">
                                                                    <label style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>Amount</label>
                                                                    <input 
                                                                        type="number" 
                                                                        step="0.01" 
                                                                        value={paymentAmount} 
                                                                        onChange={(e) => setPaymentAmount(e.target.value)}
                                                                        placeholder="0.00"
                                                                        style={{width:'100%',padding:'0.5rem',borderRadius:'6px',border:'1px solid var(--border-color)',background:'var(--bg-input)',color:'var(--text-primary)'}}
                                                                    />
                                                                </div>
                                                                <div className="payment-input" style={{flex:2}}>
                                                                    <label style={{fontSize:'0.8rem',color:'var(--text-muted)'}}>Note (optional)</label>
                                                                    <input 
                                                                        type="text" 
                                                                        value={paymentNote} 
                                                                        onChange={(e) => setPaymentNote(e.target.value)}
                                                                        placeholder="Check #, reference, etc."
                                                                        style={{width:'100%',padding:'0.5rem',borderRadius:'6px',border:'1px solid var(--border-color)',background:'var(--bg-input)',color:'var(--text-primary)'}}
                                                                    />
                                                                </div>
                                                                <button className="btn btn-success" onClick={handleRecordPayment} disabled={processingPayment}>
                                                                    {processingPayment ? '...' : 'Save'}
                                                                </button>
                                                                <button className="btn btn-secondary" onClick={() => setShowPaymentForm(false)}>Cancel</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            <div className="info-section">
                                                <div className="info-section-title">📋 Customer Information</div>
                                                <div className="info-grid">
                                                    <div>
                                                        <div className="info-row"><span className="info-label">Contact</span><span className="info-value">{customer.contact_name || '-'}</span></div>
                                                        <div className="info-row"><span className="info-label">Phone</span><span className="info-value">{customer.phone || '-'}</span></div>
                                                        <div className="info-row"><span className="info-label">Email</span><span className="info-value">{customer.email || '-'}</span></div>
                                                        <div className="info-row"><span className="info-label">Type</span><span className="info-value" style={{textTransform:'capitalize'}}>{customer.customer_type}</span></div>
                                                    </div>
                                                    <div>
                                                        <div className="info-row"><span className="info-label">Address</span><span className="info-value">{customer.address}</span></div>
                                                        <div className="info-row"><span className="info-label">City/State</span><span className="info-value">{customer.city}, {customer.state} {customer.zip}</span></div>
                                                        <div className="info-row"><span className="info-label">Payment Terms</span><span className="info-value" style={{textTransform:'capitalize'}}>{(customer.payment_terms || 'net30').replace('_', ' ')}</span></div>
                                                        <div className="info-row"><span className="info-label">Last Delivery</span><span className="info-value">{formatDate(customer.last_delivery_date)}</span></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Recent Transactions */}
                                            <div className="info-section">
                                                <div className="info-section-title">💳 Recent Transactions</div>
                                                {(accountData?.transactions || []).slice(0, 5).map((tx, idx) => (
                                                    <div key={idx} className="transaction-row">
                                                        <div className={`transaction-icon ${tx.transaction_type}`}>
                                                            {tx.transaction_type === 'delivery' ? '🚚' : tx.transaction_type === 'payment' ? '💵' : '📝'}
                                                        </div>
                                                        <div className="transaction-info">
                                                            <div className="transaction-desc">{tx.description || tx.transaction_type}</div>
                                                            <div className="transaction-date">{formatDate(tx.transaction_date)}</div>
                                                        </div>
                                                        <div className={`transaction-amount ${parseFloat(tx.amount) < 0 ? 'negative' : 'positive'}`}>
                                                            {parseFloat(tx.amount) < 0 ? '-' : '+'}{formatCurrency(Math.abs(tx.amount))}
                                                        </div>
                                                    </div>
                                                ))}
                                                {(!accountData?.transactions || accountData.transactions.length === 0) && (
                                                    <div style={{textAlign:'center',padding:'1rem',color:'var(--text-muted)'}}>No transactions yet</div>
                                                )}
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'deliveries' && (
                                        <div className="info-section">
                                            <div className="info-section-title">🚚 Delivery History</div>
                                            {(accountData?.deliveries || []).map((del, idx) => (
                                                <div key={idx} className="delivery-row">
                                                    <div className="delivery-header">
                                                        <div>
                                                            <strong>{formatDate(del.scheduled_date)}</strong>
                                                            <span style={{color:'var(--text-muted)',marginLeft:'0.5rem'}}>{del.route_name}</span>
                                                        </div>
                                                        <div style={{fontWeight:'600'}}>{formatCurrency(del.delivery_total)}</div>
                                                    </div>
                                                    <div className="delivery-items">
                                                        {del.delivery_model === 'products' ? (
                                                            <>Items delivered: {del.gallons_delivered || 0}</>
                                                        ) : (
                                                            <>{del.gallons_delivered || 0} gallons · Tank: {del.tank_level_before}% → {del.tank_level_after}%</>
                                                        )}
                                                        {del.driver_name && <> · Driver: {del.driver_name}</>}
                                                    </div>
                                                    {del.notes && <div style={{marginTop:'0.5rem',fontSize:'0.85rem',fontStyle:'italic'}}>Note: {del.notes}</div>}
                                                </div>
                                            ))}
                                            {(!accountData?.deliveries || accountData.deliveries.length === 0) && (
                                                <div style={{textAlign:'center',padding:'2rem',color:'var(--text-muted)'}}>No delivery history</div>
                                            )}
                                        </div>
                                    )}

                                    {activeTab === 'transactions' && (
                                        <div className="info-section">
                                            <div className="info-section-title" style={{justifyContent:'space-between'}}>
                                                <span>💳 All Transactions</span>
                                                <span style={{fontSize:'0.9rem',color: balance > 0 ? 'var(--danger)' : 'var(--success)'}}>
                                                    Balance: {formatCurrency(balance)}
                                                </span>
                                            </div>
                                            {(accountData?.transactions || []).map((tx, idx) => (
                                                <div key={idx} className="transaction-row">
                                                    <div className={`transaction-icon ${tx.transaction_type}`}>
                                                        {tx.transaction_type === 'delivery' ? '🚚' : tx.transaction_type === 'payment' ? '💵' : tx.transaction_type === 'credit' ? '🎁' : '📝'}
                                                    </div>
                                                    <div className="transaction-info">
                                                        <div className="transaction-desc">{tx.description || tx.transaction_type}</div>
                                                        <div className="transaction-date">
                                                            {formatDate(tx.transaction_date)}
                                                            {tx.items_delivered > 0 && <> · {tx.items_delivered} items</>}
                                                            {tx.items_collected > 0 && <> · {tx.items_collected} returned</>}
                                                        </div>
                                                    </div>
                                                    <div className={`transaction-amount ${parseFloat(tx.amount) < 0 ? 'negative' : 'positive'}`}>
                                                        {parseFloat(tx.amount) < 0 ? '-' : '+'}{formatCurrency(Math.abs(tx.amount))}
                                                    </div>
                                                </div>
                                            ))}
                                            {(!accountData?.transactions || accountData.transactions.length === 0) && (
                                                <div style={{textAlign:'center',padding:'2rem',color:'var(--text-muted)'}}>No transactions yet</div>
                                            )}
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // =====================================================
        // ORDERS VIEW
        // =====================================================
        function OrdersView({ data, onRefresh }) {
            const [showModal, setShowModal] = useState(false);
            const [editItem, setEditItem] = useState(null);
            const [loading, setLoading] = useState(false);

            const customerOptions = (data?.customers || []).map(c => ({ value: c.id, label: `${c.code} - ${c.name}` }));
            const dcOptions = (data?.distributionCenters || []).map(dc => ({ value: dc.id, label: dc.name }));

            const fields = [
                { name: 'customer_id', label: 'Customer', type: 'select', required: true, options: customerOptions },
                { name: 'dc_id', label: 'Distribution Center', type: 'select', options: dcOptions },
                { type: 'row', fields: [
                    { name: 'gallons_requested', label: 'Gallons Requested', type: 'number', required: true },
                    { name: 'price_per_gallon', label: 'Price per Gallon ($)', type: 'number', step: '0.01' }
                ]},
                { type: 'row', fields: [
                    { name: 'requested_date', label: 'Requested Date', type: 'date' },

        // =====================================================
        // ROUTE TEMPLATES VIEW - Route All Customers
        // =====================================================
        function RouteTemplatesView({ data, onRefresh }) {
            const [generating, setGenerating] = useState(false);
            const [generatedRoutes, setGeneratedRoutes] = useState([]);
            const [selectedDC, setSelectedDC] = useState('');
            const [error, setError] = useState('');
            const [maxStopsPerRoute, setMaxStopsPerRoute] = useState(15);
            const [showSettings, setShowSettings] = useState(false);
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [activating, setActivating] = useState(null); // Track which route is being activated
            const [activatedRoutes, setActivatedRoutes] = useState([]); // Track activated route indices
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markersRef = useRef([]);
            const routeLinesRef = useRef([]); // Array of polylines for each route
            const directionsRenderersRef = useRef([]); // Array of DirectionsRenderers for road paths

            // Route colors for multi-route display
            const routeColors = [
                '#10B981', // Green
                '#3B82F6', // Blue
                '#F59E0B', // Amber
                '#EF4444', // Red
                '#8B5CF6', // Purple
                '#EC4899', // Pink
                '#14B8A6', // Teal
                '#F97316', // Orange
                '#6366F1', // Indigo
                '#84CC16', // Lime
                '#06B6D4', // Cyan
                '#A855F7', // Violet
            ];

            const dcs = data?.distributionCenters || [];
            const customers = data?.customers || [];
            const drivers = data?.drivers || [];
            const trucks = data?.trucks || [];

            // Initialize map
            useEffect(() => {
                if (!mapRef.current || mapInstance.current) return;
                
                const firstDC = dcs.find(dc => dc.lat && dc.lng);
                const map = new google.maps.Map(mapRef.current, {
                    center: firstDC ? { lat: parseFloat(firstDC.lat), lng: parseFloat(firstDC.lng) } : { lat: 39.8, lng: -98.5 },
                    zoom: firstDC ? 9 : 4,
                    mapTypeControl: true,
                    streetViewControl: false
                });
                mapInstance.current = map;
            }, [dcs.length]);

            // Get ALL customers for selected DC (not filtered by tank level)
            const getCustomersForDC = () => {
                return customers.filter(c => 
                    c.status === 'active' && 
                    c.lat && c.lng &&
                    (!selectedDC || c.preferred_dc_id === selectedDC)
                );
            };

            const dcCustomers = selectedDC ? getCustomersForDC() : [];

            // Show all customers on map when DC is selected (before route generation)
            useEffect(() => {
                if (!mapInstance.current || !selectedDC || generatedRoutes.length > 0) return;
                const map = mapInstance.current;

                // Clear existing markers
                markersRef.current.forEach(m => m.setMap(null));
                markersRef.current = [];
                routeLinesRef.current.forEach(line => line.setMap(null));
                routeLinesRef.current = [];

                const bounds = new google.maps.LatLngBounds();
                const dc = dcs.find(d => d.id === selectedDC);

                // DC marker
                if (dc?.lat && dc?.lng) {
                    const dcMarker = new google.maps.Marker({
                        position: { lat: parseFloat(dc.lat), lng: parseFloat(dc.lng) },
                        map,
                        title: dc.name + ' (Distribution Center)',
                        icon: {
                            url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="#6366F1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/></svg>'),
                            scaledSize: new google.maps.Size(40, 40)
                        },
                        zIndex: 1000
                    });
                    markersRef.current.push(dcMarker);
                    bounds.extend(dcMarker.getPosition());
                }

                // Customer markers (blue dots)
                dcCustomers.forEach(cust => {
                    const pos = { lat: parseFloat(cust.lat), lng: parseFloat(cust.lng) };
                    const marker = new google.maps.Marker({
                        position: pos,
                        map,
                        title: cust.name,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: '#3B82F6',
                            fillOpacity: 0.9,
                            strokeColor: '#fff',
                            strokeWeight: 2
                        }
                    });

                    const infoWindow = new google.maps.InfoWindow({
                        content: `<div style="color:#333;min-width:150px">
                            <strong>${cust.name}</strong><br/>
                            ${cust.address || ''}<br/>
                            ${cust.city}, ${cust.state}
                        </div>`
                    });
                    marker.addListener('click', () => infoWindow.open(map, marker));
                    markersRef.current.push(marker);
                    bounds.extend(pos);
                });

                if (dcCustomers.length > 0 || (dc?.lat && dc?.lng)) {
                    map.fitBounds(bounds);
                }
            }, [selectedDC, dcCustomers.length, generatedRoutes.length]);

            // Generate optimized routes
            const handleGenerateRoutes = async () => {
                if (!selectedDC) {
                    setError('Please select a distribution center');
                    return;
                }

                const customersToRoute = getCustomersForDC();
                
                if (customersToRoute.length === 0) {
                    setError('No customers with valid addresses found for this DC');
                    return;
                }

                setGenerating(true);
                setError('');
                setGeneratedRoutes([]);
                setSelectedRoute(null);
                setActivatedRoutes([]); // Reset activated routes

                try {
                    const dc = dcs.find(d => d.id === selectedDC);
                    
                    // ============================================
                    // GEOGRAPHIC CLUSTERING - Group nearby customers
                    // ============================================
                    
                    // Step 1: Calculate bearing (direction) from DC to each customer
                    // This creates "pie slices" radiating from the DC
                    const dcLat = parseFloat(dc.lat);
                    const dcLng = parseFloat(dc.lng);
                    
                    const customersWithBearing = customersToRoute.map(c => {
                        const custLat = parseFloat(c.lat);
                        const custLng = parseFloat(c.lng);
                        
                        // Calculate bearing from DC to customer (0-360 degrees)
                        const dLng = (custLng - dcLng) * Math.PI / 180;
                        const lat1 = dcLat * Math.PI / 180;
                        const lat2 = custLat * Math.PI / 180;
                        const y = Math.sin(dLng) * Math.cos(lat2);
                        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
                        let bearing = Math.atan2(y, x) * 180 / Math.PI;
                        bearing = (bearing + 360) % 360; // Normalize to 0-360
                        
                        // Calculate distance from DC
                        const R = 3959; // Earth radius in miles
                        const dLat = (custLat - dcLat) * Math.PI / 180;
                        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                                  Math.cos(lat1) * Math.cos(lat2) * 
                                  Math.sin(dLng/2) * Math.sin(dLng/2);
                        const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                        
                        return { ...c, bearing, distance };
                    });
                    
                    // Step 2: Sort by bearing (clockwise from north)
                    // This groups customers by direction from the DC
                    customersWithBearing.sort((a, b) => a.bearing - b.bearing);
                    
                    // Step 3: Split into geographic chunks
                    // Customers are now sorted by direction, so sequential chunks = geographic areas
                    const numRoutes = Math.ceil(customersWithBearing.length / maxStopsPerRoute);
                    const customerChunks = [];
                    
                    if (numRoutes === 1) {
                        // Single route - just use all customers
                        customerChunks.push(customersWithBearing);
                    } else {
                        // Multiple routes - divide the "pie" evenly
                        const stopsPerRoute = Math.ceil(customersWithBearing.length / numRoutes);
                        for (let i = 0; i < customersWithBearing.length; i += stopsPerRoute) {
                            customerChunks.push(customersWithBearing.slice(i, i + stopsPerRoute));
                        }
                    }

                    const routes = [];
                    
                    for (let i = 0; i < customerChunks.length; i++) {
                        const chunk = customerChunks[i];
                        
                        // Optimize this geographic chunk
                        const result = await api.request('/routes-v2/optimize', {
                            method: 'POST',
                            body: JSON.stringify({
                                dc_id: selectedDC,
                                customer_ids: chunk.map(c => c.id),
                                use_google: true
                            })
                        });

                        routes.push({
                            route_number: i + 1,
                            dc: dc,
                            stops: result.stops,
                            summary: result.summary,
                            optimization_method: result.optimization_method,
                            google_api_used: result.google_api_used,
                            polyline: result.polyline
                        });
                    }

                    setGeneratedRoutes(routes);
                    
                    // Show all routes on map
                    if (routes.length > 0) {
                        setSelectedRoute(0);
                        showAllRoutesOnMap(routes, 0); // Highlight first route
                    }

                } catch (err) {
                    setError(err.message);
                } finally {
                    setGenerating(false);
                }
            };

            // State for activation modal
            const [showActivateModal, setShowActivateModal] = useState(null); // Route index being activated
            const [activateDriverId, setActivateDriverId] = useState('');
            const [activateTruckId, setActivateTruckId] = useState('');
            const [fuelPrice, setFuelPrice] = useState(3.50);

            // Open activation modal
            const openActivateModal = (routeIndex) => {
                setShowActivateModal(routeIndex);
                setActivateDriverId('');
                setActivateTruckId('');
            };

            // Calculate cost estimate for preview
            const calculateCostEstimate = (routeIndex) => {
                const route = generatedRoutes[routeIndex];
                if (!route) return { fuel: 0, driver: 0, total: 0 };
                
                const miles = route.summary.total_miles || 0;
                const durationMinutes = route.summary.estimated_total_time_minutes || 0;
                const deliveryTime = route.stops.length * 15; // 15 min per stop
                const totalMinutes = durationMinutes + deliveryTime;
                const hours = totalMinutes / 60;

                // Get truck MPG
                let mpg = 8;
                if (activateTruckId) {
                    const truck = trucks.find(t => t.id === activateTruckId);
                    mpg = parseFloat(truck?.avg_mpg) || parseFloat(truck?.mpg) || 8;
                }

                // Get driver rate
                let hourlyRate = 0;
                if (activateDriverId) {
                    const driver = drivers.find(d => d.id === activateDriverId);
                    hourlyRate = parseFloat(driver?.hourly_rate) || 0;
                }

                const fuelGallons = miles / mpg;
                const fuelCost = fuelGallons * fuelPrice;
                const driverCost = hours * hourlyRate;
                const totalCost = fuelCost + driverCost;

                return { 
                    miles, 
                    hours: hours.toFixed(1), 
                    fuelGallons: fuelGallons.toFixed(1), 
                    fuelCost: fuelCost.toFixed(2), 
                    driverCost: driverCost.toFixed(2), 
                    totalCost: totalCost.toFixed(2),
                    mpg,
                    hourlyRate
                };
            };

            // Activate a generated route (save to database)
            const handleActivateRoute = async (routeIndex) => {
                const route = generatedRoutes[routeIndex];
                if (!route) return;

                setActivating(routeIndex);
                setError('');

                try {
                    // Get customer IDs in the optimized order
                    const customerIds = route.stops.map(s => s.customer_id);
                    
                    // Create the route run with cost data
                    const result = await api.request('/routes-v2/runs', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: `Route #${route.route_number} - ${route.dc.name}`,
                            dc_id: route.dc.id,
                            driver_id: activateDriverId || null,
                            truck_id: activateTruckId || null,
                            scheduled_date: new Date().toISOString().split('T')[0],
                            customer_ids: customerIds,
                            estimated_miles: route.summary.total_miles,
                            estimated_duration: route.summary.estimated_total_time_minutes,
                            fuel_price_per_gallon: fuelPrice
                        })
                    });

                    // Mark this route as activated
                    setActivatedRoutes(prev => [...prev, routeIndex]);
                    setShowActivateModal(null);
                    
                    // Show success message
                    alert(`Route #${route.route_number} activated! View it in Active Routes.`);
                    
                } catch (err) {
                    setError('Failed to activate route: ' + err.message);
                } finally {
                    setActivating(null);
                }
            };

            // Activate all generated routes at once
            const handleActivateAllRoutes = async () => {
                for (let i = 0; i < generatedRoutes.length; i++) {
                    if (!activatedRoutes.includes(i)) {
                        await handleActivateRoute(i);
                    }
                }
            };

            // Show route on map
            // Show ALL routes on the map with different colors
            const showAllRoutesOnMap = (routes, highlightIndex = null) => {
                if (!mapInstance.current) {
                    console.error('Map not initialized');
                    return;
                }
                const map = mapInstance.current;

                
                
                

                // Clear existing markers and routes
                markersRef.current.forEach(m => m.setMap(null));
                markersRef.current = [];
                routeLinesRef.current.forEach(line => line.setMap(null));
                routeLinesRef.current = [];
                directionsRenderersRef.current.forEach(r => r.setMap(null));
                directionsRenderersRef.current = [];

                const bounds = new google.maps.LatLngBounds();
                const dc = routes[0]?.dc;

                

                // DC marker (only once)
                if (dc?.lat && dc?.lng) {
                    const dcMarker = new google.maps.Marker({
                        position: { lat: parseFloat(dc.lat), lng: parseFloat(dc.lng) },
                        map,
                        title: dc.name + ' (Distribution Center)',
                        icon: {
                            url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#6366F1" stroke="white" stroke-width="1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/><text x="12" y="14" text-anchor="middle" fill="white" font-size="8" font-weight="bold">DC</text></svg>'),
                            scaledSize: new google.maps.Size(48, 48),
                            anchor: new google.maps.Point(24, 24)
                        },
                        zIndex: 1000
                    });
                    markersRef.current.push(dcMarker);
                    bounds.extend(dcMarker.getPosition());
                }

                // Draw each route
                routes.forEach((route, routeIdx) => {
                    const color = routeColors[routeIdx % routeColors.length];
                    const isHighlighted = highlightIndex === routeIdx;

                    

                    // Add stop markers
                    (route.stops || []).forEach((stop, stopIdx) => {
                        const lat = parseFloat(stop.lat);
                        const lng = parseFloat(stop.lng);
                        
                        if (isNaN(lat) || isNaN(lng)) {
                            console.warn(`Stop ${stop.stop_number} has invalid coords:`, stop.lat, stop.lng);
                            return;
                        }
                        
                        const pos = { lat, lng };

                        const marker = new google.maps.Marker({
                            position: pos,
                            map,
                            title: `Stop ${stop.stop_number}: ${stop.customer_name}`,
                            label: isHighlighted ? {
                                text: String(stop.stop_number),
                                color: 'white',
                                fontWeight: 'bold',
                                fontSize: '12px'
                            } : null,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: isHighlighted ? 16 : 8,
                                fillColor: color,
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            },
                            zIndex: isHighlighted ? 100 : 10
                        });

                        if (isHighlighted) {
                            const infoContent = `
                                <div style="color:#333;min-width:220px;font-family:system-ui,sans-serif">
                                    <strong style="font-size:14px">Stop #${stop.stop_number}</strong><br/>
                                    <strong>${stop.customer_name}</strong><br/>
                                    <span style="color:#666">${stop.address || ''}<br/>
                                    ${stop.city}, ${stop.state}</span>
                                    <hr style="margin:8px 0;border:none;border-top:1px solid #ddd"/>
                                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">
                                        <span>🛢️ Tank: ${stop.tank_size || '?'} gal</span>
                                        <span>📊 Level: ${stop.current_level || '?'}%</span>
                                        <span>📏 Distance: ${stop.distance_from_previous || '?'} mi</span>
                                        <span>⏱️ Time: ${stop.time_from_previous_minutes || '?'} min</span>
                                    </div>
                                </div>
                            `;
                            const infoWindow = new google.maps.InfoWindow({ content: infoContent });
                            marker.addListener('click', () => infoWindow.open(map, marker));
                        }

                        markersRef.current.push(marker);
                        bounds.extend(pos);
                    });

                    // Draw road-following route using DirectionsService
                    if (dc?.lat && dc?.lng && route.stops && route.stops.length > 0) {
                        const dcPos = { lat: parseFloat(dc.lat), lng: parseFloat(dc.lng) };
                        
                        // Prepare waypoints
                        const waypoints = route.stops.map(stop => ({
                            location: new google.maps.LatLng(parseFloat(stop.lat), parseFloat(stop.lng)),
                            stopover: true
                        }));

                        const directionsService = new google.maps.DirectionsService();
                        
                        const request = {
                            origin: dcPos,
                            destination: dcPos,
                            waypoints: waypoints,
                            travelMode: google.maps.TravelMode.DRIVING,
                            optimizeWaypoints: false
                        };

                        

                        directionsService.route(request, (result, status) => {
                            
                            
                            if (status === google.maps.DirectionsStatus.OK) {
                                const renderer = new google.maps.DirectionsRenderer({
                                    map: map,
                                    directions: result,
                                    suppressMarkers: true,
                                    preserveViewport: true,
                                    polylineOptions: {
                                        strokeColor: color,
                                        strokeOpacity: isHighlighted ? 0.9 : 0.5,
                                        strokeWeight: isHighlighted ? 6 : 4,
                                        zIndex: isHighlighted ? 50 : 5
                                    }
                                });
                                directionsRenderersRef.current.push(renderer);
                                
                            } else {
                                console.error(`Route ${routeIdx + 1}: DirectionsService failed - ${status}`);
                                // Fallback to straight lines
                                const pathCoords = [
                                    dcPos,
                                    ...route.stops.map(s => ({ 
                                        lat: parseFloat(s.lat), 
                                        lng: parseFloat(s.lng) 
                                    })),
                                    dcPos
                                ];
                                const polyline = new google.maps.Polyline({
                                    path: pathCoords,
                                    strokeColor: color,
                                    strokeOpacity: isHighlighted ? 0.9 : 0.5,
                                    strokeWeight: isHighlighted ? 6 : 4,
                                    strokePattern: [10, 5],
                                    map,
                                    zIndex: isHighlighted ? 50 : 5
                                });
                                routeLinesRef.current.push(polyline);
                                
                            }
                        });
                    }
                });

                map.fitBounds(bounds);
                
            };

            const showRouteOnMap = (route) => {
                showAllRoutesOnMap([route], 0);

            const printRoute = (route, driverName = '', truckCode = '') => {
                const dc = dcs.find(d => d.id === selectedDC) || route.dc;
                const today = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                const printContent = `

        // =====================================================
        // ACTIVE ROUTES VIEW - Route Runs in Progress
        // =====================================================
        function ActiveRoutesView({ data, onRefresh }) {
            const [runs, setRuns] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedRun, setSelectedRun] = useState(null);
            const [error, setError] = useState('');
            const [unroutedCustomers, setUnroutedCustomers] = useState([]);

            useEffect(() => {
                loadRuns();
                loadUnroutedCustomers();
            }, []);

            const loadRuns = async () => {
                try {
                    setLoading(true);
                    const result = await api.request('/routes-v2/runs');
                    setRuns(result);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const loadUnroutedCustomers = async () => {
                try {
                    const result = await api.request('/routes-v2/runs/unrouted-customers');
                    setUnroutedCustomers(result);
                } catch (err) {
                    console.log('Could not load unrouted customers:', err.message);
                }
            };

            const handleStatusChange = async (runId, newStatus) => {
                try {
                    await api.request(`/routes-v2/runs/${runId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: newStatus })
                    });
                    loadRuns();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case 'scheduled': return 'var(--text-muted)';
                    case 'in_progress': return 'var(--warning)';
                    case 'completed': return 'var(--success)';
                    case 'cancelled': return 'var(--danger)';
                    default: return 'var(--text-secondary)';
                }
            };

            // Duplicate a route for tomorrow (same stops, same order)

        // =====================================================
        // ROUTE RUN DETAIL - View/Edit stops during a run
        // =====================================================
        function RouteRunDetail({ run, onBack }) {
            const [runData, setRunData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showAddCustomer, setShowAddCustomer] = useState(false);
            const [customerSearch, setCustomerSearch] = useState('');
            const [availableCustomers, setAvailableCustomers] = useState([]);
            const [reoptimizing, setReoptimizing] = useState(false);
            const [showCloneModal, setShowCloneModal] = useState(false);
            const [cloneDate, setCloneDate] = useState(new Date().toISOString().split('T')[0]);
            const [editingRun, setEditingRun] = useState(false);
            const [runEdits, setRunEdits] = useState({});
            const [showRouteMap, setShowRouteMap] = useState(true);
            
            // Map refs
            const routeDetailMapRef = useRef(null);
            const routeDetailMapInstance = useRef(null);
            const routeDetailMarkersRef = useRef([]);
            const routeDetailRendererRef = useRef(null);

            useEffect(() => {
                loadRunDetail();
            }, [run.id]);

            // Initialize and update route map
            useEffect(() => {
                if (!showRouteMap || !routeDetailMapRef.current || !runData) return;
                
                // Clean up previous map instance
                if (routeDetailMapInstance.current) {
                    routeDetailMarkersRef.current.forEach(m => m.setMap(null));
                    routeDetailMarkersRef.current = [];
                    if (routeDetailRendererRef.current) {
                        routeDetailRendererRef.current.setMap(null);
                    }
                }

                const dcLat = parseFloat(runData.dc_lat);
                const dcLng = parseFloat(runData.dc_lng);
                
                if (isNaN(dcLat) || isNaN(dcLng)) return;

                // Create or reuse map
                if (!routeDetailMapInstance.current) {
                    const map = new google.maps.Map(routeDetailMapRef.current, {
                        center: { lat: dcLat, lng: dcLng },
                        zoom: 10,
                        mapTypeControl: true,
                        streetViewControl: false,
                        fullscreenControl: true
                    });
                    routeDetailMapInstance.current = map;
                }

                const map = routeDetailMapInstance.current;
                const bounds = new google.maps.LatLngBounds();
                const stops = runData.stops || [];

                // DC marker
                const dcMarker = new google.maps.Marker({
                    position: { lat: dcLat, lng: dcLng },
                    map,
                    title: runData.dc_name + ' (Distribution Center)',
                    icon: {
                        url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="#6366F1" stroke="white" stroke-width="1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/></svg>'),
                        scaledSize: new google.maps.Size(40, 40),
                        anchor: new google.maps.Point(20, 20)
                    },
                    zIndex: 1000
                });
                const dcInfo = new google.maps.InfoWindow({
                    content: `<div style="color:#333;padding:8px"><strong>🏭 ${runData.dc_name}</strong><br/><span style="color:#666">Start/End Point</span></div>`
                });
                dcMarker.addListener('click', () => dcInfo.open(map, dcMarker));
                routeDetailMarkersRef.current.push(dcMarker);
                bounds.extend({ lat: dcLat, lng: dcLng });

                // Stop markers
                stops.forEach((stop, idx) => {
                    const lat = parseFloat(stop.lat);
                    const lng = parseFloat(stop.lng);
                    if (isNaN(lat) || isNaN(lng)) return;

                    let fillColor = '#F59E0B'; // pending - amber
                    if (stop.status === 'completed') fillColor = '#10B981'; // green
                    if (stop.status === 'skipped') fillColor = '#6B7280'; // gray

                    const marker = new google.maps.Marker({
                        position: { lat, lng },
                        map,
                        title: `Stop ${stop.stop_number}: ${stop.customer_name}`,
                        label: {
                            text: String(stop.stop_number),
                            color: 'white',
                            fontWeight: 'bold',
                            fontSize: '11px'
                        },
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: fillColor,
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });

                    const infoContent = `
                        <div style="color:#333;min-width:200px;padding:8px">
                            <strong style="font-size:14px">Stop ${stop.stop_number}: ${stop.customer_name}</strong>
                            <div style="color:#666;margin-top:4px">${stop.address || ''}</div>
                            <div style="color:#666">${stop.city}, ${stop.state}</div>
                            <div style="margin-top:8px;display:flex;gap:12px">
                                <span style="color:${stop.tank_level_before <= 25 ? '#EF4444' : stop.tank_level_before <= 50 ? '#F59E0B' : '#10B981'}">
                                    Tank: ${stop.tank_level_before || '?'}%
                                </span>
                                <span>Size: ${stop.tank_size_gallons || '?'} gal</span>
                            </div>
                            <div style="margin-top:8px;padding:4px 8px;background:${fillColor};color:white;border-radius:4px;text-align:center;font-weight:600">
                                ${stop.status.toUpperCase()}
                            </div>
                        </div>
                    `;
                    const infoWindow = new google.maps.InfoWindow({ content: infoContent });
                    marker.addListener('click', () => infoWindow.open(map, marker));
                    routeDetailMarkersRef.current.push(marker);
                    bounds.extend({ lat, lng });
                });

                // Draw route path
                if (stops.length > 0) {
                    const validStops = stops.filter(s => !isNaN(parseFloat(s.lat)) && !isNaN(parseFloat(s.lng)));
                    if (validStops.length > 0) {
                        const waypoints = validStops.map(stop => ({
                            location: new google.maps.LatLng(parseFloat(stop.lat), parseFloat(stop.lng)),
                            stopover: true
                        }));

                        const directionsService = new google.maps.DirectionsService();
                        directionsService.route({
                            origin: { lat: dcLat, lng: dcLng },
                            destination: { lat: dcLat, lng: dcLng },
                            waypoints: waypoints,
                            travelMode: google.maps.TravelMode.DRIVING,
                            optimizeWaypoints: false
                        }, (result, status) => {
                            if (status === google.maps.DirectionsStatus.OK) {
                                const renderer = new google.maps.DirectionsRenderer({
                                    map: map,
                                    directions: result,
                                    suppressMarkers: true,
                                    preserveViewport: true,
                                    polylineOptions: {
                                        strokeColor: '#6366F1',
                                        strokeOpacity: 0.8,
                                        strokeWeight: 4
                                    }
                                });
                                routeDetailRendererRef.current = renderer;
                            }
                        });
                    }
                }

                // Fit bounds
                if (stops.length > 0) {
                    map.fitBounds(bounds);
                } else {
                    map.setCenter({ lat: dcLat, lng: dcLng });
                    map.setZoom(12);
                }

                // Cleanup on unmount
                return () => {
                    routeDetailMarkersRef.current.forEach(m => m.setMap(null));
                    routeDetailMarkersRef.current = [];
                    if (routeDetailRendererRef.current) {
                        routeDetailRendererRef.current.setMap(null);
                    }
                };
            }, [showRouteMap, runData]);

            const loadRunDetail = async () => {
                try {
                    const result = await api.request(`/routes-v2/runs/${run.id}`);
                    setRunData(result);
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const handleStopUpdate = async (stopId, updates) => {
                try {
                    await api.request(`/routes-v2/runs/${run.id}/stops/${stopId}`, {
                        method: 'PUT',
                        body: JSON.stringify(updates)
                    });
                    loadRunDetail();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            const handleCompleteStop = async (stop) => {
                const gallons = prompt('Gallons delivered (0 if tank was full):', '0');
                if (gallons === null) return;
                
                const tankAfter = prompt('Tank level after fill (%):', '100');
                if (tankAfter === null) return;

                await handleStopUpdate(stop.id, {
                    status: 'completed',
                    gallons_delivered: parseFloat(gallons) || 0,
                    tank_level_after: parseFloat(tankAfter) || 100,
                    delivery_total: (parseFloat(gallons) || 0) * (stop.price_per_gallon || 2.50),
                    arrived_at: new Date().toISOString(),
                    departed_at: new Date().toISOString()
                });
            };

            const handleSkipStop = async (stop) => {
                const reason = prompt('Reason for skipping:');
                if (!reason) return;
                
                await handleStopUpdate(stop.id, {
                    status: 'skipped',
                    skip_reason: reason
                });
            };

            // Remove a stop from the route
            const handleRemoveStop = async (stop) => {
                if (!confirm(`Remove ${stop.customer_name} from this route?`)) return;
                
                try {
                    await api.request(`/routes-v2/runs/${run.id}/stops/${stop.id}`, {
                        method: 'DELETE'
                    });
                    loadRunDetail();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            // Move stop up or down
            const handleMoveStop = async (stopIndex, direction) => {
                const stops = runData.stops;
                if (direction === 'up' && stopIndex === 0) return;
                if (direction === 'down' && stopIndex === stops.length - 1) return;

                const newOrder = stops.map(s => s.id);
                const swapIndex = direction === 'up' ? stopIndex - 1 : stopIndex + 1;
                [newOrder[stopIndex], newOrder[swapIndex]] = [newOrder[swapIndex], newOrder[stopIndex]];

                try {
                    await api.request(`/routes-v2/runs/${run.id}/reorder`, {
                        method: 'PUT',
                        body: JSON.stringify({ stop_order: newOrder })
                    });
                    loadRunDetail();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            // Re-optimize the route
            const handleReoptimize = async () => {
                if (!confirm('Re-optimize this route? This will reorder pending stops for shortest distance.')) return;
                
                setReoptimizing(true);
                try {
                    await api.request(`/routes-v2/runs/${run.id}/reoptimize`, {
                        method: 'POST'
                    });
                    loadRunDetail();
                    alert('Route re-optimized!');
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setReoptimizing(false);
                }
            };

            // Delete the entire route
            const handleDeleteRoute = async () => {
                if (!confirm('Delete this entire route? This cannot be undone.')) return;
                
                try {
                    await api.request(`/routes-v2/runs/${run.id}`, {
                        method: 'DELETE'
                    });
                    onBack();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            // Clone the route
