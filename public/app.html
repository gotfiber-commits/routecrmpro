                    <DriverRouteDetail 
                        route={selectedRoute} 
                        driverInfo={driverInfo}
                        truckInfo={truckInfo}
                        deliverySettings={deliverySettings}
                        products={products}
                        onBack={() => { setSelectedRoute(null); loadDriverData(); }}
                        showToast={showToast}
                    />
                );
            }

            const activeRoutes = routes.filter(r => r.status === 'in_progress' || r.status === 'scheduled');

            return (
                <div className="driver-app">
                    <style>{mobileStyles}</style>
                    
                    <div className="driver-header">
                        <h1>🚚 {driverInfo?.name || user?.name || 'Driver'}</h1>
                        <div style={{display:'flex',gap:'0.5rem'}}>
                            <button className="icon-btn" onClick={loadDriverData}>↻</button>
                            <button className="icon-btn" onClick={onLogout}>🚪</button>
                        </div>
                    </div>

                    <div className="driver-content">
                        {/* Driver & Truck Info */}
                        {(driverInfo || truckInfo) && (
                            <div className="driver-info-card">
                                <div className="driver-info-grid">
                                    <div>
                                        <div className="driver-info-label">Driver</div>
                                        <div className="driver-info-value">{driverInfo?.name || 'Not assigned'}</div>
                                        {driverInfo?.dcName && <div style={{fontSize:'0.85rem',opacity:0.8,marginTop:'4px'}}>📍 {driverInfo.dcName}</div>}
                                    </div>
                                    {truckInfo && (
                                        <div style={{textAlign:'right'}}>
                                            <div className="driver-info-label">Truck</div>
                                            <div className="driver-info-value">{truckInfo.code}</div>
                                            <div style={{fontSize:'0.85rem',opacity:0.8,marginTop:'4px'}}>{truckInfo.make} {truckInfo.model}</div>
                                        </div>
                                    )}
                                </div>
                                {truckInfo && (
                                    <div className="driver-stats">
                                        <div className="driver-stat">
                                            <div className="driver-stat-value">{truckInfo.capacityGallons || '—'}</div>
                                            <div className="driver-stat-label">Capacity (gal)</div>
                                        </div>
                                        <div className="driver-stat">
                                            <div className="driver-stat-value">{truckInfo.licensePlate || '—'}</div>
                                            <div className="driver-stat-label">License</div>
                                        </div>
                                        <div className="driver-stat">
                                            <div className="driver-stat-value">{truckInfo.currentOdometer?.toLocaleString() || '—'}</div>
                                            <div className="driver-stat-label">Odometer</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Routes List */}
                        {loading ? (
                            <div style={{textAlign:'center',padding:'3rem'}}>
                                <div className="spinner"></div>
                                <p style={{marginTop:'1rem',color:'var(--text-muted)'}}>Loading your routes...</p>
                            </div>
                        ) : activeRoutes.length === 0 ? (
                            <div className="no-routes">
                                <div className="no-routes-icon">📭</div>
                                <h2>No Routes Assigned</h2>
                                <p style={{color:'var(--text-secondary)'}}>You don't have any routes scheduled.</p>
                                <button className="btn btn-primary" style={{marginTop:'1.5rem'}} onClick={loadDriverData}>↻ Refresh</button>
                            </div>
                        ) : (
                            <>
                                <h3 style={{marginBottom:'1rem'}}>Your Routes ({activeRoutes.length})</h3>
                                {activeRoutes.map(route => (
                                    <div 
                                        key={route.id} 
                                        className={`route-card ${route.status === 'in_progress' ? 'in-progress' : ''}`}
                                        onClick={() => setSelectedRoute(route)}
                                    >
                                        <div className="route-card-header">
                                            <div>
                                                <div className="route-card-name">{route.name || `Route ${route.id.slice(0,8)}`}</div>
                                                <div className="route-card-date">
                                                    {new Date(route.scheduled_date).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}
                                                    {route.dc_name && <span> • {route.dc_name}</span>}
                                                </div>
                                            </div>
                                            <span className={`status-badge ${route.status}`}>
                                                {route.status === 'in_progress' ? 'In Progress' : 'Scheduled'}
                                            </span>
                                        </div>
                                        <div className="route-card-stats">
                                            <span>🛑 {route.total_stops} stops</span>
                                            <span>✓ {route.stops_completed || 0} done</span>
                                            <span>📏 {route.estimated_miles ? parseFloat(route.estimated_miles).toFixed(1) : '—'} mi</span>
                                        </div>
                                        {route.truck_code && (
                                            <div className="route-card-truck">🚚 {route.truck_code}</div>
                                        )}
                                    </div>
                                ))}
                            </>
                        )}
                    </div>

                    {toast && (
                        <div className={`driver-toast ${toast.type}`}>
                            {toast.type === 'success' ? '✓' : '✗'} {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        // Driver Route Detail Component
        function DriverRouteDetail({ route, driverInfo, truckInfo, deliverySettings, products, onBack, showToast }) {
            const [routeData, setRouteData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedStop, setSelectedStop] = useState(null);
            const [expandedStop, setExpandedStop] = useState(null);
            const [customerProducts, setCustomerProducts] = useState([]);
            const [showMap, setShowMap] = useState(true); // Show map by default for drivers
            
            // Map refs - must be declared before any conditional returns
            const driverMapRef = useRef(null);
            const driverMapInstance = useRef(null);
            const driverMarkersRef = useRef([]);
            const driverRouteRenderer = useRef(null);

            useEffect(() => {
                loadRouteDetails();
            }, [route.id]);

            // Map initialization and UPDATE effect - refreshes when routeData changes
            useEffect(() => {
                if (!showMap || !driverMapRef.current || !routeData?.dc_lat) return;
                
                const dcLat = parseFloat(routeData.dc_lat);
                const dcLng = parseFloat(routeData.dc_lng);
                if (isNaN(dcLat) || isNaN(dcLng)) return;

                // Clear existing markers and route
                driverMarkersRef.current.forEach(m => m.setMap(null));
                driverMarkersRef.current = [];
                if (driverRouteRenderer.current) {
                    driverRouteRenderer.current.setMap(null);
                    driverRouteRenderer.current = null;
                }

                // Create map if it doesn't exist
                if (!driverMapInstance.current) {
                    const map = new google.maps.Map(driverMapRef.current, {
                        center: { lat: dcLat, lng: dcLng },
                        zoom: 10,
                        mapTypeControl: false,
                        streetViewControl: false,
                        fullscreenControl: true
                    });
                    driverMapInstance.current = map;
                }
                
                const map = driverMapInstance.current;
                const stops = routeData?.stops || [];
                const bounds = new google.maps.LatLngBounds();
                const dcPos = { lat: dcLat, lng: dcLng };
                
                // DC marker
                const dcMarker = new google.maps.Marker({
                    position: dcPos,
                    map,
                    title: routeData.dc_name + ' (DC)',
                    icon: {
                        url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="#6366F1" stroke="white" stroke-width="1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/></svg>'),
                        scaledSize: new google.maps.Size(36, 36),
                        anchor: new google.maps.Point(18, 18)
                    },
                    zIndex: 100
                });
                driverMarkersRef.current.push(dcMarker);
                bounds.extend(dcPos);
                
                // Stop markers - colors update based on current status
                stops.forEach((stop, idx) => {
                    const lat = parseFloat(stop.lat);
                    const lng = parseFloat(stop.lng);
                    if (isNaN(lat) || isNaN(lng)) return;
                    
                    const pos = { lat, lng };
                    let fillColor = '#F59E0B'; // pending - amber
                    if (stop.status === 'completed') fillColor = '#10B981'; // green
                    if (stop.status === 'skipped') fillColor = '#6B7280'; // gray
                    
                    const marker = new google.maps.Marker({
                        position: pos,
                        map,
                        title: `Stop ${stop.stop_number}: ${stop.customer_name}`,
                        label: { text: String(stop.stop_number), color: 'white', fontWeight: 'bold', fontSize: '11px' },
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: fillColor,
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });
                    
                    // Add click handler with stop info
                    const infoContent = `
                        <div style="color:#333;min-width:180px">
                            <strong>${stop.customer_name}</strong><br/>
                            <span style="color:#666">${stop.address}</span><br/>
                            <span style="padding:2px 6px;background:${fillColor};color:white;border-radius:4px;font-size:11px">${stop.status.toUpperCase()}</span>
                        </div>
                    `;
                    const infoWindow = new google.maps.InfoWindow({ content: infoContent });
                    marker.addListener('click', () => infoWindow.open(map, marker));
                    
                    driverMarkersRef.current.push(marker);
                    bounds.extend(pos);
                });
                
                // Draw route path
                if (stops.length > 0) {
                    const validStops = stops.filter(s => !isNaN(parseFloat(s.lat)) && !isNaN(parseFloat(s.lng)));
                    if (validStops.length > 0) {
                        const waypoints = validStops.map(stop => ({
                            location: new google.maps.LatLng(parseFloat(stop.lat), parseFloat(stop.lng)),
                            stopover: true
                        }));
                        
                        new google.maps.DirectionsService().route({
                            origin: dcPos,
                            destination: dcPos,
                            waypoints: waypoints,
                            travelMode: google.maps.TravelMode.DRIVING,
                            optimizeWaypoints: false
                        }, (result, status) => {
                            if (status === google.maps.DirectionsStatus.OK) {
                                const renderer = new google.maps.DirectionsRenderer({
                                    map: map,
                                    directions: result,
                                    suppressMarkers: true,
                                    preserveViewport: true,
                                    polylineOptions: {
                                        strokeColor: '#6366F1',
                                        strokeOpacity: 0.8,
                                        strokeWeight: 4
                                    }
                                });
                                driverRouteRenderer.current = renderer;
                            }
                        });
                    }
                }
                
                map.fitBounds(bounds);
            }, [showMap, routeData]); // Re-run when routeData changes (after completing a stop)

            const loadRouteDetails = async () => {
                try {
                    setLoading(true);
                    const data = await api.request(`/routes-v2/runs/${route.id}`);
                    setRouteData(data);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const startRoute = async () => {
                try {
                    await api.request(`/routes-v2/runs/${route.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: 'in_progress' })
                    });
                    loadRouteDetails();
                    showToast('Route started!', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            const loadCustomerProducts = async (customerId) => {
                try {
                    const data = await api.request(`/routes-v2/customer-products/${customerId}`);
                    setCustomerProducts(data.products || []);
                } catch (err) {
                    // Fallback to general products list
                    setCustomerProducts(products);
                }
            };

            const openStopCompletion = async (stop) => {
                if (deliverySettings.deliveryModel === 'products' || deliverySettings.deliveryModel === 'mixed') {
                    await loadCustomerProducts(stop.customer_id);
                }
                setSelectedStop(stop);
            };

            const completeStop = async (stopId, data) => {
                try {
                    // Choose endpoint based on delivery model
                    const endpoint = data.items 
                        ? `/routes-v2/runs/${route.id}/stops/${stopId}/complete-products`
                        : `/routes-v2/runs/${route.id}/stops/${stopId}/complete`;
                    
                    await api.request(endpoint, {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    setSelectedStop(null);
                    setCustomerProducts([]);
                    loadRouteDetails();
                    showToast('Stop completed!', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            const skipStop = async (stopId, reason) => {
                try {
                    await api.request(`/routes-v2/runs/${route.id}/stops/${stopId}/skip`, {
                        method: 'POST',
                        body: JSON.stringify({ reason })
                    });
                    setSelectedStop(null);
                    loadRouteDetails();
                    showToast('Stop skipped', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            const navigateToStop = (stop) => {
                const address = `${stop.address}, ${stop.city}, ${stop.state} ${stop.zip}`;
                // Try Apple Maps first (iOS), fallback to Google Maps
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                const url = isIOS 
                    ? `https://maps.apple.com/?daddr=${encodeURIComponent(address)}`
                    : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`;
                window.open(url, '_blank');
            };

            const callCustomer = (phone) => {
                if (phone) window.location.href = `tel:${phone}`;
            };

            if (loading) {
                return (
                    <div className="driver-app">
                        <div style={{textAlign:'center',padding:'4rem'}}>
                            <div className="spinner"></div>
                            <p style={{marginTop:'1rem',color:'var(--text-muted)'}}>Loading route...</p>
                        </div>
                    </div>
                );
            }

            const stops = routeData?.stops || [];
            const completed = stops.filter(s => s.status === 'completed').length;
            const pending = stops.filter(s => s.status === 'pending').length;
            const progress = stops.length > 0 ? ((completed / stops.length) * 100) : 0;
            const nextPendingStop = stops.find(s => s.status === 'pending');

            const detailStyles = `
                .route-detail { min-height: 100vh; background: var(--bg-dark); }
                .route-detail-header { background: var(--bg-card); padding: 1rem; border-bottom: 1px solid var(--border-color); }
                .route-summary-card { background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%); border-radius: 16px; padding: 1rem; margin: 1rem; }
                .route-progress { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 1rem; overflow: hidden; }
                .route-progress-fill { height: 100%; background: white; border-radius: 4px; transition: width 0.3s; }
                .driver-route-map { height: 200px; margin: 0 1rem 1rem; border-radius: 16px; overflow: hidden; border: 2px solid var(--border-color); }
                .stop-card { background: var(--bg-card); border-radius: 16px; margin: 0 1rem 0.75rem; overflow: hidden; border: 2px solid transparent; }
                .stop-card.current { border-color: var(--primary); box-shadow: 0 0 20px rgba(99,102,241,0.3); }
                .stop-card.completed { opacity: 0.6; }
                .stop-card.skipped { opacity: 0.5; }
                .stop-header { display: flex; align-items: center; padding: 1rem; gap: 0.75rem; cursor: pointer; }
                .stop-number { width: 44px; height: 44px; border-radius: 12px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }
                .stop-card.completed .stop-number { background: var(--success); }
                .stop-card.skipped .stop-number { background: var(--warning); }
                .stop-info { flex: 1; min-width: 0; }
                .stop-customer { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .stop-address { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .stop-details { padding: 0 1rem 1rem; }
                .stop-detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
                .stop-detail-item { background: var(--bg-input); padding: 0.75rem; border-radius: 12px; text-align: center; }
                .stop-detail-value { font-size: 1.25rem; font-weight: 700; }
                .stop-detail-label { font-size: 0.7rem; color: var(--text-muted); }
                .stop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
                .complete-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: flex-end; justify-content: center; padding: 1rem; }
                .complete-modal-content { background: var(--bg-card); border-radius: 24px 24px 16px 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
                .complete-modal-header { padding: 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
                .complete-modal-body { padding: 1.25rem; }
                .complete-modal-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border-color); display: flex; gap: 0.75rem; }
                .complete-modal-footer .btn { flex: 1; }
                .tank-low { color: var(--danger); }
                .tank-medium { color: var(--warning); }
                .tank-ok { color: var(--success); }
            `;

            return (
                <div className="route-detail">
                    <style>{detailStyles}</style>
                    
                    <div className="route-detail-header">
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                                <button className="icon-btn" onClick={onBack}>←</button>
                                <div>
                                    <h2 style={{fontSize:'1.1rem',margin:0}}>{routeData?.name || 'Route'}</h2>
                                    <div style={{fontSize:'0.85rem',color:'var(--text-muted)'}}>{routeData?.dc_name}</div>
                                </div>
                            </div>
                            <button className="icon-btn" onClick={loadRouteDetails}>↻</button>
                        </div>
                    </div>

                    {/* Route Summary */}
                    <div className="route-summary-card">
                        <div style={{display:'flex',justifyContent:'space-around',textAlign:'center'}}>
                            <div>
                                <div style={{fontSize:'1.5rem',fontWeight:'700'}}>{stops.length}</div>
                                <div style={{fontSize:'0.75rem',opacity:0.85}}>Total</div>
                            </div>
                            <div>
                                <div style={{fontSize:'1.5rem',fontWeight:'700'}}>{completed}</div>
                                <div style={{fontSize:'0.75rem',opacity:0.85}}>Done</div>
                            </div>
                            <div>
                                <div style={{fontSize:'1.5rem',fontWeight:'700'}}>{pending}</div>
                                <div style={{fontSize:'0.75rem',opacity:0.85}}>Left</div>
                            </div>
                            {deliverySettings.deliveryModel === 'products' ? (
                                <div>
                                    <div style={{fontSize:'1.5rem',fontWeight:'700'}}>
                                        {parseInt(routeData?.total_items_delivered || 0)}
                                    </div>
                                    <div style={{fontSize:'0.75rem',opacity:0.85}}>Items</div>
                                </div>
                            ) : (
                                <div>
                                    <div style={{fontSize:'1.5rem',fontWeight:'700'}}>{parseFloat(routeData?.total_gallons_delivered || 0).toFixed(0)}</div>
                                    <div style={{fontSize:'0.75rem',opacity:0.85}}>Gallons</div>
                                </div>
                            )}
                        </div>
                        {/* Revenue row */}
                        <div style={{display:'flex',justifyContent:'space-around',textAlign:'center',marginTop:'0.75rem',paddingTop:'0.75rem',borderTop:'1px solid rgba(255,255,255,0.2)'}}>
                            <div>
                                <div style={{fontSize:'1.25rem',fontWeight:'700'}}>${parseFloat(routeData?.total_revenue || 0).toFixed(2)}</div>
                                <div style={{fontSize:'0.7rem',opacity:0.85}}>Revenue</div>
                            </div>
                            {deliverySettings.deliveryModel === 'products' && (
                                <div>
                                    <div style={{fontSize:'1.25rem',fontWeight:'700'}}>
                                        {parseInt(routeData?.total_items_collected || 0)}
                                    </div>
                                    <div style={{fontSize:'0.7rem',opacity:0.85}}>Collected</div>
                                </div>
                            )}
                            <div>
                                <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{routeData?.estimated_miles || '—'}</div>
                                <div style={{fontSize:'0.7rem',opacity:0.85}}>Miles</div>
                            </div>
                        </div>
                        <div className="route-progress">
                            <div className="route-progress-fill" style={{width:`${progress}%`}}></div>
                        </div>
                        <div style={{display:'flex',justifyContent:'center',fontSize:'0.8rem',marginTop:'0.5rem',opacity:0.9}}>
                            <span>{progress.toFixed(0)}% Complete</span>
                        </div>
                    </div>

                    {/* Route Map Toggle */}
                    <div style={{padding:'0 1rem',marginBottom:'0.75rem'}}>
                        <button 
                            className="btn btn-block" 
                            style={{background:'var(--bg-card)',border:'1px solid var(--border-color)',padding:'0.75rem'}}
                            onClick={() => setShowMap(!showMap)}
                        >
                            🗺️ {showMap ? 'Hide Route Map' : 'Show Route Map'}
                        </button>
                    </div>

                    {/* Driver Route Map */}
                    {showMap && (
                        <div className="driver-route-map" ref={driverMapRef}></div>
                    )}

                    {/* Start Route / Navigate Button */}
                    <div style={{padding:'0 1rem',marginBottom:'1rem'}}>
                        {routeData?.status === 'scheduled' ? (
                            <button className="btn btn-success btn-block" style={{padding:'1rem',fontSize:'1.1rem'}} onClick={startRoute}>
                                🚀 Start Route
                            </button>
                        ) : nextPendingStop && (
                            <button className="btn btn-primary btn-block" style={{padding:'1rem',fontSize:'1.1rem',background:'#4285F4'}} onClick={() => navigateToStop(nextPendingStop)}>
                                🧭 Navigate to Next Stop
                            </button>
                        )}
                    </div>

                    {/* Stops List */}
                    <div style={{paddingBottom:'2rem'}}>
                        <h3 style={{padding:'0 1rem',marginBottom:'0.75rem'}}>Stops</h3>
                        {stops.map((stop) => {
                            const isExpanded = expandedStop === stop.id;
                            const isCurrent = stop.status === 'pending' && stop.id === nextPendingStop?.id;
                            const tankLevel = stop.tank_level_before || 50;
                            const tankClass = tankLevel <= 25 ? 'tank-low' : tankLevel <= 50 ? 'tank-medium' : 'tank-ok';

                            return (
                                <div key={stop.id} className={`stop-card ${stop.status} ${isCurrent ? 'current' : ''}`}>
                                    <div className="stop-header" onClick={() => setExpandedStop(isExpanded ? null : stop.id)}>
                                        <div className="stop-number">
                                            {stop.status === 'completed' ? '✓' : stop.status === 'skipped' ? '⚠' : stop.stop_number}
                                        </div>
                                        <div className="stop-info">
                                            <div className="stop-customer">{stop.customer_name}</div>
                                            <div className="stop-address">{stop.address}, {stop.city}</div>
                                        </div>
                                        <span className={`status-badge ${stop.status}`} style={{fontSize:'0.7rem'}}>
                                            {stop.status === 'completed' ? `${stop.gallons_delivered}g` : stop.status}
                                        </span>
                                    </div>

                                    {isExpanded && (
                                        <div className="stop-details">
                                            <div className="stop-detail-grid">
                                                <div className="stop-detail-item">
                                                    <div className="stop-detail-value">{stop.tank_size_gallons}g</div>
                                                    <div className="stop-detail-label">Tank</div>
                                                </div>
                                                <div className="stop-detail-item">
                                                    <div className={`stop-detail-value ${tankClass}`}>{tankLevel}%</div>
                                                    <div className="stop-detail-label">Level</div>
                                                </div>
                                                <div className="stop-detail-item">
                                                    <div className="stop-detail-value">${stop.price_per_gallon || '—'}</div>
                                                    <div className="stop-detail-label">$/Gal</div>
                                                </div>
                                            </div>

                                            {stop.status === 'pending' && routeData?.status === 'in_progress' && (
                                                <div className="stop-actions">
                                                    <button className="btn btn-primary" style={{padding:'0.875rem'}} onClick={() => navigateToStop(stop)}>
                                                        🧭 Navigate
                                                    </button>
                                                    <button className="btn btn-success" style={{padding:'0.875rem'}} onClick={() => openStopCompletion(stop)}>
                                                        ✓ Complete
                                                    </button>
                                                </div>
                                            )}

                                            {stop.status === 'completed' && (
                                                <div style={{background:'var(--bg-input)',padding:'0.75rem',borderRadius:'12px',fontSize:'0.9rem'}}>
                                                    <div><strong>Delivered:</strong> {stop.gallons_delivered} gal</div>
                                                    {stop.tank_level_after && <div><strong>After:</strong> {stop.tank_level_after}%</div>}
                                                </div>
                                            )}

                                            {stop.status === 'skipped' && (
                                                <div style={{background:'rgba(245,158,11,0.2)',padding:'0.75rem',borderRadius:'12px',fontSize:'0.9rem'}}>
                                                    <strong>Reason:</strong> {stop.skip_reason || 'Not specified'}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Complete Stop Modal */}
                    {selectedStop && (
                        <CompleteStopModal
                            stop={selectedStop}
                            deliverySettings={deliverySettings}
                            products={customerProducts.length > 0 ? customerProducts : products}
                            onComplete={(data) => completeStop(selectedStop.id, data)}
                            onSkip={(reason) => skipStop(selectedStop.id, reason)}
                            onClose={() => { setSelectedStop(null); setCustomerProducts([]); }}
                            onNavigate={() => navigateToStop(selectedStop)}
                            onCall={() => callCustomer(selectedStop.phone)}
                        />
                    )}
                </div>
            );
        }

        // Complete Stop Modal (shared) - Supports both gallons and products
        function CompleteStopModal({ stop, deliverySettings, products, onComplete, onSkip, onClose, onNavigate, onCall }) {
            // Determine effective mode - fall back to gallons if products mode but no products defined
            const configuredMode = deliverySettings?.deliveryModel || 'gallons';
            const hasProducts = products && products.length > 0;
            const effectiveMode = (configuredMode === 'products' || configuredMode === 'mixed') && !hasProducts ? 'gallons' : configuredMode;
            
            const [mode, setMode] = useState(effectiveMode);
            const [gallons, setGallons] = useState('');
            const [tankAfter, setTankAfter] = useState('');
            const [notes, setNotes] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSkip, setShowSkip] = useState(false);
            const [skipReason, setSkipReason] = useState('');
            const [showNoProductsWarning, setShowNoProductsWarning] = useState(
                (configuredMode === 'products' || configuredMode === 'mixed') && !hasProducts
            );
            
            // Product quantities: { productId: { delivered: 0, collected: 0 } }
            const [productQtys, setProductQtys] = useState({});

            const isProductMode = (mode === 'products' || mode === 'mixed') && hasProducts;
            const trackEmpties = deliverySettings?.trackEmpties || false;
            const estimatedGallons = Math.round(stop.tank_size_gallons * (1 - (stop.tank_level_before || 50) / 100));

            const updateProductQty = (productId, field, delta) => {
                setProductQtys(prev => {
                    const current = prev[productId] || { delivered: 0, collected: 0 };
                    const newValue = Math.max(0, (current[field] || 0) + delta);
                    return { ...prev, [productId]: { ...current, [field]: newValue } };
                });
            };

            const getProductQty = (productId, field) => {
                return productQtys[productId]?.[field] || 0;
            };

            const calculateTotals = () => {
                let itemsTotal = 0;
                let depositsCollected = 0;
                let depositsRefunded = 0;
                
                (products || []).forEach(p => {
                    const qty = productQtys[p.id];
                    if (qty) {
                        const delivered = qty.delivered || 0;
                        const collected = qty.collected || 0;
                        const price = parseFloat(p.effective_price || p.default_price) || 0;
                        const deposit = parseFloat(p.deposit_amount) || 0;
                        
                        itemsTotal += delivered * price;
                        
                        if (p.is_exchangeable && deposit > 0) {
                            if (delivered > collected) {
                                depositsCollected += (delivered - collected) * deposit;
                            } else if (collected > delivered) {
                                depositsRefunded += (collected - delivered) * deposit;
                            }
                        }
                    }
                });
                
                return { itemsTotal, depositsCollected, depositsRefunded, total: itemsTotal + depositsCollected - depositsRefunded };
            };

            const handleComplete = async () => {
                setLoading(true);
                
                if (isProductMode) {
                    // Build items array
                    const items = [];
                    (products || []).forEach(p => {
                        const qty = productQtys[p.id];
                        if (qty && (qty.delivered > 0 || qty.collected > 0)) {
                            items.push({
                                product_id: p.id,
                                quantity_delivered: qty.delivered || 0,
                                quantity_collected: qty.collected || 0
                            });
                        }
                    });
                    
                    if (items.length === 0) {
                        alert('Please add at least one product');
                        setLoading(false);
                        return;
                    }
                    
                    await onComplete({ items, notes });
                } else {
                    if (!gallons || parseFloat(gallons) <= 0) {
                        alert('Please enter gallons delivered');
                        setLoading(false);
                        return;
                    }
                    await onComplete({
                        gallons_delivered: parseFloat(gallons),
                        tank_level_after: tankAfter ? parseInt(tankAfter) : null,
                        notes
                    });
                }
                setLoading(false);
            };

            const handleSkip = async () => {
                if (!skipReason.trim()) {
                    alert('Please select a reason');
                    return;
                }
                setLoading(true);
                await onSkip(skipReason);
                setLoading(false);
            };

            const modalStyles = `
                .complete-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: flex-end; justify-content: center; padding: 1rem; }
                .complete-modal-content { background: var(--bg-card); border-radius: 24px 24px 16px 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease-out; }
                @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
                .complete-modal-header { padding: 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
                .complete-modal-body { padding: 1.25rem; }
                .complete-modal-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border-color); display: flex; gap: 0.75rem; }
                .complete-modal-footer .btn { flex: 1; padding: 1rem; }
                .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
                .quick-action { background: var(--bg-input); padding: 1rem; border-radius: 12px; text-align: center; border: none; color: var(--text-primary); cursor: pointer; }
                .quick-action:active { background: var(--primary); }
                .quick-action-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
                .quick-action-label { font-size: 0.85rem; }
                .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem; }
                .info-item { background: var(--bg-input); padding: 1rem; border-radius: 12px; }
                .info-item.full { grid-column: span 2; }
                .info-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
                .info-value { font-size: 1rem; font-weight: 500; }
                .info-value.large { font-size: 1.5rem; font-weight: 700; }
                .gallon-input { width: 100%; padding: 1rem; font-size: 2rem; text-align: center; font-weight: 700; border-radius: 12px; border: 2px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); }
                .gallon-input:focus { border-color: var(--primary); outline: none; }
                .product-row { display: flex; align-items: center; padding: 0.75rem; background: var(--bg-input); border-radius: 12px; margin-bottom: 0.5rem; gap: 0.5rem; }
                .product-info { flex: 1; min-width: 0; }
                .product-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .product-price { font-size: 0.75rem; color: var(--text-muted); }
                .qty-group { display: flex; flex-direction: column; align-items: center; }
                .qty-group-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; }
                .qty-controls { display: flex; align-items: center; gap: 0.25rem; }
                .qty-btn { width: 32px; height: 32px; border-radius: 6px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
                .qty-btn.minus { background: var(--danger); color: white; }
                .qty-btn.plus { background: var(--success); color: white; }
                .qty-btn:disabled { opacity: 0.3; }
                .qty-value { min-width: 28px; text-align: center; font-size: 1rem; font-weight: 700; }
                .totals-section { background: var(--primary); padding: 1rem; border-radius: 12px; margin-top: 1rem; }
                .totals-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.25rem; }
                .totals-row.total { font-size: 1.25rem; font-weight: 700; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.3); }
                .category-header { font-size: 0.8rem; color: var(--text-muted); margin: 1rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
            `;

            const tankLevel = stop.tank_level_before || 50;
            const tankClass = tankLevel <= 25 ? 'tank-low' : tankLevel <= 50 ? 'tank-medium' : 'tank-ok';
            const totals = calculateTotals();

            // Group products by category
            const groupedProducts = (products || []).reduce((acc, p) => {
                const cat = p.category || 'Other';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(p);
                return acc;
            }, {});

            return (
                <div className="complete-modal" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <style>{modalStyles}</style>
                    <div className="complete-modal-content">
                        <div className="complete-modal-header">
                            <h3 style={{margin:0}}>{showSkip ? '⚠️ Skip Stop' : `Stop #${stop.stop_number}`}</h3>
                            <button className="icon-btn" onClick={onClose} style={{width:'36px',height:'36px',fontSize:'1rem'}}>✕</button>
                        </div>

                        <div className="complete-modal-body">
                            {!showSkip ? (
                                <>
                                    <div style={{textAlign:'center',marginBottom:'1.25rem'}}>
                                        <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{stop.customer_name}</div>
                                        <div style={{color:'var(--text-muted)',fontSize:'0.9rem'}}>{stop.customer_code}</div>
                                    </div>

                                    <div className="quick-actions">
                                        <button className="quick-action" onClick={onNavigate}>
                                            <div className="quick-action-icon">🧭</div>
                                            <div className="quick-action-label">Navigate</div>
                                        </button>
                                        <button className="quick-action" onClick={onCall} disabled={!stop.phone}>
                                            <div className="quick-action-icon">📞</div>
                                            <div className="quick-action-label">Call</div>
                                        </button>
                                    </div>

                                    {/* Warning if products mode but no products defined */}
                                    {showNoProductsWarning && (
                                        <div style={{background:'rgba(245,158,11,0.15)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:'12px',padding:'0.75rem',marginBottom:'1rem'}}>
                                            <div style={{color:'var(--warning)',fontWeight:'600',marginBottom:'0.25rem'}}>⚠️ Products Not Set Up</div>
                                            <div style={{fontSize:'0.85rem',color:'var(--text-secondary)'}}>Your company is configured for product delivery, but no products have been added yet. Using gallons mode for now.</div>
                                        </div>
                                    )}

                                    <div className="info-grid">
                                        <div className="info-item full">
                                            <div className="info-label">Address</div>
                                            <div className="info-value">{stop.address}, {stop.city}, {stop.state}</div>
                                        </div>
                                    </div>

                                    {/* Product Mode */}
                                    {isProductMode && (
                                        <>
                                            <div style={{fontWeight:'600',marginBottom:'0.75rem'}}>Products Delivered</div>
                                            
                                            {Object.entries(groupedProducts).map(([category, catProducts]) => (
                                                <div key={category}>
                                                    <div className="category-header">{category}</div>
                                                    {catProducts.map(product => (
                                                        <div key={product.id} className="product-row">
                                                            <div className="product-info">
                                                                <div className="product-name">{product.name}</div>
                                                                <div className="product-price">
                                                                    ${parseFloat(product.effective_price || product.default_price).toFixed(2)}
                                                                    {product.is_exchangeable && ` (+$${parseFloat(product.deposit_amount || 0).toFixed(2)} dep)`}
                                                                </div>
                                                            </div>
                                                            
                                                            {/* Delivered quantity */}
                                                            <div className="qty-group">
                                                                <div className="qty-group-label">Deliver</div>
                                                                <div className="qty-controls">
                                                                    <button 
                                                                        className="qty-btn minus" 
                                                                        onClick={() => updateProductQty(product.id, 'delivered', -1)}
                                                                        disabled={getProductQty(product.id, 'delivered') === 0}
                                                                    >−</button>
                                                                    <div className="qty-value">{getProductQty(product.id, 'delivered')}</div>
                                                                    <button 
                                                                        className="qty-btn plus" 
                                                                        onClick={() => updateProductQty(product.id, 'delivered', 1)}
                                                                    >+</button>
                                                                </div>
                                                            </div>
                                                            
                                                            {/* Empties/Returns - only for exchangeable products */}
                                                            {trackEmpties && product.is_exchangeable && (
                                                                <div className="qty-group">
                                                                    <div className="qty-group-label">Pickup</div>
                                                                    <div className="qty-controls">
                                                                        <button 
                                                                            className="qty-btn minus" 
                                                                            onClick={() => updateProductQty(product.id, 'collected', -1)}
                                                                            disabled={getProductQty(product.id, 'collected') === 0}
                                                                        >−</button>
                                                                        <div className="qty-value">{getProductQty(product.id, 'collected')}</div>
                                                                        <button 
                                                                            className="qty-btn plus" 
                                                                            onClick={() => updateProductQty(product.id, 'collected', 1)}
                                                                        >+</button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            ))}

                                            {/* Totals */}
                                            {totals.total > 0 && (
                                                <div className="totals-section">
                                                    <div className="totals-row">
                                                        <span>Items</span>
                                                        <span>${totals.itemsTotal.toFixed(2)}</span>
                                                    </div>
                                                    {totals.depositsCollected > 0 && (
                                                        <div className="totals-row">
                                                            <span>Deposits</span>
                                                            <span>+${totals.depositsCollected.toFixed(2)}</span>
                                                        </div>
                                                    )}
                                                    {totals.depositsRefunded > 0 && (
                                                        <div className="totals-row">
                                                            <span>Deposit Refunds</span>
                                                            <span>-${totals.depositsRefunded.toFixed(2)}</span>
                                                        </div>
                                                    )}
                                                    <div className="totals-row total">
                                                        <span>Total</span>
                                                        <span>${totals.total.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}

                                    {/* Gallons Mode */}
                                    {!isProductMode && (
                                        <>
                                            <div className="info-grid">
                                                <div className="info-item">
                                                    <div className="info-label">Tank Size</div>
                                                    <div className="info-value large">{stop.tank_size_gallons}g</div>
                                                </div>
                                                <div className="info-item">
                                                    <div className="info-label">Current Level</div>
                                                    <div className={`info-value large ${tankClass}`}>{tankLevel}%</div>
                                                </div>
                                            </div>

                                            <div className="form-group">
                                                <label className="form-label">Gallons Delivered *</label>
                                                <input 
                                                    type="number" 
                                                    className="gallon-input" 
                                                    value={gallons}
                                                    onChange={(e) => setGallons(e.target.value)}
                                                    placeholder={estimatedGallons.toString()}
                                                    inputMode="decimal"
                                                />
                                                <div style={{textAlign:'center',marginTop:'0.5rem',color:'var(--text-muted)',fontSize:'0.85rem'}}>
                                                    Est. ~{estimatedGallons} gal needed
                                                </div>
                                            </div>

                                            <div className="form-group" style={{marginTop:'1rem'}}>
                                                <label className="form-label">Tank Level After (optional)</label>
                                                <input 
                                                    type="number" 
                                                    className="form-input" 
                                                    value={tankAfter}
                                                    onChange={(e) => setTankAfter(e.target.value)}
                                                    placeholder="e.g., 80"
                                                    inputMode="numeric"
                                                />
                                            </div>
                                        </>
                                    )}

                                    {/* Notes */}
                                    <div className="form-group" style={{marginTop:'1rem'}}>
                                        <label className="form-label">Notes (optional)</label>
                                        <textarea 
                                            className="form-input" 
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            placeholder="Any notes..."
                                            rows={2}
                                            style={{resize:'none'}}
                                        />
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div style={{textAlign:'center',marginBottom:'1.25rem'}}>
                                        <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{stop.customer_name}</div>
                                        <p style={{color:'var(--text-secondary)',marginTop:'0.5rem'}}>Select reason for skipping:</p>
                                    </div>

                                    <div className="form-group">
                                        <select 
                                            className="form-input" 
                                            value={skipReason}
                                            onChange={(e) => setSkipReason(e.target.value)}
                                            style={{padding:'1rem',fontSize:'1rem'}}
                                        >
                                            <option value="">Select reason...</option>
                                            <option value="Customer not home">Customer not home</option>
                                            <option value="Unable to access">Unable to access</option>
                                            <option value="Customer refused">Customer refused</option>
                                            <option value="Road blocked">Road blocked</option>
                                            <option value="Already full">Already full</option>
                                            <option value="Weather">Weather</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </>
                            )}
                        </div>

                        <div className="complete-modal-footer">
                            {!showSkip ? (
                                <>
                                    <button className="btn btn-warning" onClick={() => setShowSkip(true)}>⚠️ Skip</button>
                                    <button className="btn btn-success" onClick={handleComplete} disabled={loading}>
                                        {loading ? '...' : '✓ Complete'}
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button className="btn btn-secondary" onClick={() => setShowSkip(false)}>← Back</button>
                                    <button className="btn btn-warning" onClick={handleSkip} disabled={loading}>
                                        {loading ? '...' : 'Confirm Skip'}
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // =====================================================
        // Main App Component
        // =====================================================
        function App() {
            const [user, setUser] = useState(null);
            const [company, setCompany] = useState(null);
            const [initializing, setInitializing] = useState(true);
            const tenant = getTenant();

            // Clear all auth data
            const clearAuth = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
                localStorage.removeItem('company');
                localStorage.removeItem('tenant');
                localStorage.removeItem('companyId');
                localStorage.removeItem('companyName');
                api.setToken(null);
                api.tenant = null;
                setUser(null);
                setCompany(null);
            };

            // Handle logout
            const handleLogout = () => {
                clearAuth();
            };

            useEffect(() => {
                api.setTenant(tenant);
                
                // Check for existing session
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                const savedUser = localStorage.getItem('user');
                const savedCompany = localStorage.getItem('company');
                
                if (!token || !savedUser || !savedCompany) {
                    // No stored session
                    clearAuth();
                    setInitializing(false);
                    return;
                }
                
                try {
                    const parsedUser = JSON.parse(savedUser);
                    const parsedCompany = JSON.parse(savedCompany);
                    
                    if (!parsedUser?.id || !parsedUser?.name || !parsedCompany?.id || !parsedCompany?.name) {
                        clearAuth();
                        setInitializing(false);
                        return;
                    }
                    
                    api.setToken(token);
                    
                    // Verify token is still valid
                    api.request('/auth/me').then(data => {
                        if (data.user && data.company) {
                            setUser(data.user);
                            setCompany(data.company);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            localStorage.setItem('company', JSON.stringify(data.company));
                        } else {
                            clearAuth();
                        }
                        setInitializing(false);
                    }).catch(err => {
                        console.log('Session invalid:', err.message);
                        clearAuth();
                        setInitializing(false);
                    });
                } catch (err) {
                    console.error('Session restore error:', err);
                    clearAuth();
                    setInitializing(false);
                }
            }, [tenant]);

            const handleLogin = (data) => {
                if (data?.user && data?.company && data?.token) {
                    api.setToken(data.token);
                    if (data.company.subdomain) {
                        api.setTenant(data.company.subdomain);
                    }
                    setUser(data.user);
                    setCompany(data.company);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('company', JSON.stringify(data.company));
                }
            };

            // Show loading while checking session
            if (initializing) {
                return (
                    <div className="login-container">
                        <div className="login-box" style={{textAlign:'center'}}>
                            <div className="spinner" style={{margin:'2rem auto'}}></div>
                            <div style={{color:'var(--text-muted)'}}>Checking session...</div>
                        </div>
                    </div>
                );
            }

            // Show login if no user
            if (!user || !company) {
                return <LoginScreen onLogin={handleLogin} tenant={tenant} />;
            }
            
            // If user is a driver, show mobile-friendly driver dashboard
            if (user.role === 'driver') {
                return <DriverDashboard user={user} company={company} onLogout={handleLogout} />;
            }
            
            return <MainDashboard user={user} company={company} onLogout={handleLogout} />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
