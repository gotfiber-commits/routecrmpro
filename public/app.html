                                    <button className="modal-close" onClick={() => setShowCloneModal(false)}>×</button>
                                </div>
                                <div style={{padding:'1.5rem'}}>
                                    <p className="text-muted" style={{marginBottom:'1rem'}}>
                                        Create a copy of this route for another day. All stops will be copied with their current tank levels.
                                    </p>
                                    <div className="form-group">
                                        <label>Scheduled Date</label>
                                        <input
                                            type="date"
                                            className="form-control"
                                            value={cloneDate}
                                            onChange={(e) => setCloneDate(e.target.value)}
                                        />
                                    </div>
                                    <div style={{display:'flex',gap:'1rem',marginTop:'1.5rem'}}>
                                        <button className="btn btn-secondary" onClick={() => setShowCloneModal(false)}>Cancel</button>
                                        <button className="btn btn-primary" onClick={handleCloneRoute}>Clone Route</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // =====================================================
        // ROUTES VIEW - With Route Optimization (Legacy)
        // =====================================================
        function RoutesView({ data, onRefresh }) {
            const [showModal, setShowModal] = useState(false);
            const [editItem, setEditItem] = useState(null);
            const [loading, setLoading] = useState(false);
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [showBuilder, setShowBuilder] = useState(false);

            const dcOptions = (data?.distributionCenters || []).map(dc => ({ value: dc.id, label: dc.name }));
            const driverOptions = (data?.drivers || []).map(d => ({ value: d.id, label: `${d.code} - ${d.name}` }));
            const truckOptions = (data?.trucks || []).map(t => ({ value: t.id, label: `${t.code} - ${t.name || t.make + ' ' + t.model}` }));

            const fields = [
                { name: 'name', label: 'Route Name', placeholder: 'Morning Deliveries' },
                { name: 'dc_id', label: 'Distribution Center', type: 'select', required: true, options: dcOptions },
                { type: 'row', fields: [
                    { name: 'scheduled_date', label: 'Scheduled Date', type: 'date', required: true },
                    { name: 'start_time', label: 'Start Time', type: 'time' }
                ]},
                { type: 'row', fields: [
                    { name: 'driver_id', label: 'Driver', type: 'select', options: driverOptions },
                    { name: 'truck_id', label: 'Truck', type: 'select', options: truckOptions }
                ]},
                { name: 'status', label: 'Status', type: 'select', options: [
                    { value: 'planned', label: 'Planned' },
                    { value: 'in_progress', label: 'In Progress' },
                    { value: 'completed', label: 'Completed' },
                    { value: 'cancelled', label: 'Cancelled' }
                ]}
            ];

            const handleSave = async (formData) => {
                setLoading(true);
                try {
                    if (editItem) {
                        await api.request(`/data/routes/${editItem.id}`, { method: 'PUT', body: JSON.stringify(formData) });
                    } else {
                        await api.request('/data/routes', { method: 'POST', body: JSON.stringify(formData) });
                    }
                    setShowModal(false);
                    setEditItem(null);
                    onRefresh();
                } finally {
                    setLoading(false);
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('Delete this route?')) return;
                await api.request(`/data/routes/${id}`, { method: 'DELETE' });
                onRefresh();
            };

            if (showBuilder) {
                return <RouteBuilder data={data} onBack={() => { setShowBuilder(false); onRefresh(); }} onRefresh={onRefresh} />;
            }

            return (
                <>
                    <div className="page-header">
                        <h1 className="page-title">🗺️ Routes</h1>
                        <div style={{display:'flex',gap:'0.75rem'}}>
                            <button className="btn btn-success" onClick={() => setShowBuilder(true)}>🚀 Build & Optimize Route</button>
                            <button className="btn btn-primary" onClick={() => { setEditItem(null); setShowModal(true); }}>+ New Route</button>
                        </div>
                    </div>
                    <div className="table-container">
                        <table>
                            <thead><tr><th>Route #</th><th>Name</th><th>Date</th><th>Driver</th><th>Truck</th><th>Stops</th><th>Miles</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                {(data?.routes || []).map(item => (
                                    <tr key={item.id}>
                                        <td><strong>{item.route_number}</strong></td>
                                        <td>{item.name || '-'}</td>
                                        <td>{item.scheduled_date}</td>
                                        <td>{item.driver_name || '-'}</td>
                                        <td>{item.truck_name || '-'}</td>
                                        <td>{item.total_stops || 0}</td>
                                        <td>{item.total_miles ? `${item.total_miles} mi` : '-'}</td>
                                        <td>
                                            <span className={`status-badge status-${item.status}`}>{item.status}</span>
                                            {item.is_optimized && <span style={{marginLeft:'0.5rem',color:'var(--success)'}}>✓</span>}
                                        </td>
                                        <td>
                                            <div className="action-buttons">
                                                <button className="btn btn-sm btn-secondary" onClick={() => { setEditItem(item); setShowModal(true); }}>Edit</button>
                                                <button className="btn btn-sm btn-danger" onClick={() => handleDelete(item.id)}>Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                                {(!data?.routes || data.routes.length === 0) && (
                                    <tr><td colSpan="9" className="empty-state">No routes yet. Click "Build & Optimize Route" to create one.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    {showModal && (
                        <EntityModal 
                            title={editItem ? 'Edit Route' : 'New Route'}
                            fields={fields}
                            data={editItem || { status: 'planned', start_time: '08:00' }}
                            onSave={handleSave}
                            onClose={() => { setShowModal(false); setEditItem(null); }}
                            loading={loading}
                        />
                    )}
                </>
            );
        }

        // =====================================================
        // ROUTE BUILDER - Optimization Interface
        // =====================================================
        function RouteBuilder({ data, onBack, onRefresh }) {
            const [selectedDC, setSelectedDC] = useState('');
            const [selectedTruck, setSelectedTruck] = useState('');
            const [selectedOrders, setSelectedOrders] = useState([]);
            const [optimizedRoute, setOptimizedRoute] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [fuelPrice, setFuelPrice] = useState(3.50);
            const [routeName, setRouteName] = useState('');
            const [scheduledDate, setScheduledDate] = useState(new Date().toISOString().split('T')[0]);
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markersRef = useRef([]);
            const polylineRef = useRef(null);
            const directionsRendererRef = useRef(null);

            // Get pending orders
            const pendingOrders = (data?.orders || []).filter(o => o.status === 'pending' && !o.route_id);

            // Initialize map
            useEffect(() => {
                if (!mapRef.current || mapInstance.current) return;

                // Find company headquarters (first DC or primary DC)
                const headquarters = (data?.distributionCenters || []).find(dc => dc.is_headquarters || dc.is_primary) 
                    || (data?.distributionCenters || [])[0];
                
                const hqLat = headquarters?.lat ? parseFloat(headquarters.lat) : 39.8283;
                const hqLng = headquarters?.lng ? parseFloat(headquarters.lng) : -98.5795;
                const hasHQ = headquarters?.lat && headquarters?.lng;

                const map = new google.maps.Map(mapRef.current, {
                    center: { lat: hqLat, lng: hqLng },
                    zoom: hasHQ ? 8 : 4,
                    mapTypeControl: true,
                    streetViewControl: true,
                    fullscreenControl: true
                });
                mapInstance.current = map;

                // Add 500 mile radius circle around HQ
                if (hasHQ) {
                    const radiusInMeters = 500 * 1609.34; // 500 miles to meters
                    const serviceCircle = new google.maps.Circle({
                        map: map,
                        center: { lat: hqLat, lng: hqLng },
                        radius: radiusInMeters,
                        fillColor: '#6366F1',
                        fillOpacity: 0.08,
                        strokeColor: '#6366F1',
                        strokeOpacity: 0.4,
                        strokeWeight: 2
                    });
                    map.fitBounds(serviceCircle.getBounds());
                }

                // Initialize directions renderer for route display
                directionsRendererRef.current = new google.maps.DirectionsRenderer({
                    map: map,
                    suppressMarkers: true, // We'll add our own numbered markers
                    polylineOptions: {
                        strokeColor: '#6366F1',
                        strokeWeight: 4,
                        strokeOpacity: 0.8
                    }
                });

                return () => {
                    markersRef.current.forEach(m => m.setMap(null));
                    markersRef.current = [];
                    if (directionsRendererRef.current) directionsRendererRef.current.setMap(null);
                    mapInstance.current = null;
                };
            }, []);

            // Update map when optimized route changes
            useEffect(() => {
                if (!mapInstance.current) return;
                const map = mapInstance.current;

                // Clear existing markers
                markersRef.current.forEach(m => m.setMap(null));
                markersRef.current = [];
                if (polylineRef.current) {
                    polylineRef.current.setMap(null);
                    polylineRef.current = null;
                }
                if (directionsRendererRef.current) {
                    directionsRendererRef.current.setDirections({ routes: [] });
                }

                if (optimizedRoute) {
                    const bounds = new google.maps.LatLngBounds();

                    // Add depot marker
                    const depot = optimizedRoute.depot;
                    const depotMarker = new google.maps.Marker({
                        position: { lat: depot.lat, lng: depot.lng },
                        map: map,
                        title: depot.name,
                        icon: {
                            url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#6366F1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l6.9 3.45L12 11.09 5.1 7.63 12 4.18zM4 8.72l7 3.5v7.06l-7-3.5V8.72zm9 10.56V12.22l7-3.5v7.06l-7 3.5z"/></svg>'),
                            scaledSize: new google.maps.Size(32, 32),
                            anchor: new google.maps.Point(16, 16)
                        }
                    });
                    const depotInfo = new google.maps.InfoWindow({
                        content: `<div style="color:#333"><b>🏭 ${depot.name}</b><br/>Start/End Point</div>`
                    });
                    depotMarker.addListener('click', () => depotInfo.open(map, depotMarker));
                    markersRef.current.push(depotMarker);
                    bounds.extend(depotMarker.getPosition());

                    // Add stop markers with numbers
                    optimizedRoute.stops.forEach((stop, idx) => {
                        const marker = new google.maps.Marker({
                            position: { lat: stop.lat, lng: stop.lng },
                            map: map,
                            title: stop.name,
                            label: {
                                text: String(idx + 1),
                                color: 'white',
                                fontWeight: 'bold',
                                fontSize: '12px'
                            },
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 14,
                                fillColor: '#6366F1',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 2
                            }
                        });
                        const infoWindow = new google.maps.InfoWindow({
                            content: `<div style="color:#333"><b>Stop ${idx + 1}: ${stop.name}</b><br/>${stop.address || ''}<br/>${stop.city}, ${stop.state}<br/>Gallons: ${stop.gallons || '-'}</div>`
                        });
                        marker.addListener('click', () => infoWindow.open(map, marker));
                        markersRef.current.push(marker);
                        bounds.extend(marker.getPosition());
                    });

                    // Draw route using Directions API for real roads
                    if (optimizedRoute.stops.length > 0) {
                        const directionsService = new google.maps.DirectionsService();
                        const waypoints = optimizedRoute.stops.slice(0, -1).map(stop => ({
                            location: { lat: stop.lat, lng: stop.lng },
                            stopover: true
                        }));
                        
                        const lastStop = optimizedRoute.stops[optimizedRoute.stops.length - 1];
                        
                        directionsService.route({
                            origin: { lat: depot.lat, lng: depot.lng },
                            destination: { lat: depot.lat, lng: depot.lng }, // Return to depot
                            waypoints: optimizedRoute.stops.map(stop => ({
                                location: { lat: stop.lat, lng: stop.lng },
                                stopover: true
                            })),
                            optimizeWaypoints: false, // We already optimized
                            travelMode: google.maps.TravelMode.DRIVING
                        }, (result, status) => {
                            if (status === 'OK') {
                                directionsRendererRef.current.setDirections(result);
                            } else {
                                // Fallback to simple polyline if directions fail
                                const routeCoords = [
                                    { lat: depot.lat, lng: depot.lng },
                                    ...optimizedRoute.stops.map(s => ({ lat: s.lat, lng: s.lng })),
                                    { lat: depot.lat, lng: depot.lng }
                                ];
                                polylineRef.current = new google.maps.Polyline({
                                    path: routeCoords,
                                    strokeColor: '#6366F1',
                                    strokeWeight: 4,
                                    strokeOpacity: 0.8,
                                    map: map
                                });
                            }
                        });
                    }

                    map.fitBounds(bounds);
                } else if (selectedDC) {
                    // Show DC and selected orders on map
                    const dc = data?.distributionCenters?.find(d => d.id === selectedDC);
                    if (dc?.lat && dc?.lng) {
                        const bounds = new google.maps.LatLngBounds();
                        
                        const depotMarker = new google.maps.Marker({
                            position: { lat: parseFloat(dc.lat), lng: parseFloat(dc.lng) },
                            map: map,
                            title: dc.name,
                            icon: {
                                url: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#6366F1"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/></svg>'),
                                scaledSize: new google.maps.Size(32, 32),
                                anchor: new google.maps.Point(16, 16)
                            }
                        });
                        const depotInfo = new google.maps.InfoWindow({
                            content: `<div style="color:#333"><b>🏭 ${dc.name}</b></div>`
                        });
                        depotMarker.addListener('click', () => depotInfo.open(map, depotMarker));
                        markersRef.current.push(depotMarker);
                        bounds.extend(depotMarker.getPosition());

                        // Show selected orders
                        selectedOrders.forEach(orderId => {
                            const order = pendingOrders.find(o => o.id === orderId);
                            if (order?.lat && order?.lng) {
                                const marker = new google.maps.Marker({
                                    position: { lat: parseFloat(order.lat), lng: parseFloat(order.lng) },
                                    map: map,
                                    title: order.customer_name,
                                    icon: {
                                        path: google.maps.SymbolPath.CIRCLE,
                                        scale: 10,
                                        fillColor: '#F59E0B',
                                        fillOpacity: 1,
                                        strokeColor: '#ffffff',
                                        strokeWeight: 2
                                    }
                                });
                                const infoWindow = new google.maps.InfoWindow({
                                    content: `<div style="color:#333"><b>${order.customer_name}</b><br/>${order.gallons_requested} gal</div>`
                                });
                                marker.addListener('click', () => infoWindow.open(map, marker));
                                markersRef.current.push(marker);
                                bounds.extend(marker.getPosition());
                            }
                        });

                        if (markersRef.current.length > 0) {
                            map.fitBounds(bounds);
                        }
                    }
                }
            }, [optimizedRoute, selectedDC, selectedOrders, data]);

            const handleToggleOrder = (orderId) => {
                setSelectedOrders(prev => 
                    prev.includes(orderId) 
                        ? prev.filter(id => id !== orderId)
                        : [...prev, orderId]
                );
                setOptimizedRoute(null); // Clear optimization when selection changes
            };

            const handleSelectAll = () => {
                if (!selectedDC) return;
                const dcOrders = pendingOrders.filter(o => o.dc_id === selectedDC);
                setSelectedOrders(dcOrders.map(o => o.id));
                setOptimizedRoute(null);
            };

            const handleClearAll = () => {
                setSelectedOrders([]);
                setOptimizedRoute(null);
            };

            const handleOptimize = async () => {
                if (!selectedDC) {
                    setError('Please select a distribution center');
                    return;
                }
                if (selectedOrders.length < 2) {
                    setError('Please select at least 2 orders to optimize');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    const result = await api.request('/optimize-route', {
                        method: 'POST',
                        body: JSON.stringify({
                            dc_id: selectedDC,
                            order_ids: selectedOrders,
                            truck_id: selectedTruck || null,
                            fuel_price: fuelPrice
                        })
                    });
                    setOptimizedRoute(result);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSaveRoute = async () => {
                if (!optimizedRoute) return;

                setLoading(true);
                setError('');

                try {
                    // Create the route
                    const routeResult = await api.request('/data/routes', {
                        method: 'POST',
                        body: JSON.stringify({
                            name: routeName || `Optimized Route ${scheduledDate}`,
                            dc_id: selectedDC,
                            truck_id: selectedTruck || null,
                            driver_id: null,
                            scheduled_date: scheduledDate,
                            start_time: '08:00',
                            status: 'planned'
                        })
                    });

                    // Add stops to route
                    const stops = optimizedRoute.stops.map((stop, idx) => ({
                        order_id: stop.order_id,
                        stop_number: idx + 1
                    }));

                    await api.request(`/data/routes/${routeResult.id}/stops`, {
                        method: 'POST',
                        body: JSON.stringify({ orders: stops })
                    });

                    // Update route with optimization data
                    await api.request(`/data/routes/${routeResult.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            ...routeResult,
                            total_miles: optimizedRoute.metrics.totalMiles,
                            estimated_duration: optimizedRoute.metrics.totalTimeMinutes,
                            is_optimized: true
                        })
                    });

                    onRefresh();
                    onBack();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const selectedTruckData = data?.trucks?.find(t => t.id === selectedTruck);

            return (
                <>
                    <div className="page-header">
                        <h1 className="page-title">🚀 Route Builder & Optimizer</h1>
                        <button className="btn btn-secondary" onClick={onBack}>← Back to Routes</button>
                    </div>

                    {error && <div className="error-message" style={{marginBottom:'1rem'}}>{error}</div>}

                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem'}}>
                        {/* Left Panel - Configuration */}
                        <div>
                            <div className="card">
                                <div className="card-header"><h3>⚙️ Route Configuration</h3></div>
                                <div className="card-body">
                                    <div className="form-group">
                                        <label className="form-label">Distribution Center *</label>
                                        <select className="form-input" value={selectedDC} onChange={(e) => { setSelectedDC(e.target.value); setOptimizedRoute(null); }}>
                                            <option value="">Select DC...</option>
                                            {(data?.distributionCenters || []).map(dc => (
                                                <option key={dc.id} value={dc.id}>{dc.name} - {dc.city}, {dc.state}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label className="form-label">Truck</label>
                                            <select className="form-input" value={selectedTruck} onChange={(e) => { setSelectedTruck(e.target.value); setOptimizedRoute(null); }}>
                                                <option value="">Select Truck...</option>
                                                {(data?.trucks || []).filter(t => !selectedDC || t.dc_id === selectedDC).map(t => (
                                                    <option key={t.id} value={t.id}>{t.code} - {t.name || `${t.make} ${t.model}`} ({t.mpg || 8} MPG)</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Fuel Price ($/gal)</label>
                                            <input type="number" className="form-input" step="0.01" value={fuelPrice} onChange={(e) => setFuelPrice(parseFloat(e.target.value) || 3.50)} />
                                        </div>
                                    </div>
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label className="form-label">Route Name</label>
                                            <input type="text" className="form-input" value={routeName} onChange={(e) => setRouteName(e.target.value)} placeholder="Morning Deliveries" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Scheduled Date</label>
                                            <input type="date" className="form-input" value={scheduledDate} onChange={(e) => setScheduledDate(e.target.value)} />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Orders Selection */}
                            <div className="card">
                                <div className="card-header">
                                    <h3>📦 Select Orders ({selectedOrders.length} selected)</h3>
                                    <div style={{display:'flex',gap:'0.5rem'}}>
                                        <button className="btn btn-sm btn-secondary" onClick={handleSelectAll}>Select All</button>
                                        <button className="btn btn-sm btn-secondary" onClick={handleClearAll}>Clear</button>
                                    </div>
                                </div>
                                <div style={{maxHeight:'300px',overflow:'auto'}}>
                                    {!selectedDC ? (
                                        <div className="text-muted" style={{textAlign:'center',padding:'2rem'}}>
                                            ⬆️ Select a Distribution Center to see orders
                                        </div>
                                    ) : (
                                        <table>
                                            <thead><tr><th style={{width:'40px'}}></th><th>Order</th><th>Customer</th><th>Gallons</th><th>City</th><th>DC</th></tr></thead>
                                            <tbody>
                                                {pendingOrders.filter(o => o.dc_id === selectedDC).map(order => (
                                                    <tr key={order.id} style={{cursor:'pointer'}} onClick={() => handleToggleOrder(order.id)}>
                                                        <td>
                                                            <input type="checkbox" checked={selectedOrders.includes(order.id)} onChange={() => {}} style={{width:'18px',height:'18px'}} />
                                                        </td>
                                                        <td><strong>{order.order_number}</strong></td>
                                                        <td>{order.customer_name}</td>
                                                        <td>{order.gallons_requested}</td>
                                                        <td>{order.customer_city}</td>
                                                        <td style={{fontSize:'0.8rem'}}>{order.dc_name || '—'}</td>
                                                    </tr>
                                                ))}
                                                {pendingOrders.filter(o => o.dc_id === selectedDC).length === 0 && (
                                                    <tr><td colSpan="6" className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No pending orders for this DC</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    )}
                                    {selectedDC && pendingOrders.filter(o => !o.dc_id).length > 0 && (
                                        <div style={{padding:'0.5rem',background:'rgba(245,158,11,0.1)',borderRadius:'4px',margin:'0.5rem',fontSize:'0.85rem',color:'var(--warning)'}}>
                                            ⚠️ {pendingOrders.filter(o => !o.dc_id).length} orders have no DC assigned
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Optimize Button */}
                            <button 
                                className="btn btn-success btn-block" 
                                onClick={handleOptimize}
                                disabled={loading || selectedOrders.length < 2 || !selectedDC}
                                style={{marginBottom:'1rem',padding:'1rem',fontSize:'1.1rem'}}
                            >
                                {loading ? '⏳ Optimizing...' : '🚀 Optimize Route'}
                            </button>
                        </div>

                        {/* Right Panel - Map & Results */}
                        <div>
                            {/* Map */}
                            <div className="card">
                                <div className="card-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'0.5rem'}}>
                                    <h3>🗺️ Route Map</h3>
                                    <WeatherControl mapRef={mapInstance} compact />
                                </div>
                                <div style={{height:'350px'}}>
                                    <div ref={mapRef} style={{height:'100%',width:'100%',borderRadius:'0 0 12px 12px'}}></div>
                                </div>
                            </div>

                            {/* Optimization Results */}
                            {optimizedRoute && (
                                <div className="card" style={{borderColor:'var(--success)'}}>
                                    <div className="card-header" style={{background:'rgba(16,185,129,0.1)'}}>

        // =====================================================

        function TrucksView({ data, onRefresh }) {

            const dcOptions = (data?.distributionCenters || []).map(dc => ({ value: dc.id, label: dc.name }));
            const driverOptions = (data?.drivers || []).map(d => ({ value: d.id, label: `${d.code} - ${d.name}` }));

            // Calculate load capacity
            const calculateLoadCapacity = (truck) => {
                if (!truck.max_payload || !truck.product_weight_per_gallon) return truck.capacity_gallons;
                const dieselWeight = (truck.fuel_tank_capacity || 100) * (truck.diesel_weight_per_gallon || 7.1);
                const maxProductWeight = truck.max_payload - dieselWeight;
                const maxGallons = Math.floor(maxProductWeight / truck.product_weight_per_gallon);
                return Math.min(maxGallons, truck.capacity_gallons || 3000);
            };

            const getBasicFields = () => [
                { type: 'row', fields: [

            const handleSave = async (formData) => {
                setLoading(true);
                try {
                    if (editItem) {
                        await api.request(`/data/trucks/${editItem.id}`, { method: 'PUT', body: JSON.stringify(formData) });
                    } else {
                        await api.request('/data/trucks', { method: 'POST', body: JSON.stringify(formData) });

                    setEditItem(null);
                    onRefresh();

                    setLoading(false);

                await api.request(`/data/trucks/${id}`, { method: 'DELETE' });

            const tabs = [
                { id: 'basic', label: '📋 Basic Info' },

                                        <div><strong>DC:</strong> {viewItem.dc_name || '-'}</div>

                                </div>
                            </div>
                            <div className="card">
                                <div className="card-header"><h3>⚖️ Weight Specifications</h3></div>
                                <div className="card-body">
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',fontSize:'0.9rem'}}>
                                        <div><strong>GVWR:</strong> {viewItem.gvwr ? `${viewItem.gvwr.toLocaleString()} lbs` : '-'}</div>
                                        <div><strong>Tare Weight:</strong> {viewItem.tare_weight ? `${viewItem.tare_weight.toLocaleString()} lbs` : '-'}</div>
                                        <div><strong>Payload:</strong> {viewItem.max_payload ? `${viewItem.max_payload.toLocaleString()} lbs` : '-'}</div>
                                        <div><strong>Product Weight:</strong> {viewItem.product_weight_per_gallon || 4.2} lbs/gal</div>

        // Truck Form Modal with stable state management
        function TruckFormModal({ editItem, activeTab, setActiveTab, tabs, getFieldsForTab, onSave, onClose, loading }) {
            const defaultData = { status: 'active', capacity_gallons: 3000, mpg: 8, product_weight_per_gallon: 4.2, diesel_weight_per_gallon: 7.1, fuel_type: 'diesel', has_gps_tracker: true, has_eld: true };
            const [formData, setFormData] = useState(() => editItem ? { ...editItem } : { ...defaultData });
            const [error, setError] = useState('');

            const handleFieldChange = (name, value) => {
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    await onSave(formData);
                } catch (err) {
                    setError(err.message);
                }
            };

            const renderFields = () => {
                const fields = getFieldsForTab();
                return fields.map((field, index) => {
                    if (field.type === 'row') {
                        return (
                            <div key={`row-${index}`} className="form-row">
                                {field.fields.map(f => (
                                    <FormInput key={f.name} name={f.name} label={f.label} type={f.type} value={formData[f.name]} onChange={handleFieldChange} required={f.required} placeholder={f.placeholder} step={f.step} options={f.options} />
                                ))}
                            </div>
                        );
                    }
                    if (field.type === 'row3') {
                        return (
                            <div key={`row3-${index}`} className="form-row-3">
                                {field.fields.map(f => (
                                    <FormInput key={f.name} name={f.name} label={f.label} type={f.type} value={formData[f.name]} onChange={handleFieldChange} required={f.required} placeholder={f.placeholder} step={f.step} options={f.options} />
                                ))}
                            </div>
                        );
                    }
                    return <FormInput key={field.name} name={field.name} label={field.label} type={field.type} value={formData[field.name]} onChange={handleFieldChange} required={field.required} placeholder={field.placeholder} step={field.step} options={field.options} />;
                });
            };

            return (
                <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>

        // Driver Form Modal with stable state management
        function DriverFormModal({ editItem, activeTab, setActiveTab, tabs, getFieldsForTab, onSave, onClose, loading }) {
            const defaultData = { status: 'active', pay_type: 'hourly', hourly_rate: 25, background_check_status: 'pending', drug_test_status: 'pending', mvr_status: 'pending' };
            const [formData, setFormData] = useState(() => editItem ? { ...editItem } : { ...defaultData });
            const [error, setError] = useState('');

            const handleFieldChange = (name, value) => {
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    await onSave(formData);
                } catch (err) {
                    setError(err.message);
                }
            };

            const renderFields = () => {
                const fields = getFieldsForTab();
                return fields.map((field, index) => {
                    // Special handling for driver address (no lat/lng for drivers)
                    if (field.type === 'address_group') {
                        return (
                            <div key="address-group" style={{background:'var(--bg-dark)',padding:'1rem',borderRadius:'8px',marginBottom:'1rem'}}>
                                <div style={{marginBottom:'0.75rem'}}>
                                    <strong style={{fontSize:'0.9rem'}}>📍 Address</strong>
                                </div>
                                <FormInput name="address" label="Street Address" value={formData.address} onChange={handleFieldChange} />
                                <div className="form-row-3">
                                    <FormInput name="city" label="City" value={formData.city} onChange={handleFieldChange} />
                                    <FormInput name="state" label="State" value={formData.state} onChange={handleFieldChange} />
                                    <FormInput name="zip" label="ZIP" value={formData.zip} onChange={handleFieldChange} />
                                </div>
                            </div>
                        );
                    }
                    if (field.type === 'row') {
                        return (
                            <div key={`row-${index}`} className="form-row">
                                {field.fields.map(f => (
                                    <FormInput key={f.name} name={f.name} label={f.label} type={f.type} value={formData[f.name]} onChange={handleFieldChange} required={f.required} placeholder={f.placeholder} step={f.step} options={f.options} />
                                ))}
                            </div>
                        );
                    }
                    if (field.type === 'row3') {
                        return (
                            <div key={`row3-${index}`} className="form-row-3">
                                {field.fields.map(f => (
                                    <FormInput key={f.name} name={f.name} label={f.label} type={f.type} value={formData[f.name]} onChange={handleFieldChange} required={f.required} placeholder={f.placeholder} step={f.step} options={f.options} />
                                ))}
                            </div>
                        );
                    }
                    return <FormInput key={field.name} name={field.name} label={field.label} type={field.type} value={formData[field.name]} onChange={handleFieldChange} required={field.required} placeholder={field.placeholder} step={field.step} options={field.options} />;
                });
            };

            return (
                <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <div className="modal" style={{maxWidth:'1100px',width:'95%',height:'85vh',display:'flex',flexDirection:'column'}}>
                        <div className="modal-header" style={{flexShrink:0}}>
                            <h3>{editItem ? 'Edit Driver' : 'Add Driver'}</h3>
                            <button className="modal-close" onClick={onClose}>&times;</button>
                        </div>
                        <div style={{padding:'0 1rem',borderBottom:'1px solid var(--border)',display:'flex',gap:'0.25rem',flexWrap:'nowrap',flexShrink:0}}>
                            {tabs.map(tab => (
                                <button key={tab.id} className={`btn btn-sm ${activeTab === tab.id ? 'btn-primary' : 'btn-secondary'}`} style={{borderRadius:'8px 8px 0 0',whiteSpace:'nowrap',fontSize:'0.8rem',padding:'0.5rem 0.75rem'}} onClick={() => setActiveTab(tab.id)}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                        <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}}>
                            <div className="modal-body" style={{flex:1,overflowY:'auto',minHeight:0}}>
                                {error && <div className="error-message">{error}</div>}
                                <div style={{minHeight:'400px'}}>
                                    {renderFields()}
                                </div>
                            </div>
                            <div className="modal-footer" style={{flexShrink:0}}>
                                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>

        // =====================================================
        // PRODUCTS & SERVICES VIEW (Admin Only)
        // =====================================================
        function ProductsContent({ onRefresh }) {
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(false);
            const [editItem, setEditItem] = useState(null);
            const [filter, setFilter] = useState('all');
            const [migrationNeeded, setMigrationNeeded] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            useEffect(() => {
                loadProducts();
            }, []);

            const loadProducts = async () => {
                try {
                    setLoading(true);
                    setMigrationNeeded(false);
                    setErrorMessage('');
                    const data = await api.request('/products');
                    setProducts(data);
                } catch (err) {
                    console.error('Failed to load products:', err);
                    if (err.message.includes('migration') || err.message.includes('does not exist')) {
                        setMigrationNeeded(true);
                        setErrorMessage(err.message);
                    } else {
                        setErrorMessage(err.message);
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleSave = async (formData) => {
                try {
                    if (editItem) {
                        await api.request(`/products/${editItem.id}`, { method: 'PUT', body: JSON.stringify(formData) });
                    } else {
                        await api.request('/products', { method: 'POST', body: JSON.stringify(formData) });
                    }
                    setShowModal(false);
                    setEditItem(null);
                    loadProducts();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('Delete this product?')) return;
                await api.request(`/products/${id}`, { method: 'DELETE' });
                loadProducts();
            };

            const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
            const filteredProducts = filter === 'all' 
                ? products 
                : filter === 'products' 
                    ? products.filter(p => p.type === 'product')
                    : filter === 'services'
                        ? products.filter(p => p.type === 'service')
                        : products.filter(p => p.category === filter);

            const formFields = [
                { type: 'row', fields: [
                    { name: 'type', label: 'Type', type: 'select', required: true, options: [
                        { value: 'product', label: 'Product' },
                        { value: 'service', label: 'Service' }

                    { name: 'status', label: 'Status', type: 'select', options: [
                        { value: 'active', label: 'Active' },
                        { value: 'inactive', label: 'Inactive' }
                    ]}
                ]},
                { type: 'row', fields: [
                    { name: 'code', label: 'Code', type: 'text', placeholder: 'e.g., 20LB' },
                    { name: 'name', label: 'Name', type: 'text', required: true, placeholder: '20lb Propane Tank' }
                ]},
                { type: 'row', fields: [
                    { name: 'category', label: 'Category', type: 'text', placeholder: 'Propane Tanks' },
                    { name: 'unit', label: 'Unit', type: 'text', placeholder: 'each' }
                ]},
                { type: 'row', fields: [
                    { name: 'default_price', label: 'Price ($)', type: 'number', step: '0.01', required: true },
                    { name: 'cost', label: 'Cost ($)', type: 'number', step: '0.01' }
                ]},
                { type: 'row', fields: [
                    { name: 'gallon_equivalent', label: 'Gallon Equivalent', type: 'number', step: '0.1', placeholder: 'For reporting' },
                    { name: 'sort_order', label: 'Sort Order', type: 'number' }
                ]},
                { type: 'row', fields: [
                    { name: 'is_exchangeable', label: 'Exchangeable?', type: 'checkbox' },
                    { name: 'deposit_amount', label: 'Deposit ($)', type: 'number', step: '0.01' }
                ]},
                { name: 'track_inventory', label: 'Track Inventory on Trucks', type: 'checkbox' },
                { name: 'description', label: 'Description', type: 'textarea' }
            ];

            return (
                <>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
                        <h3 style={{margin:0}}>📦 Products & Services</h3>
                        {!migrationNeeded && <button className="btn btn-primary" onClick={() => { setEditItem(null); setShowModal(true); }}>+ Add Product</button>}
                    </div>

                    {migrationNeeded ? (
                        <div className="card" style={{maxWidth:'600px',borderColor:'var(--warning)'}}>
                            <div className="card-header" style={{background:'rgba(245,158,11,0.1)'}}>
                                <h3 style={{color:'var(--warning)'}}>⚠️ Database Migration Required</h3>
                            </div>
                            <div className="card-body">
                                <p style={{marginBottom:'1rem'}}>The Products feature requires a database migration to be run first.</p>
                                <p style={{marginBottom:'1rem',color:'var(--text-muted)'}}><strong>Error:</strong> {errorMessage}</p>
                                <h4 style={{marginBottom:'0.5rem'}}>To enable Products:</h4>
                                <ol style={{paddingLeft:'1.25rem',lineHeight:'1.8'}}>
                                    <li>Open your <strong>Neon Console</strong></li>
                                    <li>Go to the <strong>SQL Editor</strong></li>
                                    <li>Run the <strong>products-schema.sql</strong> migration file</li>
                                    <li>Refresh this page</li>

                                <button className="btn btn-primary" style={{marginTop:'1rem'}} onClick={loadProducts}>🔄 Retry</button>

                    ) : (

                                <button className={`btn btn-sm ${filter === 'all' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setFilter('all')}>All</button>
                                <button className={`btn btn-sm ${filter === 'products' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setFilter('products')}>Products</button>
                                <button className={`btn btn-sm ${filter === 'services' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setFilter('services')}>Services</button>
                                {categories.map(cat => (
                                    <button key={cat} className={`btn btn-sm ${filter === cat ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setFilter(cat)}>{cat}</button>
                                ))}
                            </div>

                            {loading ? (
                                <div style={{textAlign:'center',padding:'2rem'}}><div className="spinner"></div></div>
                            ) : (
                                <div className="table-container">
                                    <table className="table">
                                        <thead>
                                            <tr>
                                                <th>Type</th>
                                                <th>Code</th>
                                                <th>Name</th>
                                                <th>Category</th>
                                                <th>Price</th>
                                                <th>Exchange</th>
                                                <th>Status</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredProducts.map(p => (
                                                <tr key={p.id}>
                                                    <td><span className={`badge ${p.type === 'service' ? 'badge-info' : 'badge-success'}`}>{p.type}</span></td>
                                                    <td>{p.code || '—'}</td>
                                                    <td><strong>{p.name}</strong></td>
                                                    <td>{p.category || '—'}</td>
                                                    <td>${parseFloat(p.default_price).toFixed(2)}</td>
                                                    <td>{p.is_exchangeable ? `Yes (+$${parseFloat(p.deposit_amount || 0).toFixed(2)})` : '—'}</td>
                                                    <td><span className={`badge ${p.status === 'active' ? 'badge-success' : 'badge-warning'}`}>{p.status}</span></td>
                                                    <td>
                                                        <button className="btn btn-sm btn-secondary" onClick={() => { setEditItem(p); setShowModal(true); }}>Edit</button>
                                                        <button className="btn btn-sm btn-danger" style={{marginLeft:'0.5rem'}} onClick={() => handleDelete(p.id)}>Delete</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredProducts.length === 0 && (
                                                <tr><td colSpan="8" style={{textAlign:'center',padding:'2rem',color:'var(--text-muted)'}}>No products found. Add your first product!</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </>
                    )}

                    {showModal && (
                        <EntityModal
                            title={editItem ? 'Edit Product' : 'Add Product'}
                            fields={formFields}
                            data={editItem || { type: 'product', status: 'active', unit: 'each' }}
                            onSave={handleSave}
                            onClose={() => { setShowModal(false); setEditItem(null); }}
                        />
                    )}
                </>
            );
        }

                    setLoading(false);

                setLoading(true);
                try {
                    await api.request(`/data/users/${resetPasswordUser.id}`, { 
                        method: 'PUT', 
                        body: JSON.stringify({ 
                            username: resetPasswordUser.username,
                            name: resetPasswordUser.name,
                            email: resetPasswordUser.email,
                            phone: resetPasswordUser.phone,
                            role: resetPasswordUser.role,
                            status: resetPasswordUser.status,
                            dc_id: resetPasswordUser.dc_id,
                            driver_id: resetPasswordUser.driver_id,
                            password: newPassword 
                        })

        // =====================================================
        // REPORTS VIEW - Analytics & Performance Reports
        // =====================================================
        function ReportsView({ data }) {
            const [activeReport, setActiveReport] = useState('dashboard');

            const [loading, setLoading] = useState(true);
            const [dateRange, setDateRange] = useState({
                start: new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                end: new Date().toISOString().split('T')[0]
            });
            const [quickRange, setQuickRange] = useState('30');

            const reportTypes = [
                { id: 'dashboard', icon: '📊', label: 'Executive Dashboard', desc: 'High-level KPIs and trends' },
                { id: 'routes', icon: '🗺️', label: 'Route Performance', desc: 'Route efficiency and completion rates' },
                { id: 'drivers', icon: '👷', label: 'Driver Performance', desc: 'Driver productivity and metrics' },
                { id: 'trucks', icon: '🚚', label: 'Fleet Report', desc: 'Vehicle utilization and fuel efficiency' },
                { id: 'customers', icon: '👥', label: 'Customer Report', desc: 'Delivery history and account balances' },
                { id: 'products', icon: '📦', label: 'Product Sales', desc: 'Product revenue and inventory' },
                { id: 'financial', icon: '💰', label: 'Financial Report', desc: 'Revenue, costs, and profitability' },
                { id: 'daily', icon: '📅', label: 'Daily Summary', desc: 'Day-by-day breakdown' }
            ];

            useEffect(() => {
                loadReport();
            }, [activeReport, dateRange]);

            const loadReport = async () => {
                setLoading(true);
                try {
                    const result = await api.request(`/reports/${activeReport}?start_date=${dateRange.start}&end_date=${dateRange.end}`);
                    setReportData(result);
                } catch (err) {
                    console.error('Error loading report:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleQuickRange = (days) => {
                setQuickRange(days);
                const end = new Date();
                const start = new Date();
                if (days === 'mtd') {
                    start.setDate(1);
                } else if (days === 'ytd') {
                    start.setMonth(0, 1);
                } else {
                    start.setDate(start.getDate() - parseInt(days));
                }
                setDateRange({
                    start: start.toISOString().split('T')[0],
                    end: end.toISOString().split('T')[0]
                });
            };

            const exportCSV = () => {
                if (!reportData) return;
                let csv = '';
                let filename = `${activeReport}_report_${dateRange.start}_to_${dateRange.end}.csv`;
                
                // Different export logic based on report type
                if (activeReport === 'drivers' && reportData.drivers) {
                    csv = 'Driver Code,Name,Routes,Deliveries,Miles,Hours,Gallons,Revenue,Labor Cost\n';
                    reportData.drivers.forEach(d => {
                        csv += `${d.code},${d.name},${d.routes_completed},${d.stops_completed},${d.total_miles},${d.total_hours},${d.total_gallons},${d.total_revenue},${d.total_labor_cost}\n`;
                    });
                } else if (activeReport === 'trucks' && reportData.trucks) {
                    csv = 'Truck Code,Make,Model,Routes,Miles,Fuel Used,Fuel Cost,Deliveries,Actual MPG\n';
                    reportData.trucks.forEach(t => {
                        csv += `${t.code},${t.make},${t.model},${t.routes_completed},${t.total_miles},${t.total_fuel_used},${t.total_fuel_cost},${t.total_deliveries},${t.actual_mpg}\n`;
                    });
                } else if (activeReport === 'routes' && reportData.routes) {
                    csv = 'Route Name,Date,Status,Driver,Truck,Stops,Miles,Gallons,Revenue,Cost\n';
                    reportData.routes.forEach(r => {
                        csv += `"${r.name}",${r.scheduled_date},${r.status},${r.driver_name || ''},${r.truck_code || ''},${r.total_stops},${r.estimated_miles},${r.total_gallons_delivered},${r.total_revenue},${r.estimated_total_cost}\n`;
                    });
                } else if (activeReport === 'daily' && reportData.daily) {
                    csv = 'Date,Routes,Completed,Stops,Miles,Gallons,Revenue,Cost\n';
                    reportData.daily.forEach(d => {
                        csv += `${d.date},${d.routes},${d.completed_routes},${d.stops_completed},${d.total_miles},${d.total_gallons},${d.total_revenue},${d.total_cost}\n`;
                    });
                }

                if (csv) {
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                }
            };

            const formatCurrency = (val) => '$' + (parseFloat(val) || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const formatNumber = (val) => (parseFloat(val) || 0).toLocaleString(undefined, {maximumFractionDigits: 1});

            // Simple bar chart component
            const BarChart = ({ data, labelKey, valueKey, color = '#6366f1', height = 200 }) => {
                if (!data || data.length === 0) return <div className="text-muted" style={{textAlign:'center',padding:'2rem'}}>No data</div>;
                const maxVal = Math.max(...data.map(d => parseFloat(d[valueKey]) || 0));
                return (
                    <div style={{display:'flex',alignItems:'flex-end',gap:'4px',height:`${height}px`,padding:'0.5rem 0'}}>
                        {data.map((item, idx) => {
                            const val = parseFloat(item[valueKey]) || 0;
                            const pct = maxVal > 0 ? (val / maxVal) * 100 : 0;
                            return (
                                <div key={idx} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'4px'}}>
                                    <div style={{fontSize:'0.7rem',color:'var(--text-muted)'}}>{formatNumber(val)}</div>
                                    <div style={{width:'100%',height:`${pct}%`,minHeight:'4px',background:color,borderRadius:'4px 4px 0 0',transition:'height 0.3s'}}></div>
                                    <div style={{fontSize:'0.65rem',color:'var(--text-muted)',textAlign:'center',maxWidth:'60px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={item[labelKey]}>

                                </div>
                            );

            // Mini sparkline

                if (!data || data.length < 2) return null;
                const values = data.map(d => parseFloat(d[valueKey]) || 0);
                const max = Math.max(...values);
                const min = Math.min(...values);
                const range = max - min || 1;
                const width = 100;
                const points = values.map((v, i) => `${(i / (values.length - 1)) * width},${height - ((v - min) / range) * height}`).join(' ');
                return (
                    <svg width={width} height={height} style={{display:'block'}}>
                        <polyline points={points} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>

        // =====================================================
        // INTEGRATIONS VIEW - Fleetmatics / Telematics
        // =====================================================
        function IntegrationsContent({ data, onRefresh }) {
            const [loading, setLoading] = useState(true);
            const [fleetmaticsStatus, setFleetmaticsStatus] = useState(null);
            const [vehicles, setVehicles] = useState([]);
            const [showConnectModal, setShowConnectModal] = useState(false);
            const [showLinkModal, setShowLinkModal] = useState(null);
            const [credentials, setCredentials] = useState({ username: '', password: '', api_key: '' });
            const [connecting, setConnecting] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            useEffect(() => {
                loadFleetmaticsStatus();
            }, []);

            const loadFleetmaticsStatus = async () => {
                setLoading(true);
                try {
                    const status = await api.request('/fleetmatics/status');
                    setFleetmaticsStatus(status);
                    
                    if (status.enabled) {
                        const vehicleData = await api.request('/fleetmatics/vehicles');
                        setVehicles(vehicleData.vehicles || []);
                    }
                } catch (err) {
                    console.log('Fleetmatics not configured:', err.message);
                    setFleetmaticsStatus({ enabled: false, connected: false });
                } finally {
                    setLoading(false);
                }
            };

            const handleConnect = async () => {
                if (!credentials.username || !credentials.password) {
                    setError('Username and password are required');
                    return;
                }
                
                setConnecting(true);
                setError('');
                
                try {
                    const result = await api.request('/fleetmatics/connect', {
                        method: 'POST',
                        body: JSON.stringify(credentials)
                    });
                    
                    setSuccessMsg('Connected successfully! ' + (result.vehicles_synced || 0) + ' vehicles synced.');
                    setShowConnectModal(false);
                    setCredentials({ username: '', password: '', api_key: '' });
                    loadFleetmaticsStatus();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setConnecting(false);
                }
            };

            const handleDisconnect = async () => {
                if (!confirm('Disconnect from Verizon Connect? This will unlink all trucks from telematics tracking.')) return;
                
                try {

        // =====================================================
        // ADD CARD FORM - Stripe Elements
        // =====================================================
        function AddCardForm({ onSuccess, onCancel }) {
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [stripeReady, setStripeReady] = useState(false);
            const [cardComplete, setCardComplete] = useState(false);
            const stripeRef = useRef(null);
            const elementsRef = useRef(null);
            const cardRef = useRef(null);
            const cardElementRef = useRef(null);

            useEffect(() => {
                initStripe();
                return () => {
                    if (cardElementRef.current) {
                        cardElementRef.current.destroy();
                    }
                };
            }, []);

            const initStripe = async () => {
                try {
                    // Get Stripe config
                    const config = await api.request('/tenant-billing/stripe-config');
                    
                    if (!config.publishableKey) {
                        setError('Stripe is not configured. Please contact support.');
                        return;
                    }

                    // Initialize Stripe
                    const stripe = Stripe(config.publishableKey);
                    stripeRef.current = stripe;

                    // Create Elements
                    const elements = stripe.elements({
                        appearance: {
                            theme: 'night',
                            variables: {
                                colorPrimary: '#6366F1',
                                colorBackground: '#0F172A',
                                colorText: '#F8FAFC',
                                colorDanger: '#EF4444',
                                fontFamily: 'Outfit, system-ui, sans-serif',
                                borderRadius: '8px'
                            }
                        }
                    });
                    elementsRef.current = elements;

                    // Create card element
                    const cardElement = elements.create('card', {
                        style: {
                            base: {
                                fontSize: '16px',
                                color: '#F8FAFC',
                                '::placeholder': { color: '#64748B' }
                            },
                            invalid: { color: '#EF4444' }
                        }
                    });

                    // Mount card element
                    if (cardRef.current) {
                        cardElement.mount(cardRef.current);
                        cardElementRef.current = cardElement;

                        cardElement.on('change', (event) => {
                            setCardComplete(event.complete);
                            if (event.error) {
                                setError(event.error.message);
                            } else {
                                setError('');
                            }
                        });

                        cardElement.on('ready', () => {
                            setStripeReady(true);
                        });
                    }
                } catch (err) {
                    console.error('Stripe init error:', err);
                    setError('Failed to initialize payment form: ' + err.message);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!stripeRef.current || !cardElementRef.current) {
                    setError('Payment form not ready');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    // Create SetupIntent
                    const setupData = await api.request('/tenant-billing/setup-intent', { method: 'POST' });

                    if (!setupData.client_secret) {
                        throw new Error('Failed to create setup intent');
                    }

                    // Confirm card setup
                    const { setupIntent, error: stripeError } = await stripeRef.current.confirmCardSetup(
                        setupData.client_secret,
                        { payment_method: { card: cardElementRef.current } }
                    );

                    if (stripeError) {
                        throw new Error(stripeError.message);
                    }

                    if (setupIntent.status !== 'succeeded') {
                        throw new Error('Card setup failed: ' + setupIntent.status);
                    }

                    // Save payment method to our backend
                    await api.request('/tenant-billing/save-payment-method', {
                        method: 'POST',
                        body: JSON.stringify({ payment_method_id: setupIntent.payment_method })
                    });

                    onSuccess();
                } catch (err) {
                    console.error('Payment error:', err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <form onSubmit={handleSubmit}>
                    {error && <div className="error-message" style={{marginBottom:'1rem'}}>{error}</div>}
                    
                    <div style={{marginBottom:'1.5rem'}}>
                        <label className="form-label">Card Details</label>
                        <div 
                            ref={cardRef}
                            style={{
                                padding: '1rem',
                                background: 'var(--bg-dark)',
                                border: '2px solid var(--border)',
                                borderRadius: '8px',
                                minHeight: '50px'
                            }}
                        >
                            {!stripeReady && <span className="text-muted">Loading payment form...</span>}
                        </div>
                    </div>

                    <div style={{background:'var(--bg-dark)',padding:'1rem',borderRadius:'8px',marginBottom:'1.5rem'}}>
                        <div style={{fontSize:'0.85rem',color:'var(--text-muted)'}}>
                            <strong>Test Cards:</strong><br/>
                            ✅ Success: 4242 4242 4242 4242<br/>
                            ❌ Decline: 4000 0000 0000 0002<br/>
                            Use any future expiry, any CVC, any ZIP
                        </div>
                    </div>

                    <div style={{display:'flex',gap:'1rem',justifyContent:'flex-end'}}>
                        <button type="button" className="btn btn-secondary" onClick={onCancel} disabled={loading}>Cancel</button>
                        <button type="submit" className="btn btn-primary" disabled={loading || !stripeReady || !cardComplete}>
                            {loading ? 'Saving...' : '💳 Save Card'}
                        </button>
                    </div>

                    <p style={{marginTop:'1rem',fontSize:'0.85rem',color:'var(--text-muted)',textAlign:'center'}}>
                        🔒 Your card details are securely processed by Stripe
                    </p>
                </form>
            );
        }
