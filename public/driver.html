<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <title>RouteCRMPro - Driver</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            background: var(--bg-card);
            padding: calc(var(--safe-top) + 12px) 16px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .icon-btn:active {
            transform: scale(0.95);
            background: var(--primary);
        }
        
        /* Main Content */
        .main {
            padding: 16px;
            padding-bottom: calc(var(--safe-bottom) + 80px);
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }
        
        /* Route Summary Card */
        .route-summary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        
        .route-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .route-date {
            opacity: 0.9;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        
        .route-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }
        
        .route-stat {
            background: rgba(255,255,255,0.15);
            padding: 12px 8px;
            border-radius: 12px;
        }
        
        .route-stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        .route-stat-label {
            font-size: 0.7rem;
            opacity: 0.85;
            margin-top: 2px;
        }
        
        /* Progress Bar */
        .progress-container {
            margin-top: 16px;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 6px;
            opacity: 0.9;
        }
        
        /* Stop List */
        .stops-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .stops-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        .filter-btn.active {
            background: var(--primary);
        }
        
        /* Stop Card */
        .stop-card {
            background: var(--bg-card);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .stop-card.current {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }
        
        .stop-card.completed {
            opacity: 0.6;
        }
        
        .stop-card.skipped {
            opacity: 0.5;
            border-color: var(--warning);
        }
        
        .stop-header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 12px;
        }
        
        .stop-number {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .stop-card.completed .stop-number {
            background: var(--success);
        }
        
        .stop-card.skipped .stop-number {
            background: var(--warning);
        }
        
        .stop-info {
            flex: 1;
            min-width: 0;
        }
        
        .stop-customer {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .stop-address {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .stop-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .stop-status.pending {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }
        
        .stop-status.completed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .stop-status.skipped {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .stop-details {
            padding: 0 16px 16px;
            display: none;
        }
        
        .stop-card.expanded .stop-details {
            display: block;
        }
        
        .stop-detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stop-detail-item {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stop-detail-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        .stop-detail-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .tank-level {
            color: var(--success);
        }
        
        .tank-level.low {
            color: var(--danger);
        }
        
        .tank-level.medium {
            color: var(--warning);
        }
        
        /* Action Buttons */
        .stop-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .stop-actions.single {
            grid-template-columns: 1fr;
        }
        
        .btn {
            padding: 16px 24px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        
        .btn-navigate {
            background: #4285F4;
            color: white;
        }
        
        .btn-block {
            width: 100%;
        }
        
        .btn-lg {
            padding: 20px 24px;
            font-size: 1.1rem;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1.1rem;
            -webkit-appearance: none;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-input-large {
            font-size: 2rem;
            text-align: center;
            font-weight: 700;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            padding-bottom: calc(var(--safe-bottom) + 16px);
        }
        
        .modal {
            background: var(--bg-card);
            border-radius: 24px 24px 16px 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }
        
        .modal-footer .btn {
            flex: 1;
        }
        
        /* Customer Details in Modal */
        .customer-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .customer-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .customer-code {
            color: var(--text-muted);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: var(--bg-input);
            padding: 16px;
            border-radius: 12px;
        }
        
        .info-item.full-width {
            grid-column: span 2;
        }
        
        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 1rem;
            font-weight: 500;
        }
        
        .info-value.large {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .quick-action {
            background: var(--bg-input);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .quick-action:active {
            background: var(--primary);
        }
        
        .quick-action-icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        
        .quick-action-label {
            font-size: 0.85rem;
        }
        
        /* Notes */
        .notes-section {
            margin-top: 16px;
        }
        
        .notes-textarea {
            width: 100%;
            min-height: 100px;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            font-family: inherit;
        }
        
        /* Login Screen */
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-logo-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        
        .login-logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }
        
        .login-logo p {
            color: var(--text-secondary);
            margin-top: 8px;
        }
        
        .login-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 20px;
        }
        
        /* No Routes Message */
        .no-routes {
            text-align: center;
            padding: 60px 20px;
        }
        
        .no-routes-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .no-routes h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }
        
        .no-routes p {
            color: var(--text-secondary);
        }
        
        /* Route Selection */
        .route-select-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .route-select-card:active {
            border-color: var(--primary);
            transform: scale(0.98);
        }
        
        .route-select-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .route-select-name {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .route-select-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .route-select-stats {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-input);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 100px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        
        .toast.success {
            border-left: 4px solid var(--success);
        }
        
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px calc(var(--safe-bottom) + 8px);
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: none;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-item-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }
        
        .nav-item-label {
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        /* Utilities */
        .hidden {
            display: none !important;
        }
        
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .text-muted { color: var(--text-muted); }
        
        /* Animations */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        // API Helper
        const api = {
            token: localStorage.getItem('driver_token'),
            baseUrl: '/.netlify/functions',
            
            setToken(token) {
                this.token = token;
                localStorage.setItem('driver_token', token);
            },
            
            clearToken() {
                this.token = null;
                localStorage.removeItem('driver_token');
            },
            
            async request(endpoint, options = {}) {
                const url = `${this.baseUrl}${endpoint}`;
                const headers = {
                    'Content-Type': 'application/json',
                    ...(this.token && { 'Authorization': `Bearer ${this.token}` })
                };
                
                const response = await fetch(url, { ...options, headers });
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Request failed');
                }
                
                return data;
            }
        };
        
        // Toast Component
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            
            return (
                <div className={`toast ${type}`}>
                    {type === 'success' ? '✓' : '✗'} {message}
                </div>
            );
        }
        
        // Login Screen
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                
                try {
                    const result = await api.request('/auth/portal-login', {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });
                    
                    api.setToken(result.token);
                    onLogin(result);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };
            
            return (
                <div className="login-container">
                    <div className="login-logo">
                        <div className="login-logo-icon">🚚</div>
                        <h1>RouteCRMPro</h1>
                        <p>Driver App</p>
                    </div>
                    
                    <form className="login-card" onSubmit={handleSubmit}>
                        {error && (
                            <div style={{background:'rgba(239,68,68,0.2)',color:'var(--danger)',padding:'12px',borderRadius:'12px',marginBottom:'16px',textAlign:'center'}}>
                                {error}
                            </div>
                        )}
                        
                        <div className="form-group">
                            <label className="form-label">Username or Email</label>
                            <input 
                                type="text" 
                                className="form-input" 
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                placeholder="Enter username"
                                autoCapitalize="none"
                                autoCorrect="off"
                                required
                            />
                        </div>
                        
                        <div className="form-group">
                            <label className="form-label">Password</label>
                            <input 
                                type="password" 
                                className="form-input" 
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                placeholder="Enter password"
                                required
                            />
                        </div>
                        
                        <button type="submit" className="btn btn-primary btn-block btn-lg" disabled={loading}>
                            {loading ? 'Signing In...' : '🔐 Sign In'}
                        </button>
                    </form>
                </div>
            );
        }
        
        // Route Selection Screen
        function RouteSelectScreen({ routes, onSelectRoute, loading, onRefresh, driverInfo }) {
            if (loading) {
                return (
                    <div className="loading">
                        <div className="spinner"></div>
                        <p style={{marginTop:'16px',color:'var(--text-secondary)'}}>Loading your routes...</p>
                    </div>
                );
            }
            
            const activeRoutes = routes.filter(r => r.status === 'in_progress' || r.status === 'scheduled');
            
            if (activeRoutes.length === 0) {
                return (
                    <div className="no-routes">
                        <div className="no-routes-icon">📭</div>
                        <h2>No Routes Assigned</h2>
                        <p>You don't have any routes scheduled for today.</p>
                        <p style={{marginTop:'8px',fontSize:'0.9rem'}}>Contact your dispatcher if you expected a route.</p>
                        <button className="btn btn-primary" style={{marginTop:'20px'}} onClick={onRefresh}>
                            ↻ Refresh
                        </button>
                    </div>
                );
            }
            
            return (
                <div className="main">
                    <h2 style={{marginBottom:'16px'}}>Your Routes ({activeRoutes.length})</h2>
                    {activeRoutes.map(route => (
                        <div key={route.id} className="route-select-card" onClick={() => onSelectRoute(route)}>
                            <div className="route-select-header">
                                <div>
                                    <div className="route-select-name">{route.name || `Route ${route.id.slice(0,8)}`}</div>
                                    <div className="route-select-date">
                                        {new Date(route.scheduled_date).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}
                                        {route.dc_name && <span> • {route.dc_name}</span>}
                                    </div>
                                </div>
                                <span className={`stop-status ${route.status}`}>
                                    {route.status === 'in_progress' ? 'In Progress' : 'Scheduled'}
                                </span>
                            </div>
                            <div className="route-select-stats">
                                <span>🛑 {route.total_stops} stops</span>
                                <span>✓ {route.stops_completed || 0} done</span>
                                <span>📏 {route.estimated_miles ? parseFloat(route.estimated_miles).toFixed(1) : '—'} mi</span>
                            </div>
                            {route.truck_code && (
                                <div style={{marginTop:'8px',fontSize:'0.85rem',color:'var(--text-muted)'}}>
                                    🚚 {route.truck_code} {route.truck_make && `(${route.truck_make} ${route.truck_model})`}
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }
        
        // Complete Stop Modal
        function CompleteStopModal({ stop, onComplete, onSkip, onClose }) {
            const [gallons, setGallons] = useState('');
            const [tankAfter, setTankAfter] = useState('');
            const [notes, setNotes] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSkip, setShowSkip] = useState(false);
            const [skipReason, setSkipReason] = useState('');
            
            const estimatedGallons = Math.round(stop.tank_size_gallons * (1 - (stop.tank_level_before || 50) / 100));
            
            const handleComplete = async () => {
                if (!gallons || parseFloat(gallons) <= 0) {
                    alert('Please enter gallons delivered');
                    return;
                }
                
                setLoading(true);
                try {
                    await onComplete({
                        gallons_delivered: parseFloat(gallons),
                        tank_level_after: tankAfter ? parseInt(tankAfter) : null,
                        notes
                    });
                } finally {
                    setLoading(false);
                }
            };
            
            const handleSkip = async () => {
                if (!skipReason.trim()) {
                    alert('Please enter a reason for skipping');
                    return;
                }
                
                setLoading(true);
                try {
                    await onSkip(skipReason);
                } finally {
                    setLoading(false);
                }
            };
            
            const navigateToCustomer = () => {
                const address = `${stop.address}, ${stop.city}, ${stop.state} ${stop.zip}`;
                const url = `https://maps.apple.com/?daddr=${encodeURIComponent(address)}`;
                window.open(url, '_blank');
            };
            
            const callCustomer = () => {
                if (stop.phone) {
                    window.location.href = `tel:${stop.phone}`;
                }
            };
            
            return (
                <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <div className="modal">
                        <div className="modal-header">
                            <h2 className="modal-title">
                                {showSkip ? '⚠️ Skip Stop' : `Stop #${stop.stop_number}`}
                            </h2>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>
                        
                        <div className="modal-body">
                            {!showSkip ? (
                                <>
                                    {/* Customer Info */}
                                    <div className="customer-header">
                                        <div className="customer-name">{stop.customer_name}</div>
                                        <div className="customer-code">{stop.customer_code}</div>
                                    </div>
                                    
                                    {/* Quick Actions */}
                                    <div className="quick-actions">
                                        <button className="quick-action" onClick={navigateToCustomer}>
                                            <div className="quick-action-icon">🧭</div>
                                            <div className="quick-action-label">Navigate</div>
                                        </button>
                                        <button className="quick-action" onClick={callCustomer} disabled={!stop.phone}>
                                            <div className="quick-action-icon">📞</div>
                                            <div className="quick-action-label">Call</div>
                                        </button>
                                    </div>
                                    
                                    {/* Address & Info */}
                                    <div className="info-grid">
                                        <div className="info-item full-width">
                                            <div className="info-label">Address</div>
                                            <div className="info-value">{stop.address}, {stop.city}, {stop.state} {stop.zip}</div>
                                        </div>
                                        <div className="info-item">
                                            <div className="info-label">Tank Size</div>
                                            <div className="info-value large">{stop.tank_size_gallons} gal</div>
                                        </div>
                                        <div className="info-item">
                                            <div className="info-label">Current Level</div>
                                            <div className={`info-value large tank-level ${(stop.tank_level_before || 50) <= 25 ? 'low' : (stop.tank_level_before || 50) <= 50 ? 'medium' : ''}`}>
                                                {stop.tank_level_before || '?'}%
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {stop.delivery_instructions && (
                                        <div className="info-item" style={{marginBottom:'16px',background:'rgba(245,158,11,0.2)'}}>
                                            <div className="info-label">⚠️ Special Instructions</div>
                                            <div className="info-value">{stop.delivery_instructions}</div>
                                        </div>
                                    )}
                                    
                                    {/* Delivery Form */}
                                    <div className="form-group">
                                        <label className="form-label">Gallons Delivered *</label>
                                        <input 
                                            type="number" 
                                            className="form-input form-input-large" 
                                            value={gallons}
                                            onChange={(e) => setGallons(e.target.value)}
                                            placeholder={estimatedGallons.toString()}
                                            inputMode="decimal"
                                            step="0.1"
                                        />
                                        <div style={{textAlign:'center',marginTop:'8px',color:'var(--text-muted)',fontSize:'0.85rem'}}>
                                            Estimated: ~{estimatedGallons} gallons needed
                                        </div>
                                    </div>
                                    
                                    <div className="form-group">
                                        <label className="form-label">Tank Level After (Optional)</label>
                                        <input 
                                            type="number" 
                                            className="form-input" 
                                            value={tankAfter}
                                            onChange={(e) => setTankAfter(e.target.value)}
                                            placeholder="e.g., 80"
                                            inputMode="numeric"
                                            min="0"
                                            max="100"
                                        />
                                    </div>
                                    
                                    <div className="form-group">
                                        <label className="form-label">Notes (Optional)</label>
                                        <textarea 
                                            className="notes-textarea" 
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            placeholder="Any notes about this delivery..."
                                        />
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="customer-header">
                                        <div className="customer-name">{stop.customer_name}</div>
                                        <p style={{color:'var(--text-secondary)',marginTop:'8px'}}>
                                            Please provide a reason for skipping this stop.
                                        </p>
                                    </div>
                                    
                                    <div className="form-group">
                                        <label className="form-label">Reason for Skipping *</label>
                                        <select 
                                            className="form-input" 
                                            value={skipReason}
                                            onChange={(e) => setSkipReason(e.target.value)}
                                        >
                                            <option value="">Select a reason...</option>
                                            <option value="Customer not home">Customer not home</option>
                                            <option value="Unable to access tank">Unable to access tank</option>
                                            <option value="Customer refused delivery">Customer refused delivery</option>
                                            <option value="Road blocked/inaccessible">Road blocked/inaccessible</option>
                                            <option value="Weather conditions">Weather conditions</option>
                                            <option value="Tank full">Tank already full</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    
                                    {skipReason === 'Other' && (
                                        <div className="form-group">
                                            <label className="form-label">Please specify</label>
                                            <textarea 
                                                className="notes-textarea" 
                                                onChange={(e) => setSkipReason(e.target.value)}
                                                placeholder="Enter reason..."
                                            />
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                        
                        <div className="modal-footer">
                            {!showSkip ? (
                                <>
                                    <button className="btn btn-warning" onClick={() => setShowSkip(true)}>
                                        ⚠️ Skip
                                    </button>
                                    <button className="btn btn-success" onClick={handleComplete} disabled={loading}>
                                        {loading ? '...' : '✓ Complete'}
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button className="btn btn-secondary" onClick={() => setShowSkip(false)}>
                                        ← Back
                                    </button>
                                    <button className="btn btn-warning" onClick={handleSkip} disabled={loading}>
                                        {loading ? '...' : 'Confirm Skip'}
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        // Active Route Screen
        function ActiveRouteScreen({ route, driverInfo, truckInfo, onBack, onRefresh, showToast }) {
            const [routeData, setRouteData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedStop, setSelectedStop] = useState(null);
            const [expandedStop, setExpandedStop] = useState(null);
            const [filter, setFilter] = useState('all');
            
            useEffect(() => {
                loadRouteDetails();
            }, [route.id]);
            
            const loadRouteDetails = async () => {
                try {
                    setLoading(true);
                    const data = await api.request(`/routes-v2/runs/${route.id}`);
                    setRouteData(data);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };
            
            const startRoute = async () => {
                try {
                    await api.request(`/routes-v2/runs/${route.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: 'in_progress' })
                    });
                    loadRouteDetails();
                    showToast('Route started!', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };
            
            const completeStop = async (stopId, data) => {
                try {
                    await api.request(`/routes-v2/runs/${route.id}/stops/${stopId}/complete`, {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    setSelectedStop(null);
                    loadRouteDetails();
                    showToast('Stop completed!', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };
            
            const skipStop = async (stopId, reason) => {
                try {
                    await api.request(`/routes-v2/runs/${route.id}/stops/${stopId}/skip`, {
                        method: 'POST',
                        body: JSON.stringify({ reason })
                    });
                    setSelectedStop(null);
                    loadRouteDetails();
                    showToast('Stop skipped', 'success');
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };
            
            const navigateToStop = (stop) => {
                const address = `${stop.address}, ${stop.city}, ${stop.state} ${stop.zip}`;
                const url = `https://maps.apple.com/?daddr=${encodeURIComponent(address)}`;
                window.open(url, '_blank');
            };
            
            if (loading) {
                return (
                    <div className="loading">
                        <div className="spinner"></div>
                        <p style={{marginTop:'16px',color:'var(--text-secondary)'}}>Loading route...</p>
                    </div>
                );
            }
            
            const stops = routeData?.stops || [];
            const completed = stops.filter(s => s.status === 'completed').length;
            const skipped = stops.filter(s => s.status === 'skipped').length;
            const pending = stops.filter(s => s.status === 'pending').length;
            const progress = stops.length > 0 ? ((completed / stops.length) * 100) : 0;
            
            const filteredStops = filter === 'all' 
                ? stops 
                : stops.filter(s => s.status === filter);
            
            const nextPendingStop = stops.find(s => s.status === 'pending');
            
            return (
                <>
                    <div className="header">
                        <div className="header-content">
                            <h1>
                                <button className="icon-btn" onClick={onBack} style={{marginRight:'8px'}}>←</button>
                                {routeData?.name || 'Route'}
                            </h1>
                            <div className="header-actions">
                                <button className="icon-btn" onClick={loadRouteDetails}>↻</button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="main">
                        {/* Route Summary */}
                        <div className="card route-summary">
                            <div className="route-date">
                                {new Date(routeData?.scheduled_date).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'})}
                            </div>
                            
                            <div className="route-stats">
                                <div className="route-stat">
                                    <div className="route-stat-value">{stops.length}</div>
                                    <div className="route-stat-label">Total Stops</div>
                                </div>
                                <div className="route-stat">
                                    <div className="route-stat-value">{completed}</div>
                                    <div className="route-stat-label">Completed</div>
                                </div>
                                <div className="route-stat">
                                    <div className="route-stat-value">{skipped}</div>
                                    <div className="route-stat-label">Skipped</div>
                                </div>
                                <div className="route-stat">
                                    <div className="route-stat-value">{pending}</div>
                                    <div className="route-stat-label">Remaining</div>
                                </div>
                            </div>
                            
                            <div className="progress-container">
                                <div className="progress-bar">
                                    <div className="progress-fill" style={{width:`${progress}%`}}></div>
                                </div>
                                <div className="progress-text">
                                    <span>{progress.toFixed(0)}% Complete</span>
                                    <span>{parseFloat(routeData?.total_gallons_delivered || 0).toFixed(0)} gal delivered</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Start Route Button */}
                        {routeData?.status === 'scheduled' && (
                            <button className="btn btn-success btn-block btn-lg" onClick={startRoute} style={{marginBottom:'16px'}}>
                                🚀 Start Route
                            </button>
                        )}
                        
                        {/* Navigate to Next Stop */}
                        {nextPendingStop && routeData?.status === 'in_progress' && (
                            <button className="btn btn-navigate btn-block btn-lg" onClick={() => navigateToStop(nextPendingStop)} style={{marginBottom:'16px'}}>
                                🧭 Navigate to Next Stop
                            </button>
                        )}
                        
                        {/* Filter Tabs */}
                        <div className="stops-header">
                            <h3 className="stops-title">Stops</h3>
                            <div style={{display:'flex',gap:'8px'}}>
                                <button className={`filter-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>All</button>
                                <button className={`filter-btn ${filter === 'pending' ? 'active' : ''}`} onClick={() => setFilter('pending')}>Pending</button>
                                <button className={`filter-btn ${filter === 'completed' ? 'active' : ''}`} onClick={() => setFilter('completed')}>Done</button>
                            </div>
                        </div>
                        
                        {/* Stops List */}
                        {filteredStops.map((stop, idx) => {
                            const isExpanded = expandedStop === stop.id;
                            const isCurrent = stop.status === 'pending' && stop.id === nextPendingStop?.id;
                            const tankLevel = stop.tank_level_before || 50;
                            
                            return (
                                <div 
                                    key={stop.id} 
                                    className={`stop-card ${stop.status} ${isCurrent ? 'current' : ''} ${isExpanded ? 'expanded' : ''}`}
                                >
                                    <div className="stop-header" onClick={() => setExpandedStop(isExpanded ? null : stop.id)}>
                                        <div className="stop-number">
                                            {stop.status === 'completed' ? '✓' : stop.status === 'skipped' ? '⚠' : stop.stop_number}
                                        </div>
                                        <div className="stop-info">
                                            <div className="stop-customer">{stop.customer_name}</div>
                                            <div className="stop-address">{stop.address}, {stop.city}</div>
                                        </div>
                                        <span className={`stop-status ${stop.status}`}>
                                            {stop.status === 'completed' ? `${stop.gallons_delivered}g` : stop.status}
                                        </span>
                                    </div>
                                    
                                    <div className="stop-details">
                                        <div className="stop-detail-grid">
                                            <div className="stop-detail-item">
                                                <div className="stop-detail-value">{stop.tank_size_gallons}g</div>
                                                <div className="stop-detail-label">Tank Size</div>
                                            </div>
                                            <div className="stop-detail-item">
                                                <div className={`stop-detail-value tank-level ${tankLevel <= 25 ? 'low' : tankLevel <= 50 ? 'medium' : ''}`}>
                                                    {tankLevel}%
                                                </div>
                                                <div className="stop-detail-label">Tank Level</div>
                                            </div>
                                            <div className="stop-detail-item">
                                                <div className="stop-detail-value">${stop.price_per_gallon || '—'}</div>
                                                <div className="stop-detail-label">Price/Gal</div>
                                            </div>
                                        </div>
                                        
                                        {stop.status === 'pending' && routeData?.status === 'in_progress' && (
                                            <div className="stop-actions">
                                                <button className="btn btn-navigate" onClick={() => navigateToStop(stop)}>
                                                    🧭 Navigate
                                                </button>
                                                <button className="btn btn-success" onClick={() => setSelectedStop(stop)}>
                                                    ✓ Complete
                                                </button>
                                            </div>
                                        )}
                                        
                                        {stop.status === 'completed' && (
                                            <div style={{background:'var(--bg-input)',padding:'12px',borderRadius:'12px',fontSize:'0.9rem'}}>
                                                <div><strong>Delivered:</strong> {stop.gallons_delivered} gallons</div>
                                                {stop.tank_level_after && <div><strong>Tank After:</strong> {stop.tank_level_after}%</div>}
                                                {stop.notes && <div style={{marginTop:'8px',color:'var(--text-secondary)'}}>{stop.notes}</div>}
                                            </div>
                                        )}
                                        
                                        {stop.status === 'skipped' && (
                                            <div style={{background:'rgba(245,158,11,0.2)',padding:'12px',borderRadius:'12px',fontSize:'0.9rem'}}>
                                                <strong>Reason:</strong> {stop.skip_reason || 'Not specified'}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    {/* Complete Stop Modal */}
                    {selectedStop && (
                        <CompleteStopModal 
                            stop={selectedStop}
                            onComplete={(data) => completeStop(selectedStop.id, data)}
                            onSkip={(reason) => skipStop(selectedStop.id, reason)}
                            onClose={() => setSelectedStop(null)}
                        />
                    )}
                </>
            );
        }
        
        // Main App
        function DriverApp() {
            const [user, setUser] = useState(null);
            const [driverInfo, setDriverInfo] = useState(null);
            const [truckInfo, setTruckInfo] = useState(null);
            const [routes, setRoutes] = useState([]);
            const [selectedRoute, setSelectedRoute] = useState(null);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            
            useEffect(() => {
                checkAuth();
            }, []);
            
            const checkAuth = async () => {
                if (!api.token) {
                    setLoading(false);
                    return;
                }
                
                try {
                    const userData = await api.request('/auth/me');
                    setUser(userData.user);
                    
                    // Check if user is a driver
                    if (userData.driver) {
                        setDriverInfo(userData.driver);
                    }
                    if (userData.truck) {
                        setTruckInfo(userData.truck);
                    }
                    
                    loadRoutes();
                } catch (err) {
                    api.clearToken();
                    setLoading(false);
                }
            };
            
            const loadRoutes = async () => {
                try {
                    setLoading(true);
                    // Use the driver-specific endpoint
                    const data = await api.request('/routes-v2/my-routes');
                    setRoutes(data.routes || []);
                    
                    // Update driver/truck info if returned
                    if (data.driver) setDriverInfo(data.driver);
                    if (data.truck) setTruckInfo(data.truck);
                } catch (err) {
                    // If no driver linked, show friendly message
                    if (err.message.includes('No driver profile')) {
                        showToast('Your account is not linked to a driver profile. Please contact your dispatcher.', 'error');
                    } else {
                        showToast(err.message, 'error');
                    }
                    setRoutes([]);
                } finally {
                    setLoading(false);
                }
            };
            
            const handleLogin = (result) => {
                setUser(result.user);
                loadRoutes();
            };
            
            const handleLogout = () => {
                api.clearToken();
                setUser(null);
                setDriverInfo(null);
                setTruckInfo(null);
                setRoutes([]);
                setSelectedRoute(null);
            };
            
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };
            
            // Not logged in
            if (!user && !loading) {
                return <LoginScreen onLogin={handleLogin} />;
            }
            
            // Logged in - show route selection or active route
            return (
                <>
                    {selectedRoute ? (
                        <ActiveRouteScreen 
                            route={selectedRoute}
                            driverInfo={driverInfo}
                            truckInfo={truckInfo}
                            onBack={() => { setSelectedRoute(null); loadRoutes(); }}
                            onRefresh={loadRoutes}
                            showToast={showToast}
                        />
                    ) : (
                        <>
                            <div className="header">
                                <div className="header-content">
                                    <h1>🚚 {driverInfo?.name || user?.name || 'Driver'}</h1>
                                    <div className="header-actions">
                                        <button className="icon-btn" onClick={loadRoutes}>↻</button>
                                        <button className="icon-btn" onClick={handleLogout}>🚪</button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Driver/Truck Info Card */}
                            {(driverInfo || truckInfo) && (
                                <div className="main" style={{paddingBottom:0}}>
                                    <div className="card" style={{background:'linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%)'}}>
                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                            <div>
                                                <div style={{fontSize:'0.8rem',opacity:0.8}}>Driver</div>
                                                <div style={{fontSize:'1.1rem',fontWeight:'600'}}>{driverInfo?.name || 'Not assigned'}</div>
                                                {driverInfo?.dcName && (
                                                    <div style={{fontSize:'0.85rem',opacity:0.8,marginTop:'4px'}}>📍 {driverInfo.dcName}</div>
                                                )}
                                            </div>
                                            {truckInfo && (
                                                <div style={{textAlign:'right'}}>
                                                    <div style={{fontSize:'0.8rem',opacity:0.8}}>Truck</div>
                                                    <div style={{fontSize:'1.1rem',fontWeight:'600'}}>{truckInfo.code}</div>
                                                    <div style={{fontSize:'0.85rem',opacity:0.8,marginTop:'4px'}}>
                                                        {truckInfo.make} {truckInfo.model}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        {truckInfo && (
                                            <div style={{display:'flex',justifyContent:'space-around',marginTop:'16px',paddingTop:'12px',borderTop:'1px solid rgba(255,255,255,0.2)'}}>
                                                <div style={{textAlign:'center'}}>
                                                    <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{truckInfo.capacityGallons || '—'}</div>
                                                    <div style={{fontSize:'0.7rem',opacity:0.8}}>Capacity (gal)</div>
                                                </div>
                                                <div style={{textAlign:'center'}}>
                                                    <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{truckInfo.licensePlate || '—'}</div>
                                                    <div style={{fontSize:'0.7rem',opacity:0.8}}>License Plate</div>
                                                </div>
                                                <div style={{textAlign:'center'}}>
                                                    <div style={{fontSize:'1.25rem',fontWeight:'700'}}>{truckInfo.currentOdometer?.toLocaleString() || '—'}</div>
                                                    <div style={{fontSize:'0.7rem',opacity:0.8}}>Odometer</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                            
                            <RouteSelectScreen 
                                routes={routes}
                                loading={loading}
                                onSelectRoute={setSelectedRoute}
                                onRefresh={loadRoutes}
                                driverInfo={driverInfo}
                            />
                        </>
                    )}
                    
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)}
                        />
                    )}
                </>
            );
        }
        
        // Mount app
        ReactDOM.createRoot(document.getElementById('root')).render(<DriverApp />);
    </script>
</body>
</html>
